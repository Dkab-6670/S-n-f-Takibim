<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sınıf Takip</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4338ca">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<style type="text/tailwindcss">
 .card{@apply bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 mb-3}
 .inp{@apply border border-slate-300 dark:border-slate-600 rounded-lg px-2 py-2 text-base bg-white dark:bg-slate-900 outline-none}
 .btn{@apply text-white text-sm font-semibold px-4 py-2 rounded-lg}
 [data-nav]{@apply flex-1 flex flex-col items-center justify-center text-[11px] text-slate-500 min-h-[56px] border-0 bg-transparent}
 [data-nav].on{@apply text-indigo-700 font-bold bg-indigo-50 dark:bg-slate-700 dark:text-indigo-300}
</style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen pb-20 md:pb-6">
<header class="bg-indigo-700 text-white shadow">
 <div class="max-w-6xl mx-auto px-3 py-2 flex flex-wrap items-center justify-between gap-2" style="padding-top:max(.5rem,env(safe-area-inset-top))">
  <b>🕌 Sınıf Takip</b>
  <div class="flex items-center gap-2 text-xs bg-indigo-800 rounded-lg px-2 py-1">
   <span id="dot" class="w-2.5 h-2.5 rounded-full bg-red-500"></span><span id="stx">Çevrimdışı</span>
   <button id="rc" class="font-mono font-bold text-yellow-300" title="Dokunun: 5 sn göster">-----</button>
   <button id="rcB" title="Oda kodunu değiştir">🔑</button><button id="th">🌙</button>
  </div>
 </div>
</header>
<nav id="tn" class="hidden md:flex max-w-6xl mx-auto mt-2 px-3 gap-2"></nav>
<main class="max-w-6xl mx-auto px-3 py-3">
 <div id="ptitle" class="sticky z-30 card font-bold text-lg flex flex-wrap items-center gap-x-3 gap-y-1" style="top:env(safe-area-inset-top,0px)"></div>
 <div id="view"></div>
</main>
<nav id="bn" class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white dark:bg-slate-800 border-t border-slate-300 dark:border-slate-700 flex" style="padding-bottom:env(safe-area-inset-bottom)"></nav>
<div id="toast" class="fixed right-3 bottom-24 md:bottom-4 z-50 text-white text-sm font-semibold px-4 py-2 rounded-full shadow-lg opacity-0 transition-opacity pointer-events-none"></div>
<div id="undo" class="fixed left-3 bottom-24 md:bottom-4 z-50 hidden items-center gap-3 bg-slate-800 text-white text-sm px-4 py-2 rounded-xl shadow-lg"><span id="undoMsg"></span><button id="undoBtn" class="bg-amber-400 text-slate-900 font-bold rounded-lg px-3 py-1">Geri Al</button></div>
<button id="up" class="fixed right-3 bottom-36 md:bottom-16 z-40 hidden w-11 h-11 rounded-full bg-indigo-700 text-white text-xl shadow-lg" title="Yukarı çık">↑</button>
<div id="off" class="fixed top-0 left-1/2 -translate-x-1/2 z-50 hidden text-white text-sm font-bold px-4 py-1 rounded-b-xl shadow-lg"></div>

<script>
/* ========== 1. AYARLAR ve YARDIMCILAR ========== */
const firebaseConfig = {
  apiKey: "AIzaSyBCYKK_JSTrLzLI2MfeZV3-p0OpgPpgN6I",
  authDomain: "sinif-takibim.firebaseapp.com",
  databaseURL: "https://sinif-takibim-default-rtdb.firebaseio.com",
  projectId: "sinif-takibim"
};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=s=>String(s??'').trim(), num=v=>parseInt(v)||0;
const lsg=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, lss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const _d=new Date(), today=new Date(_d-_d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const isO=v=>v!==null&&typeof v==='object';

/* ========== 2. DURUM ve VERİ BİÇİMİ ========== */
const KEYS=['students','lessons','ezberItems','homeworks'], PRE={students:'ST_',lessons:'L_',ezberItems:'E_',homeworks:'HW_'};
const S={students:[],lessons:[],ezberItems:[],homeworks:[],room:lsg('sync_room_code')||'',page:'home',F:{sinif:'ALL',sube:'ALL',q:''},G:{sinif:'ALL',sube:'ALL',donem:'1',date:today}};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function prepare(l,p){let m=l.reduce((a,x)=>Math.max(a,typeof x._o==='number'?x._o:-1),-1);l.forEach(x=>{if(!x.id)x.id=uid(p);if(typeof x._o!=='number')x._o=++m;});}
function toList(v,p){
  let a=Array.isArray(v)?v.filter(x=>x!=null):isO(v)?Object.entries(v).map(([k,x])=>{if(isO(x)&&!x.id)x.id=k;return x;}):[];
  a=a.map(x=>typeof x==='string'?{name:x,sinif:'ALL'}:x);prepare(a,p);return a.sort((x,y)=>x._o-y._o);
}
const toMap=l=>Object.fromEntries(l.map(x=>[x.id,x]));
const snap=()=>JSON.parse(JSON.stringify(Object.fromEntries(KEYS.map(k=>[k,toMap(S[k])]))));
const dump=()=>JSON.stringify(Object.fromEntries(KEYS.map(k=>[k,S[k]])));
const apply=o=>KEYS.forEach(k=>{S[k]=Array.isArray(o[k])?o[k]:[];});
function diff(u,p,o,n){
  if(n==null){if(o!=null)u[p]=null;return;}
  if(isO(n)&&isO(o)){new Set([...Object.keys(o),...Object.keys(n)]).forEach(k=>diff(u,p+'/'+k,o[k],n[k]));return;}
  if(JSON.stringify(o)!==JSON.stringify(n))u[p]=n;
}
const dayRec=(s,p,d)=>{s.periods=s.periods||{};const x=s.periods[p]=s.periods[p]||{hafiz:false,kuranDurum:'kuran',days:{}};x.days=x.days||{};
  const r=x.days[d]=x.days[d]||{};return r;};
const classes=()=>[...new Set(S.students.map(s=>T(s.sinif)))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'tr',{numeric:true}));
const subes=c=>[...new Set(S.students.filter(s=>c==='ALL'||T(s.sinif)===c).map(s=>T(s.sube).toLowerCase()))].filter(Boolean).sort();
const sorted=l=>l.slice().sort((a,b)=>num(a.sinif)-num(b.sinif)||String(a.sube).localeCompare(String(b.sube))||num(a.no)-num(b.no)||String(a.name).localeCompare(String(b.name),'tr'));

/* ========== 3. FIREBASE: giriş, dinleme, kayıt ========== */
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
let _auth=null,ref=null,last={},lastRoom='',online=true,queued=0,t2;
const auth=()=>_auth||(_auth=new Promise((ok,no)=>{const a=firebase.auth(),u=a.onAuthStateChanged(x=>{u();x?ok():a.signInAnonymously().then(ok,e=>{_auth=null;alert('Giriş hatası: '+e.message+'\nFirebase > Authentication > Anonymous açık mı?');no(e);});});}));
const genCode=()=>{const al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='SNF-';crypto.getRandomValues(new Uint32Array(16)).forEach(n=>{s+=al[n%al.length]});return s;};
const mask=c=>c.length>6?c.slice(0,4)+'•'.repeat(c.length-4):c;
function status(c,t){$('dot').className='w-2.5 h-2.5 rounded-full bg-'+c+'-500';$('stx').textContent=t;}
let tt;function toast(m,err){const t=$('toast');t.textContent=m;t.className=t.className.replace(/ bg-\S+/g,'')+(err?' bg-red-600':' bg-emerald-600')+' opacity-100';clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('opacity-100'),err?5000:1800);}
function listen(code){
  S.room=code;lss('sync_room_code',code);$('rc').textContent=mask(code);status('amber','Yükleniyor...');
  if(ref){ref.off();ref=null;}
  auth().then(()=>{
    ref=db.ref('rooms/'+code);
    ref.on('value',sn=>{
      const d=sn.val();
      if(d){KEYS.forEach(k=>{S[k]=toList(d[k],PRE[k]);});last=snap();lastRoom=code;if(KEYS.some(k=>Array.isArray(d[k])))sn.ref.update(last);}
      status('emerald','Canlı');render();
    },err=>{status('red','Bağlantı hatası');alert('Firebase hatası: '+err.message);});
  }).catch(()=>status('red','Giriş hatası'));
}
function save(){
  if(!S.room)return;
  KEYS.forEach(k=>prepare(S[k],PRE[k]));
  const now=snap(),u={},root='rooms/'+S.room;
  diff(u,root,lastRoom===S.room?last:{},now);u[root+'/lastUpdated']=firebase.database.ServerValue.TIMESTAMP;
  last=now;lastRoom=S.room;
  if(!online){queued++;offBar();}
  toast('Kaydediliyor…');
  auth().then(()=>db.ref().update(u)).then(()=>toast('Kaydedildi ✓')).catch(e=>toast('Kaydedilemedi: '+e.message,true));
}
function offBar(){const b=$('off');b.className=b.className.replace(/ bg-\S+/g,'')+' bg-red-600 block';b.classList.remove('hidden');b.textContent='📴 Çevrimdışı'+(queued?' · '+queued+' değişiklik bekliyor':'');}
firebase.database().ref('.info/connected').on('value',s=>{
  const was=online;online=!!s.val();clearTimeout(t2);
  if(!online){t2=setTimeout(()=>{if(!online)offBar();},3000);return;}
  const b=$('off');
  if(!was&&queued){b.className=b.className.replace(/ bg-\S+/g,'')+' bg-emerald-600 block';b.textContent='✅ '+queued+' değişiklik gönderildi';queued=0;setTimeout(()=>{if(online)b.classList.add('hidden');},2500);}
  else b.classList.add('hidden');
});
addEventListener('beforeunload',e=>{if(!online&&queued){e.preventDefault();e.returnValue='';}});

/* Geri al */
let U=null,ut;
function del(fn,msg){U=dump();fn();save();$('undoMsg').textContent=msg;$('undo').classList.remove('hidden');$('undo').classList.add('flex');clearTimeout(ut);ut=setTimeout(()=>{$('undo').classList.add('hidden');U=null;},10000);render(true);}
$('undoBtn').onclick=()=>{if(!U)return;apply(JSON.parse(U));U=null;$('undo').classList.add('hidden');save();render(true);};

/* ========== 4. SAYFA KAYIT SİSTEMİ (sıra önemli değil) ========== */
const P={},NAV=[];
function reg(id,icon,title,html,after,nav){P[id]={icon,title,html,after};if(nav)NAV.push([id,icon,nav]);drawNav();}
function drawNav(){
  const b=NAV.map(n=>'<button data-nav="'+n[0]+'" data-go="'+n[0]+'"><span class="text-xl">'+n[1]+'</span>'+esc(n[2])+'</button>').join('');
  $('bn').innerHTML=b;
  $('tn').innerHTML=NAV.map(n=>'<button data-nav="'+n[0]+'" data-go="'+n[0]+'" class="px-3 py-2 rounded-lg bg-white dark:bg-slate-800 border text-sm">'+n[1]+' '+esc(n[2])+'</button>').join('');
}
let pending=false;
const typing=()=>{const a=document.activeElement;return a&&$('view').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);};
function render(force){
  if(!force&&typing()){pending=true;return;}
  const p=P[S.page]||P.home;
  $('ptitle').innerHTML=(S.page!=='home'?'<button data-go="home" class="btn bg-indigo-600 !px-3 !py-1 whitespace-nowrap">🏠 Ana Sayfa</button>':'')+'<span>'+p.icon+' '+esc(p.title)+'</span>'+(S.page!=='home'?'<span class="ml-auto text-xs font-semibold bg-indigo-100 text-indigo-800 dark:bg-indigo-900 dark:text-indigo-200 rounded-full px-3 py-1 whitespace-nowrap">📌 '+(S.G.sinif==='ALL'?'Tüm sınıflar':esc(S.G.sinif)+(S.G.sube==='ALL'?'. sınıf':'/'+esc(S.G.sube.toUpperCase())))+'</span>':'');document.title=p.title+' | Sınıf Takip';
  $('view').innerHTML=p.html();if(p.after)p.after();
  document.documentElement.style.setProperty('--th',($('ptitle').offsetHeight+8)+'px');
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===S.page));
}
function go(id){S.page=P[id]?id:'home';render(true);scrollTo({top:0});}
$('view').addEventListener('focusout',()=>{if(pending){pending=false;setTimeout(render,0);}});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return;}
  const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act])ACT[a.dataset.act](a);
});
const ACT={};

/* ========== 5. SAYFA: ANA SAYFA ========== */
reg('home','🏠','Ana Sayfa',()=>{
  const cl=classes();
  return bdayBar()+'<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">'
   +[['Öğrenci',S.students.filter(s=>!s.absent).length],['Sınıf',cl.length],['Ders',S.lessons.length],['Ezber konusu',S.ezberItems.length]].map(x=>'<div class="card mb-0 text-center"><div class="text-2xl font-bold text-indigo-700 dark:text-indigo-300">'+x[1]+'</div><div class="text-xs text-slate-500">'+x[0]+'</div></div>').join('')+'</div>'
   +'<div class="grid grid-cols-2 md:grid-cols-3 gap-3">'+Object.keys(P).filter(k=>k!=='home').map(k=>'<button data-go="'+k+'" class="card mb-0 text-left"><div class="text-3xl">'+P[k].icon+'</div><b>'+esc(P[k].title)+'</b></button>').join('')+'</div>';
},null,'Ana Sayfa');

/* ========== 6. SAYFA: ÖĞRENCİLER ========== */
const okSube=v=>T(v).toLowerCase()||'a';
const filt=()=>sorted(S.students.filter(s=>{const f=S.F,q=f.q.toLowerCase();
  return (f.sinif==='ALL'||T(s.sinif)===f.sinif)&&(f.sube==='ALL'||T(s.sube).toLowerCase()===f.sube)&&(!q||String(s.name).toLowerCase().includes(q)||String(s.no).toLowerCase().includes(q));}));
function drawList(){
  const l=filt();$('ogrCnt').textContent=l.length+' / '+S.students.length;
  $('ogrList').innerHTML=l.length?l.map(s=>'<div class="card mb-2 flex flex-wrap items-center justify-between gap-2'+(s.absent?' opacity-60':'')+'"><div><b>'+esc(s.name)+'</b><div class="text-xs text-slate-500">No: '+esc(s.no)+' · '+esc(s.sinif)+'/'+esc(String(s.sube).toUpperCase())+(s.absent?' · 🚫 sürekli devamsız':'')+'</div></div><div class="flex gap-2"><button data-act="edit" data-id="'+esc(s.id)+'" class="px-2 py-1 rounded border">✏️</button><button data-act="abs" data-id="'+esc(s.id)+'" class="px-2 py-1 rounded border text-xs">'+(s.absent?'Aktif yap':'Devamsız yap')+'</button><button data-act="del" data-id="'+esc(s.id)+'" class="px-2 py-1 rounded border text-red-600">🗑️</button></div></div>').join(''):'<div class="card text-center text-sm text-slate-400">Öğrenci yok.</div>';
}
reg('ogr','👥','Öğrenciler',()=>{
  const F=S.F,opt=(a,v)=>a.map(x=>'<option value="'+esc(x[0])+'"'+(x[0]===v?' selected':'')+'>'+esc(x[1])+'</option>').join('');
  return '<div class="card"><b class="text-sm">Öğrenci ekle</b><div class="grid grid-cols-2 md:grid-cols-5 gap-2 mt-2"><input id="ns" class="inp" placeholder="Sınıf (7)"><input id="nb" class="inp" placeholder="Şube (d)"><input id="nn" class="inp" placeholder="Okul no"><input id="na" class="inp col-span-2" placeholder="Adı soyadı"></div><button data-act="add" class="btn bg-indigo-600 mt-2">➕ Ekle</button>'
   +'<details class="mt-3" data-keep="bOpen"'+(S.bOpen?' open':'')+'><summary class="text-xs cursor-pointer text-slate-500">Toplu ekle (S.No ⇥ Okul No ⇥ Sınıf ⇥ Şube ⇥ Ad Soyad)</summary><textarea id="nbulk" rows="5" class="inp w-full mt-2 text-xs font-mono"></textarea><button data-act="bulk" class="btn bg-slate-600 mt-2">Listeyi ekle</button></details></div>'
   +'<div class="card flex flex-wrap items-center gap-2"><select id="fs" class="inp">'+opt([['ALL','Tüm Sınıflar']].concat(classes().map(c=>[c,c+'. Sınıf'])),F.sinif)+'</select><select id="fb" class="inp">'+opt([['ALL','Tüm Şubeler']].concat(subes(F.sinif).map(x=>[x,x.toUpperCase()+' Şubesi'])),F.sube)+'</select><input id="fq" class="inp" placeholder="Ad / No ara" value="'+esc(F.q)+'"><b id="ogrCnt" class="text-sm"></b></div><div id="ogrList"></div>';
},drawList,'Öğrenci');
$('view').addEventListener('change',e=>{
  if(e.target.id==='fs'){S.F.sinif=e.target.value;S.F.sube='ALL';gsave();render(true);}
  if(e.target.id==='fb'){S.F.sube=e.target.value;gsave();render(true);}
});
$('view').addEventListener('input',e=>{if(e.target.id==='fq'){S.F.q=e.target.value;drawList();}});
const find=a=>S.students.find(x=>x.id===a.dataset.id);
Object.assign(ACT,{
  add(){
    const n=T($('na').value),s=T($('ns').value);
    if(!n||!s)return alert('Sınıf ve ad soyad gerekli.');
    S.students.push({id:uid('ST_'),sno:'',no:T($('nn').value)||'-',sinif:s,sube:okSube($('nb').value),name:n,periods:{}});
    save();render(true);
  },
  bulk(){
    let c=0,d=0;
    $('nbulk').value.split('\n').forEach(line=>{
      const p=line.split('\t').map(T);if(p.length<5||!p[4])return;
      const x={id:uid('ST_'),sno:p[0],no:p[1]||'-',sinif:p[2],sube:okSube(p[3]),name:p[4],periods:{}};
      if(S.students.some(y=>T(y.sinif)===x.sinif&&T(y.sube).toLowerCase()===x.sube&&String(y.no)===x.no&&x.no!=='-')){d++;return;}
      S.students.push(x);c++;
    });
    if(c)save();alert(c+' öğrenci eklendi'+(d?', '+d+' tekrar atlandı':'')+'.');render(true);
  },
  edit(a){
    const s=find(a);if(!s)return;
    const x=prompt('Sınıf:',s.sinif);if(x===null)return;const y=prompt('Şube:',s.sube);if(y===null)return;
    const z=prompt('Okul numarası:',s.no);if(z===null)return;const w=prompt('Adı soyadı:',s.name);if(w===null)return;
    s.sinif=T(x)||s.sinif;s.sube=okSube(y)||s.sube;s.no=T(z)||s.no;s.name=T(w)||s.name;save();render(true);
  },
  abs(a){const s=find(a);if(s){s.absent=!s.absent;save();render(true);}},
  del(a){const s=find(a);if(!s||!confirm(s.name+' silinsin mi?'))return;del(()=>{S.students=S.students.filter(x=>x!==s);},'1 öğrenci silindi');}
});

/* ========== 7. SAYFA: YEDEKLEME ========== */
reg('yedek','💾','Yedekleme',()=>{
  const l=lsg('bk_last')?Math.floor((Date.now()-(+lsg('bk_last')))/864e5):null;
  return '<div class="card"><p class="text-sm mb-3">'+(l===null?'Henüz yedek almadınız.':'Son yedek: '+(l===0?'bugün':l+' gün önce')+'.')+'</p><div class="flex flex-wrap gap-2"><button data-act="bkdl" class="btn bg-indigo-600">Yedek al (JSON)</button><button data-act="bkup" class="btn bg-slate-600">Yedekten yükle</button><input type="file" id="bkf" accept=".json" hidden></div><p class="text-xs text-slate-500 mt-3">Yedek dosyasını Drive ya da e-postanıza koyun. Sadece öğrenci, ders, ezber ve ödev tanımlarını içerir.</p></div>';
},null,null);
Object.assign(ACT,{
  bkdl(){const o={app:'sinif-takip',date:new Date().toISOString()};KEYS.forEach(k=>o[k]=S[k]);
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='sinif-takip-yedek-'+today+'.json';document.body.appendChild(a);a.click();a.remove();lss('bk_last',String(Date.now()));render(true);},
  bkup(){$('bkf').click();}
});
$('view').addEventListener('change',e=>{
  if(e.target.id!=='bkf'||!e.target.files[0])return;
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.students))throw 0;
    if(!confirm('Mevcut veriler değiştirilip yedekteki '+o.students.length+' öğrenci yüklenecek. Emin misiniz?'))return;
    U=dump();apply(o);save();render(true);toast('Yedek yüklendi');}catch(x){alert('Geçersiz yedek dosyası.');}};
  r.readAsText(e.target.files[0]);
});

/* ========== AŞAMA B: ÇALIŞMA ÇUBUĞU ve GÜNLÜK SAYFALAR ========== */
const G=S.G;
try{Object.assign(G,JSON.parse(lsg('gs_v1')||'{}'));}catch(e){}
G.date=today;G.q='';
['sinif','sube'].forEach(k=>Object.defineProperty(S.F,k,{get:()=>G[k],set:v=>{G[k]=v;},configurable:true,enumerable:true}));
const gsave=()=>lss('gs_v1',JSON.stringify({sinif:G.sinif,sube:G.sube,donem:G.donem}));
const rd=s=>((((s.periods||{})[G.donem]||{}).days||{})[G.date])||{};
const per=s=>(s.periods||{})[G.donem]||{};
const perO=s=>{s.periods=s.periods||{};return s.periods[G.donem]=s.periods[G.donem]||{hafiz:false,kuranDurum:'kuran',days:{}};};
const ap=(h,s)=>(h.sinif==='ALL'||T(s.sinif)===h.sinif)&&(h.sube==='ALL'||T(s.sube).toLowerCase()===h.sube);
const grp=()=>sorted(S.students.filter(s=>!s.absent&&(G.sinif==='ALL'||T(s.sinif)===G.sinif)&&(G.sube==='ALL'||T(s.sube).toLowerCase()===G.sube)&&(!G.q||(s.name+' '+s.no).toLowerCase().includes(G.q.toLowerCase()))));
const lsOf=s=>S.lessons.filter(l=>l.sinif==='ALL'||T(l.sinif)===T(s.sinif));
const ezOf=s=>[...new Set(S.ezberItems.filter(e=>e.sinif==='ALL'||T(e.sinif)===T(s.sinif)).map(e=>e.name))];
const hwOf=s=>S.homeworks.filter(h=>!h.rb&&h.start<=G.date&&G.date<=h.end&&ap(h,s));
const GR='bg-emerald-600 text-white border-emerald-600',RD='bg-red-600 text-white border-red-600',AM='bg-amber-500 text-white border-amber-500',KUR=/kur|yüzüne/i;
const BAD=/[.#$\/\[\]]/;

function gbar(){
  const o=(a,v)=>a.map(x=>'<option value="'+esc(x[0])+'"'+(x[0]===v?' selected':'')+'>'+esc(x[1])+'</option>').join('');
  return '<div class="card sticky z-20 flex flex-nowrap md:flex-wrap overflow-x-auto items-center gap-2 [&>*]:shrink-0" style="top:var(--th,60px)"><select data-g="sinif" class="inp">'+o([['ALL','Tüm Sınıflar']].concat(classes().map(c=>[c,c+'. Sınıf'])),G.sinif)+'</select><select data-g="sube" class="inp">'+o([['ALL','Tüm Şubeler']].concat(subes(G.sinif).map(x=>[x,x.toUpperCase()+' Şubesi'])),G.sube)+'</select><button data-act="gd" data-v="-1" class="inp font-bold">◀</button><input type="date" data-g="date" class="inp" value="'+G.date+'"><button data-act="gd" data-v="1" class="inp font-bold">▶</button><button data-act="gd" data-v="0" class="btn bg-indigo-600">Bugün</button><select data-g="donem" class="inp"><option value="1"'+(G.donem==='1'?' selected':'')+'>1. Dönem</option><option value="2"'+(G.donem==='2'?' selected':'')+'>2. Dönem</option></select><input data-g="q" class="inp w-36" placeholder="Ara..." value="'+esc(G.q)+'"></div>';
}
$('view').addEventListener('change',e=>{const g=e.target.dataset.g;if(!g||g==='q')return;G[g]=e.target.value||today;if(g==='sinif')G.sube='ALL';gsave();render(true);});
$('view').addEventListener('input',e=>{if(e.target.dataset.g==='q'){G.q=e.target.value;relist();}});
ACT.gd=a=>{const n=+a.dataset.v;if(!n)G.date=today;else{const d=new Date(G.date+'T12:00:00');d.setDate(d.getDate()+n);G.date=d.toISOString().slice(0,10);}render(true);};
const relist=()=>{const l=$('glist');if(l&&P[S.page]&&P[S.page].list)l.innerHTML=P[S.page].list();};
function gpage(id,icon,title,nav,top,list){
  reg(id,icon,title,()=>gbar()+(top?top():'')+'<div id="glist" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">'+list()+'</div>',null,nav);
  P[id].list=list;
}
const B=(s,f,v,txt,on,c)=>'<button data-act="m" data-f="'+f+'" data-v="'+esc(v)+'" data-id="'+esc(s.id)+'" class="flex-1 min-h-[44px] rounded-lg border font-semibold text-sm '+(on?c:'bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-600')+'">'+txt+'</button>';
const hd=s=>'<div class="font-semibold underline decoration-dotted cursor-pointer" data-act="card" data-id="'+esc(s.id)+'">'+esc(s.name)+'</div><div class="text-[11px] text-slate-500 mb-2">No: '+esc(s.no)+' · '+esc(s.sinif)+'/'+esc(String(s.sube).toUpperCase())+'</div>';
const stBtns=s=>{const v=rd(s).status||'None';return '<div class="flex gap-1.5">'+B(s,'status','Var','Var',v==='Var',GR)+B(s,'status','Yok','Yok',v==='Yok',RD)+B(s,'status','Izinli','İzinli',v==='Izinli',AM)+'</div>';};

/* işaretleme (tek yer) */
ACT.m=a=>{
  const s=find(a),f=a.dataset.f,v=a.dataset.v;if(!s)return;
  if(f==='hw'){const p=v.split(':');s.hwStatus=s.hwStatus||{};if(s.hwStatus[p[0]]===p[1])delete s.hwStatus[p[0]];else s.hwStatus[p[0]]=p[1];}
  else if(f==='hafiz'){const x=perO(s);x.hafiz=!x.hafiz;}
  else{
    const r=dayRec(s,G.donem,G.date);
    if(f==='status')r.status=r.status===v?'None':v;
    else if(f==='abdest')r.abdest=!r.abdest;
    else if(f==='book')r.book=r.book==='Yok'?'None':'Yok';
    else if(f==='slept')r.slept=!r.slept;
    else if(f==='points')r.points=(r.points||0)+(+v);
    else if(f==='ez'){const n=ezOf(s)[+v];if(!n)return;r.ezberStatus=r.ezberStatus||{};const c=r.ezberStatus[n]||'Baslamadi';r.ezberStatus[n]=c==='Baslamadi'?'DevamEdiyor':c==='DevamEdiyor'?'Tamamlandi':'Baslamadi';}
  }
  save();relist();
};
$('view').addEventListener('change',e=>{
  const c=e.target.dataset.chg;if(!c)return;
  const s=S.students.find(x=>x.id===e.target.dataset.id);if(!s)return;const v=e.target.value;
  if(c==='kd')perO(s).kuranDurum=v;
  else{const r=dayRec(s,G.donem,G.date);
    if(c==='score'){r.scores=r.scores||{};const n=e.target.dataset.v;if(v==='-')delete r.scores[n];else r.scores[n]=v;}
    else if(c==='note')r.notes=T(v);else if(c==='enote')r.ezberNotes=T(v);else if(c==='bn')r.bn=T(v);}
  save();relist();
});

/* Hızlı Yoklama */
gpage('yok','✅','Hızlı Yoklama','Yoklama',()=>'<div class="mb-3"><button data-act="allvar" class="btn bg-emerald-600">✅ İşaretsizleri "Var" yap</button></div>',()=>{
  const c={Var:0,Yok:0,Izinli:0,None:0};
  const cards=grp().map(s=>{const v=rd(s).status||'None';c[v]=(c[v]||0)+1;return '<div class="card mb-0'+(v==='Yok'?' !bg-red-50 dark:!bg-red-950':'')+'">'+hd(s)+stBtns(s)+'</div>';}).join('')||'<div class="card col-span-full text-center text-sm text-slate-400">Bu seçimde öğrenci yok.</div>';
  return '<div class="col-span-full text-sm font-bold">Var '+c.Var+' · Yok '+c.Yok+' · İzinli '+c.Izinli+' · İşaretsiz '+c.None+'</div>'+cards;
});
ACT.allvar=()=>{let n=0;grp().forEach(s=>{if((rd(s).status||'None')==='None'){dayRec(s,G.donem,G.date).status='Var';n++;}});if(n)save();relist();toast(n+' öğrenci "Var" yapıldı');};

gpage('ders','📚','Günlük Ders & Ödev','Ders',()=>'<div class="mb-3 flex gap-2"><button data-act="bulk1" data-v="1" class="btn bg-emerald-600">➕ Herkese +1</button><button data-act="bulk1" data-v="-1" class="btn bg-red-600">➖ Herkese −1</button></div>',()=>grp().map(s=>{
  const r=rd(s),cz=per(s).kuranDurum==='cuz',p=r.points||0,id=esc(s.id);
  const ls=lsOf(s).map(l=>{
    const cuz=cz&&KUR.test(l.name),ab=/kur/i.test(l.name)&&!r.abdest;
    const sel=cuz?'<span class="text-xs font-bold text-amber-700">📜 Cüzde · puan yok</span>':'<select data-chg="score" data-id="'+id+'" data-v="'+esc(l.name)+'" class="inp !py-1 !px-1 text-sm">'+['-',5,4,3,2,1].map(x=>'<option'+(String((r.scores||{})[l.name]||'-')===String(x)?' selected':'')+'>'+x+'</option>').join('')+'</select>';
    return '<div class="flex items-center justify-between gap-2 py-1"><span class="text-sm">'+esc(l.name)+(ab?' <span class="text-[10px] font-bold bg-blue-100 text-blue-800 rounded px-1.5">💧 Abdestsiz</span>':'')+'</span>'+sel+'</div>';
  }).join('');
  const hw=hwOf(s).map(h=>{const v=(s.hwStatus||{})[h.id];return '<div class="mt-1"><div class="text-xs mb-1">📚 '+esc(h.name)+'</div><div class="flex gap-1.5">'+B(s,'hw',h.id+':Yapti','Yaptı',v==='Yapti',GR)+B(s,'hw',h.id+':Yapmadi','Yapmadı',v==='Yapmadi',RD)+'</div></div>';}).join('');
  return '<div class="card mb-0">'+hd(s)+stBtns(s)
   +'<div class="flex items-center justify-center gap-3 my-2"><button data-act="m" data-id="'+id+'" data-f="points" data-v="-1" class="w-12 h-12 rounded-xl bg-red-100 text-red-700 text-2xl font-bold">−</button><b class="text-xl w-12 text-center">'+(p>0?'+':'')+p+'</b><button data-act="m" data-id="'+id+'" data-f="points" data-v="1" class="w-12 h-12 rounded-xl bg-emerald-100 text-emerald-700 text-2xl font-bold">+</button></div>'
   +'<div class="flex gap-1.5">'+B(s,'book','Yok','📕 Kitabı yok',r.book==='Yok',RD)+B(s,'slept','1','😴 Uyudu',r.slept,AM)+'</div><div class="mt-2">'+ls+'</div>'+hw
   +'<input data-chg="note" data-id="'+id+'" class="inp w-full mt-2 text-sm" placeholder="Günlük not" value="'+esc(r.notes||'')+'"></div>';
}).join('')||'<div class="card col-span-full text-center text-sm text-slate-400">Bu seçimde öğrenci yok.</div>');
ACT.bulk1=a=>{const d=+a.dataset.v,l=grp();if(!l.length||!confirm('Ekrandaki '+l.length+' öğrenciye '+(d>0?'+':'')+d+' puan verilsin mi?'))return;l.forEach(s=>{const r=dayRec(s,G.donem,G.date);r.points=(r.points||0)+d;});save();relist();};

/* Kur'an & Ezber Takibi */
gpage('ezber','📖',"Kur'an & Ezber Takibi",'Ezber',null,()=>grp().map(s=>{
  const r=rd(s),pr=per(s),kd=pr.kuranDurum||'kuran',id=esc(s.id);
  const eb=ezOf(s).map((n,i)=>{const v=(r.ezberStatus||{})[n]||'Baslamadi';return B(s,'ez',i,(v==='Tamamlandi'?'✓ ':v==='DevamEdiyor'?'⏳ ':'')+esc(n),v!=='Baslamadi',v==='Tamamlandi'?GR:AM);}).join('')||'<span class="text-xs text-slate-400 italic">Ezber konusu atanmadı (Tanımlar).</span>';
  return '<div class="card mb-0">'+hd(s)+'<div class="flex gap-1.5 mb-2">'+B(s,'abdest','1','💧 Abdestli',r.abdest,'bg-blue-600 text-white border-blue-600')+B(s,'hafiz','1','👳 Hafız',pr.hafiz,'bg-purple-600 text-white border-purple-600')
   +'<select data-chg="kd" data-id="'+id+'" class="inp text-sm flex-1"><option value="kuran"'+(kd==='kuran'?' selected':'')+'>📖 Kur\'an\'da</option><option value="cuz"'+(kd==='cuz'?' selected':'')+'>📜 Cüzde</option></select></div>'
   +'<div class="flex flex-wrap gap-1.5">'+eb+'</div><input data-chg="enote" data-id="'+id+'" class="inp w-full mt-2 text-sm" placeholder="Kaldığı ayet / not" value="'+esc(r.ezberNotes||'')+'"></div>';
}).join('')||'<div class="card col-span-full text-center text-sm text-slate-400">Bu seçimde öğrenci yok.</div>');

/* Tanımlar: ders, ezber, ödev atama */
const TS={ders:{all:false,set:{},name:''},ezber:{all:false,set:{},name:''},odev:{all:false,set:{},name:'',start:'',end:''}};
const ARR=k=>k==='ders'?S.lessons:k==='ezber'?S.ezberItems:k==='reh'?S.homeworks.filter(h=>h.rb):S.homeworks.filter(h=>!h.rb);
const tgt=x=>(x.sinif==='ALL'?'Tüm sınıflar':x.sinif+'. sınıf');
const chips=k=>{const t=TS[k],c='flex items-center gap-1.5 border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2 text-sm';
  return '<label class="'+c+'"><input type="checkbox" data-chip="'+k+'" data-v="ALL"'+(t.all?' checked':'')+'> Tüm sınıflar</label>'+classes().map(x=>'<label class="'+c+(t.all?' opacity-40':'')+'"><input type="checkbox" data-chip="'+k+'" data-v="'+esc(x)+'"'+(t.set[x]?' checked':'')+(t.all?' disabled':'')+'> '+esc(x)+'. Sınıf</label>').join('');};
const tlist=k=>ARR(k).map(x=>'<div class="flex items-center justify-between gap-2 text-sm border-b border-slate-200 dark:border-slate-700 py-1"><span><b>'+esc(x.name)+'</b> <span class="text-xs text-slate-500">'+esc(tgt(x))+(k==='odev'?' · '+esc(x.start)+' → '+esc(x.end):'')+'</span></span><span class="flex gap-1"><button data-act="tedit" data-k="'+k+'" data-id="'+esc(x.id||'')+'" class="px-2">✏️</button><button data-act="tdel" data-k="'+k+'" data-id="'+esc(x.id||'')+'" class="px-2 text-red-600">🗑️</button></span></div>').join('')||'<div class="text-xs text-slate-400 italic">Henüz yok.</div>';
const tsec=(k,title)=>'<div class="card"><b>'+title+'</b><div class="flex flex-wrap gap-2 my-2">'+chips(k)+'</div><div class="flex flex-wrap gap-2"><input data-tn="'+k+'" class="inp flex-1 min-w-[160px]" placeholder="Ad" value="'+esc(TS[k].name)+'">'
  +(k==='odev'?'<input type="date" data-td="start" class="inp" value="'+esc(TS.odev.start)+'"><input type="date" data-td="end" class="inp" value="'+esc(TS.odev.end)+'">':'')+'<button data-act="tadd" data-k="'+k+'" class="btn bg-indigo-600">Ekle</button></div><div class="mt-3">'+tlist(k)+'</div></div>';
reg('tan','⚙️','Ders, Ezber & Ödev Tanımları',()=>tsec('ders','📚 Ders ata')+tsec('ezber','📖 Ezber konusu ata')+tsec('odev','📝 Ödev ata (tarih aralığıyla)'),null,null);
$('view').addEventListener('input',e=>{const k=e.target.dataset.tn;if(k)TS[k].name=e.target.value;});
$('view').addEventListener('change',e=>{
  const d=e.target.dataset;
  if(d.td){TS.odev[d.td]=e.target.value;return;}
  if(d.chip){const t=TS[d.chip];if(d.v==='ALL')t.all=e.target.checked;else t.set[d.v]=e.target.checked;render(true);}
});
ACT.tadd=a=>{
  const k=a.dataset.k,t=TS[k],name=T(t.name);
  if(!name)return alert('Ad yazın.');
  if(BAD.test(name))return alert('Ad şu karakterleri içeremez: . # $ / [ ]');
  const tg=t.all?['ALL']:Object.keys(t.set).filter(x=>t.set[x]);
  if(!tg.length)return alert('Sınıf işaretleyin ya da "Tüm sınıflar"ı seçin.');
  if(k==='odev'&&(!t.start||!t.end||t.end<t.start))return alert('Başlangıç ve bitiş tarihini doğru seçin.');
  tg.forEach(x=>{if(k==='ders')S.lessons.push({name,sinif:x});else if(k==='ezber')S.ezberItems.push({name,sinif:x});else S.homeworks.push({name,sinif:x,sube:'ALL',start:t.start,end:t.end});});
  t.name='';save();render(true);
};
ACT.tedit=a=>{
  const k=a.dataset.k,it=ARR(k).find(x=>x.id===a.dataset.id);if(!it)return;
  let n=prompt('Ad:',it.name);if(n===null)return;n=T(n);
  if(!n||BAD.test(n))return alert('Ad boş olamaz ve . # $ / [ ] içeremez.');
  const s=prompt('Sınıf (ALL = tüm sınıflar):',it.sinif);if(s===null)return;
  if(k==='odev'){const p=prompt('Başlangıç (YYYY-AA-GG):',it.start);if(p===null)return;const q=prompt('Bitiş (YYYY-AA-GG):',it.end);if(q===null)return;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(T(p))||!/^\d{4}-\d{2}-\d{2}$/.test(T(q))||T(q)<T(p))return alert('Tarih hatalı.');it.start=T(p);it.end=T(q);}
  if(n!==it.name&&(k==='ders'||k==='ezber'))S.students.filter(st=>it.sinif==='ALL'||T(st.sinif)===it.sinif).forEach(st=>Object.values(st.periods||{}).forEach(p=>Object.values(p.days||{}).forEach(d=>{
    const o=k==='ezber'?d.ezberStatus:d.scores;if(o&&o[it.name]!==undefined){o[n]=o[it.name];delete o[it.name];}})));
  it.name=n;it.sinif=T(s).toUpperCase()==='ALL'?'ALL':T(s);save();render(true);
};
ACT.tdel=a=>{
  const k=a.dataset.k,it=ARR(k).find(x=>x.id===a.dataset.id);if(!it||!confirm('"'+it.name+'" silinsin mi?'))return;
  del(()=>{if(k==='ders')S.lessons=S.lessons.filter(x=>x!==it);else if(k==='ezber')S.ezberItems=S.ezberItems.filter(x=>x!==it);else S.homeworks=S.homeworks.filter(x=>x!==it);},'1 kayıt silindi');
};

const rbActs=()=>S.homeworks.filter(h=>h.rb&&(h.donem||'1')===G.donem&&(G.sinif==='ALL'||h.sinif==='ALL'||h.sinif===G.sinif));

const tgb=(k,t,v,on)=>'<button data-act="'+k+'" data-v="'+v+'" class="flex-1 min-h-[44px] rounded-lg border font-semibold text-sm '+(on?'bg-indigo-600 text-white border-indigo-600':'bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-600')+'">'+t+'</button>';

gpage('reh','🧭','Rehberlik Faaliyetleri',null,()=>'<details class="card" data-keep="kOpen"'+(S.kOpen?' open':'')+'><summary class="cursor-pointer font-semibold">➕ Yeni rehberlik çalışması ata ('+G.donem+'. dönem)</summary><div class="flex flex-wrap gap-2 my-2">'+chips('reh')+'</div><div class="flex gap-2"><input data-tn="reh" class="inp flex-1" placeholder="Çalışma adı" value="'+esc(TS.reh.name)+'"><button data-act="radd" class="btn bg-purple-600">Ata</button></div></details>',()=>{
  const acts=rbActs(),g=grp(),sw='<div class="col-span-full flex gap-2">'+tgb('rv','📋 Çalışma bazlı','act',S.rview==='act')+tgb('rv','👤 Öğrenci bazlı','stu',S.rview==='stu')+'</div>';
  if(!acts.length)return sw+'<div class="card col-span-full text-center text-sm text-slate-400">Bu dönem ve sınıf için rehberlik çalışması yok. Yukarıdan atayın.</div>';

const fdt=d=>d.slice(8)+'.'+d.slice(5,7)+'.'+d.slice(0,4);
const allD=s=>Object.entries(s.periods||{}).flatMap(([p,x])=>Object.entries(x.days||{})).sort((a,b)=>a[0]<b[0]?-1:1);
const dmin=n=>{const d=new Date(today+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
const netR=(s,a,b)=>allD(s).reduce((t,[d,r])=>d>=a&&d<=b?t+(r.points||0)+(r.bp||0):t,0);
const bestE=(s,n)=>{let m=0;const R={Baslamadi:0,DevamEdiyor:1,Tamamlandi:2};allD(s).forEach(([d,r])=>{const v=R[(r.ezberStatus||{})[n]];if(v>m)m=v;});return m;};
function badges(s){
  const o=[];let c=0,b=0;allD(s).forEach(([d,r])=>{c=r.abdest?c+1:0;if(c>b)b=c;});
  if(b>=10)o.push('🔥 '+b+' gün üst üste abdestli');
  const ez=ezOf(s);if(ez.length&&ez.every(n=>bestE(s,n)===2))o.push('🏆 Tüm ezberleri tamamladı');
  let top=null,td=2;
  S.students.filter(x=>!x.absent&&T(x.sinif)===T(s.sinif)&&T(x.sube).toLowerCase()===T(s.sube).toLowerCase()).forEach(x=>{const df=netR(x,dmin(-13),today)-netR(x,dmin(-27),dmin(-14));if(df>td){td=df;top=x;}});
  if(top&&top.id===s.id)o.push('📈 En çok gelişen (+'+td+')');
  return o;
}
function bdgHtml(s){const b=badges(s);return b.length?'<div style="margin:6px 0">'+b.map(x=>'<span style="display:inline-block;background:#fef3c7;border:1px solid #fcd34d;border-radius:12px;padding:1px 8px;font-size:12px;margin:2px 4px 2px 0">'+esc(x)+'</span>').join('')+'</div>':'';}

$('rc').onclick=()=>{if(!S.room)return;$('rc').textContent=S.room;setTimeout(()=>{$('rc').textContent=mask(S.room);},5000);};
function room(){
  const c=prompt('Oda kodunu girin.\nYeni oda oluşturmak için boş bırakıp Tamam deyin (mevcut veriler yeni odaya kopyalanır):');
  if(c===null)return;
  const code=T(c).toUpperCase();
  if(code){lastRoom='';listen(code);}
  else{const n=genCode();lastRoom='';S.room=n;listen(n);save();alert('Yeni oda kodunuz:\n'+n+'\n\nBir yere yazın. Diğer cihazlarda "🔑" ile bu kodu girin.');}
}
$('rcB').onclick=room;
$('up').onclick=()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('scroll',()=>$('up').classList.toggle('hidden',scrollY<300),{passive:true});
$('view').addEventListener('toggle',e=>{const k=e.target.dataset&&e.target.dataset.keep;if(k)S[k]=e.target.open;},true);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
go('home');
if(S.room)listen(S.room);else room();
</script>
</body>
</html>

/* ===== Ana sayfa araması: sayfalar, işlemler, öğrenciler ===== */
function hqN(t){return String(t||'').toLocaleLowerCase('tr').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();}
function hqCard(){return '<div class="card dx-search !py-1.5 !px-2"><input id="hq" type="search" class="inp w-full !py-1 text-sm" placeholder="🔎 Ara…" autocomplete="off" enterkeyhint="search"><div id="hqr" class="mt-2"></div></div>';}
function hqRun(v){
  const box=$('hqr');if(!box)return;const q=hqN(v);if(!q){box.innerHTML='';return;}
  const W=q.split(' ');const hit=txt=>{const n=hqN(txt);return W.every(w=>n.includes(w));};
  const KW={dsonu:'donem sonu eokul e okul not aktarim kopyala eksik kontrol karne sinav ortalama devamsizlik',menu:'menu tum sayfalar',sinav:'sinav not analiz yazili sozlu puan ortalama kazanim basari',nobet:'nobetci nobet sinif nobetcisi gunluk nobet dagitim kura',gplan:'gunluk plan ders plani gunluk ders plani konu kazanim yontem arac gerec cikti yazdir',grupmsj:'grup mesaj whatsapp toplu duyuru tebrik kitap getirmeyenler gelmeyenler sinif grubu',dini:'dini zikir zikirmatik esma esmaul husna namaz vakti vakitleri ezan tesbih',ogr:'ogrenci ekle liste excel toplu fotograf izin sinif sube numara sil',yedek:'yedek indir yukle json excel rapor geri yukle',stat:'istatistik grafik en cok ezber puan siralama gizle sira kutu',uyari:'uyari bildirim devamsiz odev yapmayan',ayar:'ayarlar cikis hesap pin kilit tema karanlik profil tanim oda kodu guvenlik ekran',akv:'akvaryum balik',tahta:'tahta akilli kiosk kod bekleme ogrenci ekrani',yplan:'yillik plan haftalik ders plani etkinlik meb cerceve excel yukle',bugun:'bugun yoklama ders programi',cikti:'cikti yazdir pdf liste cizelge karne veli izin belgesi',yok:'yoklama devam var yok izinli',ders:'ders puan program',ezber:'ezber cuz sure',odevhiz:'odev hizli kontrol',dav:'davranis puan not',reh:'rehberlik calisma',oturma:'oturma plani sira',soz:'soz hakki kura',haf:'hafizlik cuz cizelge',donem:'donem cizelge haftalik aylik',karne:'karne yazdir pdf'};
  const res=[];
  Object.keys(P).forEach(k=>{if(k==='home'||!pageOn(k))return;const p=P[k];if(hit(p.title+' '+(KW[k]||'')))res.push(['<button data-go="'+k+'" class="w-full text-left flex items-center gap-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm"><span class="text-xl">'+p.icon+'</span><b class="flex-1">'+esc(p.title)+'</b><span class="text-[11px] text-slate-400">Sayfa</span></button>',hqN(p.title).startsWith(W[0])?0:1]);});
  [['🗓️','Haftalık ders programım','hprog','haftalik ders programi program saat gun bugunku dersler'],['📷','Toplu fotoğraf ekle','pbopen','toplu fotograf ekle ogrenci resim foto izin'],['👨‍👩‍👧','Veli bilgilerini Excel ile yükle','vlxl','veli bilgi iletisim telefon anne baba excel yukle e okul'],['🚪','Çıkış yap','tchout','cikis yap hesap oturum kapat'],['🆕','Neler yeni (Yenilikler)','news','yenilik yenilikler neler yeni surum yeni ozellik']].forEach(x=>{if(hit(x[1]+' '+x[3]))res.push(['<button data-act="'+x[2]+'" class="w-full text-left flex items-center gap-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm"><span class="text-xl">'+x[0]+'</span><b class="flex-1">'+esc(x[1])+'</b><span class="text-[11px] text-slate-400">İşlem</span></button>',1]);});
  res.sort((a,b)=>a[1]-b[1]);
  const st=S.students.filter(s=>hit(s.name+' '+s.no+' '+s.sinif+' '+s.sinif+String(s.sube))).slice(0,8).map(s=>'<button data-act="card" data-id="'+esc(s.id)+'" class="w-full text-left flex items-center gap-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm">'+(s.photo?av(s,28):'<span class="text-xl">👤</span>')+'<b class="flex-1">'+esc(s.name)+'</b><span class="text-[11px] text-slate-400">'+esc(s.sinif)+'/'+esc(String(s.sube).toUpperCase())+' · '+esc(s.no)+'</span></button>');
  const all=res.map(x=>x[0]).slice(0,10).concat(st);
  box.innerHTML=all.length?'<div class="space-y-1.5">'+all.join('')+'</div>':'<div class="text-xs text-slate-400 italic">Sonuç bulunamadı. Başka bir sözcük deneyin.</div>';
}

},null,'Ana Sayfa');

const filt=()=>sorted(S.students.filter(s=>{const f=S.F,q=f.q.toLowerCase();
  return (f.sinif==='ALL'||T(s.sinif)===f.sinif)&&(f.sube==='ALL'||T(s.sube).toLowerCase()===f.sube)&&(!q||String(s.name).toLowerCase().includes(q)||String(s.no).toLowerCase().includes(q));}));
function drawList(){
  const l=filt();$('ogrCnt').textContent=(S.F.sinif==='ALL'?'Tüm sınıflar':S.F.sinif+(S.F.sube==='ALL'?'. sınıf':'/'+S.F.sube.toUpperCase()))+': '+l.length+' öğrenci'+(l.length!==S.students.length?' (toplam '+S.students.length+')':'');

reg('ogr','👥','Öğrenciler',()=>{
  const F=S.F,opt=(a,v)=>a.map(x=>'<option value="'+esc(x[0])+'"'+(x[0]===v?' selected':'')+'>'+esc(x[1])+'</option>').join('');
  return '<div class="card"><b class="text-sm">Öğrenci ekle</b><div class="grid grid-cols-2 md:grid-cols-5 gap-2 mt-2"><input id="ns" class="inp" placeholder="Sınıf (7)"><input id="nb" class="inp" placeholder="Şube (d)"><input id="nn" class="inp" placeholder="Okul no"><input id="na" class="inp col-span-2" placeholder="Adı soyadı"></div><button data-act="add" class="btn bg-indigo-600 mt-2">➕ Ekle</button>'

const find=a=>S.students.find(x=>x.id===a.dataset.id);
Object.assign(ACT,{
  add(){
    const n=T($('na').value),s=T($('ns').value);
    if(!n||!s)return alert('Sınıf ve ad soyad gerekli.');
    S.students.push({id:uid('ST_'),sno:'',no:T($('nn').value)||'-',sinif:s,sube:okSube($('nb').value),name:n,periods:{}});
    save();render(true);
  },
  bulk(){
    let c=0,d=0;
    $('nbulk').value.split('\n').forEach(line=>{
      const p=line.split('\t').map(T);if(p.length<5||!p[4])return;
      const x={id:uid('ST_'),sno:p[0],no:p[1]||'-',sinif:p[2],sube:okSube(p[3]),name:p[4],periods:{}};
      if(S.students.some(y=>T(y.sinif)===x.sinif&&T(y.sube).toLowerCase()===x.sube&&String(y.no)===x.no&&x.no!=='-')){d++;return;}
      S.students.push(x);c++;
    });
    if(c)save();alert(c+' öğrenci eklendi'+(d?', '+d+' tekrar atlandı':'')+'.');render(true);
  },
  edit(a){
    const s=find(a);if(!s)return;
    const x=prompt('Sınıf:',s.sinif);if(x===null)return;const y=prompt('Şube:',s.sube);if(y===null)return;
    const z=prompt('Okul numarası:',s.no);if(z===null)return;const w=prompt('Adı soyadı:',s.name);if(w===null)return;
    s.sinif=T(x)||s.sinif;s.sube=okSube(y)||s.sube;s.no=T(z)||s.no;s.name=T(w)||s.name;save();render(true);
  },
  abs(a){const s=find(a);if(s){s.absent=!s.absent;save();render(true);}},
  del(a){const s=find(a);if(!s||!confirm(s.name+' silinsin mi?'))return;del(()=>{S.students=S.students.filter(x=>x!==s);},'1 öğrenci silindi');}
});

ACT.m=a=>{
  const s=find(a),f=a.dataset.f,v=a.dataset.v;if(!s)return;muPush(s);
  if(f==='hw'){const p=v.split(':');s.hwStatus=s.hwStatus||{};if(s.hwStatus[p[0]]===p[1])delete s.hwStatus[p[0]];else s.hwStatus[p[0]]=p[1];}
  else if(f==='hafiz'){const x=perO(s);x.hafiz=!x.hafiz;}
  else{
    const r=dayRec(s,G.donem,G.date);
    if(f==='status'){r.status=r.status===v?'None':v;if(r.status!=='Kismen')delete r.part;}
    else if(f==='part'){r.status='Kismen';r.part=r.part===v?'':v;}
    else if(f==='abdest')r.abdest=!r.abdest;
    else if(f==='book')r.book=r.book==='Yok'?'None':'Yok';
    else if(f==='slept')r.slept=!r.slept;
    else if(f==='points')r.points=(r.points||0)+(+v);
    else if(f==='ez'){const n=ezOf(s)[+v];if(!n)return;r.ezberStatus=r.ezberStatus||{};const c=lastEz(s,n);r.ezberStatus[n]=c==='Baslamadi'?'DevamEdiyor':c==='DevamEdiyor'?'Tamamlandi':'Baslamadi';}
  }
  save();relist();
};

/* ===== Sınıf grubuna mesaj (WhatsApp): kitap getirmeyenler, gelmeyenler, ödev, tebrik ===== */
const GM={tip:'kitap',ders:'',ez:'',fmt:'tam',no:'1',range:'bugun',hw:'',off:{},extra:[],text:'',dirty:false,lastTip:''};
const GM_TIPS=[
  ['kitap','📕 Kitap getirmeyenler','ders'],['yok','🔴 Derse gelmeyenler','yoklama'],['kismen','🟣 Geç kalan / kısmen katılanlar','yoklama'],
  ['ezbery','📖 Ezberini vermeyenler','ezber'],['odevy','✍️ Ödevini yapmayanlar','ders'],['odeve','🟡 Ödevi eksik olanlar','ders'],['odevt','🌟 Ödevini yapanlar (tebrik)','ders'],
  ['tebrik','👏 Malzeme getirip devamlı katılanlar (tebrik)','ders'],['puan','🏅 En çok puan alanlar (tebrik)','ders'],['basari','🌟 Başarılı öğrenciler (ezber tamamlayan / artı alan)',''],['serbest','📝 Serbest (öğrenci seçerek)','']
];
const gmTips=()=>GM_TIPS.filter(t=>(!t[2]||featOn(t[2]))&&(t[0]!=='basari'||wmGoodOn()));
const GM_RANGES=[['bugun','Seçili gün'],['7','Son 7 gün'],['30','Son 30 gün'],['donem','Tüm dönem']];
function gmName(s){
  const p=T(s.name).split(/\s+/).filter(Boolean);if(GM.fmt==='tam'||p.length<2)return T(s.name);
  if(GM.fmt==='ad')return p.slice(0,-1).join(' ');
  return p.slice(0,-1).join(' ')+' '+p[p.length-1][0].toLocaleUpperCase('tr')+'.';
}
function gmRecs(s){
  const days=((((s.periods||{})[G.donem]||{}).days)||{});let ks=Object.keys(days);
  if(GM.range==='bugun')ks=[G.date];
  else if(GM.range!=='donem'){const f=addD(G.date,-(+GM.range-1));ks=ks.filter(d=>d>=f&&d<=G.date);}
  return ks.map(d=>[d,days[d]||{}]);
}
function gmCand(){
  const l=grp(),t=GM.tip,rg=GM.range!=='bugun',out=[];
  l.forEach(s=>{
    const R=gmRecs(s),cnt=f=>R.filter(([d,r])=>f(r)).length;let n=0,x='';
    if(t==='kitap')n=cnt(r=>r.book==='Yok');
    else if(t==='yok')n=cnt(r=>r.status==='Yok');
    else if(t==='kismen'){n=cnt(r=>r.status==='Kismen');if(n&&!rg){const r=R[0][1];x=r.part?' – '+kpLab(r):'';}}
    else if(t==='ezbery'){const nm=GM.ez?[GM.ez]:ezOf(s);n=nm.filter(z=>ezOf(s).includes(z)&&lastEz(s,z)!=='Tamamlandi').length;}
    else if(t==='odevy'||t==='odeve'||t==='odevt'){const st={odevy:'Yapmadi',odeve:'Eksik',odevt:'Yapti'}[t];n=GM.hw&&(s.hwStatus||{})[GM.hw]===st&&ap(S.homeworks.find(h=>h.id===GM.hw)||{},s)?1:0;}
    else if(t==='basari'){if(wmHasGood(s)){n=1;x=' – '+wmDurum(s);}}
    else if(t==='tebrik'){const v=cnt(r=>r.status==='Var');n=v&&!cnt(r=>r.status==='Yok'||r.status==='Kismen')&&!cnt(r=>r.book==='Yok')?1:0;}
    else if(t==='puan'){const p=R.reduce((a,[d,r])=>a+(r.points||0),0);n=p>0?p:0;x=p;}
    if(n)out.push({s:s,n:n,x:x});
  });
  if(t==='puan'){out.sort((a,b)=>b.x-a.x);return out.slice(0,5).map(o=>({s:o.s,n:o.n,x:''}));}
  if(t==='ezbery'&&!GM.ez)out.forEach(o=>{o.x=' ('+o.n+' ezber eksik)';});
  if((t==='kitap'||t==='yok'||t==='kismen')&&rg)out.forEach(o=>{o.x=' ('+o.n+' kez)';});
  return out;
}
function gmList(){
  const c=gmCand(),ids=new Set(c.map(o=>o.s.id));
  GM.extra.forEach(id=>{const s=S.students.find(x=>x.id===id);if(s&&!ids.has(id)){c.push({s:s,n:1,x:''});ids.add(id);}});
  return sorted(c.map(o=>o.s)).map(s=>c.find(o=>o.s.id===s.id)).filter(o=>!GM.off[o.s.id]);
}
const gmJoin=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' ve '+a[a.length-1];
function gmGen(){
  const L=gmList(),t=GM.tip,dn=T(GM.ders),d1=dn?dn+' dersinde':'derste',d2=dn?dn+' dersine':'derse';
  const rl=GM.range==='bugun'?(G.date!==today?' ('+fdt(G.date)+')':''):' ('+GM_RANGES.find(r=>r[0]===GM.range)[1].toLocaleLowerCase('tr')+')';
  const hn=(S.homeworks.find(h=>h.id===GM.hw)||{}).name||'',nm=L.map(o=>gmName(o.s)+(o.x||''));
  const items=L.map((o,i)=>(i+1)+'-'+(GM.no==='1'&&T(o.s.no)?' ('+T(o.s.no)+') ':'')+gmName(o.s)+(o.x||'')).join('\n'),bd=t=>'*'+t+'*';
  if(!L.length)return '';
  const many=L.length>1,ev=many?'evlatlarımızı':'evladımızı';
  if(t==='ezbery'){
    const ids=new Set(L.map(o=>o.s.id)),line=(s,i)=>(i+1)+'-'+(GM.no==='1'&&T(s.no)?' ('+T(s.no)+') ':'')+gmName(s);
    const names=GM.ez?[GM.ez]:ezSrt([...new Set(grp().flatMap(ezOf))]);
    return names.map(n=>{const ss=sorted(grp().filter(s=>ids.has(s.id)&&ezOf(s).includes(n)&&lastEz(s,n)!=='Tamamlandi'));return ss.length?bd(n+' ezberini vermeyenler:')+'\n'+ss.map(line).join('\n'):'';}).filter(Boolean).join('\n\n');
  }
  if(t==='basari')return bd(d1.charAt(0).toLocaleUpperCase('tr')+d1.slice(1)+' ezberini tamamlayan / artı puan alan öğrenciler'+(G.date!==today?' ('+fdt(G.date)+')':'')+':')+'\n'+items+'\n\nHepsini tebrik ediyor, başarılarının devamını diliyorum.';
  if(t==='kitap')return bd(d1.charAt(0).toLocaleUpperCase('tr')+d1.slice(1)+' kitap getirmeyenler'+rl+':')+'\n'+items;
  if(t==='yok')return bd(d2.charAt(0).toLocaleUpperCase('tr')+d2.slice(1)+' gelmeyenler'+rl+':')+'\n'+items;
  if(t==='kismen')return bd(d2.charAt(0).toLocaleUpperCase('tr')+d2.slice(1)+' geç kalan / kısmen katılanlar'+rl+':')+'\n'+items;
  if(t==='odevy')return bd((hn||'Ödev')+' ödevini yapmayanlar:')+'\n'+items;
  if(t==='odeve')return bd((hn||'Ödev')+' ödevi eksik olanlar:')+'\n'+items;
  if(t==='odevt')return gmJoin(nm)+' '+ev+(hn?' '+hn:'')+' ödevini eksiksiz yaptı'+(many?'kları':'ğı')+' için tebrik ediyorum.';

const sbox=(t,n,body,c)=>'<div class="card mb-0"><div class="font-bold mb-2">'+t+' <span class="text-xs text-white rounded-full px-2 py-0.5 '+c+'">'+n+'</span></div><div class="flex flex-wrap gap-1.5 overflow-y-auto" style="max-height:15rem">'+(body||'<span class="text-xs text-slate-400 italic">Kayıt yok.</span>')+'</div></div>';
const ST_DEF=['rb','hz','cz','p','ab2','ez','bp','hwy','pm','bk','sl','ab'];
function stOrd(){let o=[];try{o=JSON.parse(lsg('stat_ord')||'[]');}catch(e){}if(!Array.isArray(o))o=[];o=o.filter((k,i)=>ST_DEF.includes(k)&&o.indexOf(k)===i);return o.concat(ST_DEF.filter(k=>!o.includes(k)));}
const ST_T={ab:'🚫 Sürekli Devamsız',hwy:'🔔 Son 3 Ödevi Yapmayanlar',rb:'🧭 Rehberlik',ez:'🏆 Ezber',p:'➕ Artı Puan',pm:'➖ Eksi Puan',bp:'🌟 Davranış Puanı',bk:'📕 Kitabı Olmayanlar',sl:'😴 Derste Uyuyanlar',ab2:'💧 Abdestli Gün',hz:'👳 Hafızlar',cz:'📜 Cüzdekiler'};
function stHid(){try{const o=JSON.parse(lsg('stat_hid')||'[]');return Array.isArray(o)?o.filter(k=>ST_DEF.includes(k)):[];}catch(e){return [];}}
function stBoxes(items){const m={};items.forEach(x=>m[x[0]]=x[1]);const h=stHid(),o=stOrd().filter(k=>!h.includes(k));
  const bt='w-7 h-7 rounded bg-slate-200 dark:bg-slate-700 text-xs font-bold';
  return '<div class="grid grid-cols-1 md:grid-cols-2 gap-3">'+o.map((k,i)=>'<div class="relative">'+m[k]+'<div class="absolute top-2 right-2 flex gap-1">'
   +'<button data-act="stmv" data-k="'+k+'" data-d="-1" class="'+bt+(i?'':' opacity-30')+'" aria-label="Yukarı">▲</button>'
   +'<button data-act="stmv" data-k="'+k+'" data-d="1" class="'+bt+(i<o.length-1?'':' opacity-30')+'" aria-label="Aşağı">▼</button>'
   +'<button data-act="sthd" data-k="'+k+'" class="'+bt+'" aria-label="Gizle" title="Gizle">✕</button></div></div>').join('')+'</div>'
   +(h.length?'<div class="card mt-3"><div class="text-xs font-semibold text-slate-500 mb-2">Gizlenen kutular (dokunup geri getirin)</div><div class="flex flex-wrap gap-1.5">'+h.map(k=>'<button data-act="sthd" data-k="'+k+'" class="px-3 py-1.5 rounded-full border border-slate-300 dark:border-slate-600 text-xs font-semibold">+ '+ST_T[k]+'</button>').join('')+'</div></div>':'')
   +((lsg('stat_ord')||h.length)?'<div class="text-center mt-3"><button data-act="strs" class="text-xs text-indigo-600 underline">Varsayılan düzene dön</button></div>':'');}
ACT.stmv=a=>{const h=stHid(),o=stOrd(),v=o.filter(k=>!h.includes(k)),k=a.dataset.k,i=v.indexOf(k),t=v[i+(+a.dataset.d)];if(i<0||!t)return;const x=o.indexOf(k),y=o.indexOf(t);o[x]=t;o[y]=k;lss('stat_ord',JSON.stringify(o));render(true);};
ACT.sthd=a=>{const h=stHid(),k=a.dataset.k,i=h.indexOf(k);if(i<0)h.push(k);else h.splice(i,1);lss('stat_hid',JSON.stringify(h));render(true);};

function planPrintHtml(g,p,dm,ti,meta){

  const fs=Math.max(6,Math.min(15,Math.floor(cw/2.4),Math.floor(ch/1.25)));
  let cells='';
  for(let r=0;r<dm.rows;r++)for(let c=0;c<dm.cols;c++){
    const k=r+','+c;if(cv[k])continue;
    const s=at[k],fo=(p.f||{})[k],mv=mgm(p)[k],sp=mv?msz(mv):[1,1];
    const pos='grid-row:'+(r+1)+' / span '+sp[0]+';grid-column:'+(c+1)+' / span '+sp[1]+';';
    if(fo&&FOBJ[fo]){used[fo]=1;cells+='<div class="c f" style="'+pos+'background:'+FOBJ[fo][3]+'"><div><div class="i">'+FOBJ[fo][0]+'</div>'+esc(FOBJ[fo][1])+'</div></div>';}
    else if(s)cells+='<div class="c s" style="'+pos+'"><div><b>'+esc(s.name)+'</b><br><small>No: '+esc(s.no)+'</small></div></div>';
    else if(mv)cells+='<div class="c m" style="'+pos+'"></div>';

  }
  const leg=Object.keys(used).map(k=>FOBJ[k][0]+' '+esc(FOBJ[k][1])).join(' &nbsp; ');
  let fn=[],fl=0;for(const s of free){if(fl+s.name.length>(land?420:300))break;fn.push(esc(s.name));fl+=s.name.length+2;}
  const fr=free.length?'Sırası olmayanlar ('+free.length+'): '+fn.join(', ')+(fn.length<free.length?' … ve '+(free.length-fn.length)+' öğrenci daha':''):'';
  return '<!doctype html><meta charset="utf-8"><title>'+esc(ti)+'</title><style>'
   +'@page{size:A4 '+(land?'landscape':'portrait')+';margin:8mm}'
   +'*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}'
   +'html,body{margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;color:#111}'
   +'.pg{width:'+W+'mm;height:'+(H-1)+'mm;display:flex;flex-direction:column;overflow:hidden;page-break-after:avoid;break-after:avoid}'
   +'.hd h2{margin:0;font-size:18pt;line-height:1.2}.hd .mt{font-size:10pt;color:#444;margin:1mm 0 2mm}'
   +'.gr{flex:1;min-height:0;display:grid;grid-template-columns:repeat('+dm.cols+',minmax(0,1fr));grid-template-rows:repeat('+dm.rows+',minmax(0,1fr));gap:'+gap+'mm}'
   +'.c{border:.35mm solid #444;border-radius:1.5mm;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:.6mm;line-height:1.15;font-size:'+fs+'pt;min-width:0;min-height:0;overflow-wrap:anywhere}'
   +'.c.e{border:.35mm dashed #bbb}.c.m{background:#f1f5f9;border-color:#94a3b8}.c.f{font-weight:700;font-size:'+Math.max(6,fs-1)+'pt}.c.f .i{font-size:'+Math.round(fs*1.6)+'pt;line-height:1.1}'
   +'.c.s small{color:#555;font-size:'+Math.max(6,Math.round(fs*0.8))+'pt}'
   +'.ft{flex:none;font-size:9pt;margin-top:2mm;max-height:15mm;overflow:hidden;line-height:1.3}'
   +'</style><div class="pg"><div class="hd"><h2>'+esc(ti)+'</h2><div class="mt">'+meta+'</div></div><div class="gr">'+cells+'</div>'
   +(leg||fr?'<div class="ft">'+(leg?'<div>'+leg+'</div>':'')+(fr?'<div>'+fr+'</div>':'')+'</div>':'')
   +'</div><script>onload=function(){setTimeout(print,300)}<\/script>';
}

    if(r.abdest)z.ab++;z.p+=r.points||0;z.bp+=r.bp||0;if(r.book==='Yok')z.bk++;if(r.slept)z.sl++;});
  const el=ezOf(s);z.ez=el.filter(n=>bestE(s,n)===2).length+'/'+el.length;
  const cn=l=>{let a=0,b=0,e=0;l.forEach(h=>{const x=(s.hwStatus||{})[h.id];if(x==='Yapti')a++;else if(x==='Yapmadi')b++;else if(x==='Eksik')e++;});return a+'/'+b+(e?' ('+e+' eksik)':'');};

function findPhones(text){
  let t=String(text);for(let k=0;k<2;k++)t=t.replace(/(\d)[Oo]/g,'$10').replace(/[Oo](\d)/g,'0$1').replace(/(\d)[lI|]/g,'$11').replace(/[lI|](\d)/g,'1$1');
  const out=[],seen={},re=/(?:\+?90[\s.\-]*)?0?[\s.\-]*\(?5\d{2}\)?[\s.\-]*\d{3}[\s.\-]*\d{2}[\s.\-]*\d{2}/g;
  t.split('\n').forEach(line=>{(line.match(re)||[]).forEach(m=>{let d=m.replace(/\D/g,'');if(d.startsWith('90')&&d.length>=12)d=d.slice(2);if(d.length===10)d='0'+d;if(d.length!==11||seen[d])return;seen[d]=1;out.push({n:d,line:line.replace(m,'').replace(/[\s|_]+/g,' ').trim().slice(0,40)});});});
  return out;
}

function zkGet(){let s={};try{s=JSON.parse(lsg('zk_v1')||'{}')||{};}catch(e){}
  s=Object.assign({n:0,t:33,r:0,i:0,tot:0,h:1,d:''},s);if(s.d!==dnToday()){s.d=dnToday();s.tot=0;}if(!zkAll()[s.i])s.i=0;return s;}

function zkPaint(s,done){

  const p=s.t>0?Math.round(s.n/s.t*100):0,rg=$('zkRing');if(rg)rg.style.background='conic-gradient(#4f46e5 '+p+'%,#cbd5e1 0)';
  const a=$('zkR');if(a)a.textContent=s.r;const b=$('zkTot');if(b)b.textContent=s.tot;
  const m=$('zkMsg');if(m){m.textContent=done?'✓ '+s.t+' tamamlandı':'';if(done)setTimeout(()=>{const x=$('zkMsg');if(x)x.textContent='';},1800);}
}

function esDay(){const d=new Date(),n=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);return n%99;}
function esList(q){const n=hqN(q||'');return ESMA.map((e,i)=>i).filter(i=>!n||hqN(ESMA[i][0]+' '+ESMA[i][2]).indexOf(n)>=0||String(i+1)===n).map(esCard).join('')||'<div class="text-xs text-slate-400 col-span-2 text-center">Sonuç yok.</div>';}
/* ---- Namaz vakitleri (Aladhan, Diyanet yöntemi) ---- */
const nvCity=()=>T(lsg('nv_city')||'Karaman')||'Karaman';
const nvKey=(c,y,m)=>'nv_'+hqN(c).replace(/\s/g,'')+'_'+y+'-'+String(m).padStart(2,'0');
function nvDay(iso){let c=null;try{c=JSON.parse(lsg(nvKey(nvCity(),+iso.slice(0,4),+iso.slice(5,7)))||'null');}catch(e){}return c&&c[iso]||null;}
function nvParse(j){const out={};((j&&j.data)||[]).forEach(it=>{try{const g=it.date.gregorian.date.split('-'),iso=g[2]+'-'+g[1]+'-'+g[0],t={};NV_N.forEach(n=>{const m=/(\d{1,2}):(\d{2})/.exec(String(it.timings[n[0]]||''));if(m)t[n[0]]=String(m[1]).padStart(2,'0')+':'+m[2];});if(t.Fajr&&t.Dhuhr)out[iso]=t;}catch(e){}});return out;}
async function nvLoad(force){
  if(NV.busy||(!force&&Date.now()-NV.t<30000))return;
  const city=nvCity(),d=new Date(),ms=[[d.getFullYear(),d.getMonth()+1]];
  if(d.getDate()>=26){const n=new Date(d.getFullYear(),d.getMonth()+1,1);ms.push([n.getFullYear(),n.getMonth()+1]);}
  NV.busy=true;NV.t=Date.now();NV.err='';
  for(const ym of ms){const k=nvKey(city,ym[0],ym[1]);if(!force&&lsg(k))continue;
    try{const r=await fetch('https://api.aladhan.com/v1/calendarByCity?city='+encodeURIComponent(city)+'&country=Turkey&method=13&month='+ym[1]+'&year='+ym[0]);const o=nvParse(await r.json());if(!Object.keys(o).length)throw new Error('boş');lss(k,JSON.stringify(o));}
    catch(e){NV.err='Vakitler alınamadı. İnternet bağlantısını ve şehir adını kontrol edin.';}}
  NV.busy=false;if(S.page==='dini'&&DN.tab==='nv')nvPaint();dnSubPaint();
}
const nvMin=v=>+v.slice(0,2)*60+ +v.slice(3);
const nvFmt=m=>(m>=60?Math.floor(m/60)+' sa ':'')+(m%60)+' dk';
function nvNext(){
  const now=new Date(),t=nvDay(dnToday());if(!t)return null;const nm=now.getHours()*60+now.getMinutes();let cur=-1,nx=-1;
  NV_N.forEach((n,i)=>{const v=t[n[0]];if(!v)return;if(nvMin(v)<=nm)cur=i;else if(nx<0)nx=i;});
  if(nx>=0)return{cur:cur,idx:nx,min:nvMin(t[NV_N[nx][0]])-nm,t:t,tm:t[NV_N[nx][0]],tomorrow:false};
  const tt=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1),iso=tt.getFullYear()+'-'+String(tt.getMonth()+1).padStart(2,'0')+'-'+String(tt.getDate()).padStart(2,'0'),t2=nvDay(iso);
  if(t2&&t2.Fajr)return{cur:cur,idx:0,min:nvMin(t2.Fajr)+1440-nm,t:t,tm:t2.Fajr,tomorrow:true};
  return{cur:cur,idx:-1,min:0,t:t,tm:'',tomorrow:false};
}
function dnSub(){const n=nvNext();if(!n||n.idx<0)return 'Zikirmatik · Esmaü’l-Hüsna · Namaz vakitleri';return (n.tomorrow?'Yarın ':'')+NV_N[n.idx][1]+' vaktine '+nvFmt(n.min)+' ('+n.tm+')';}

function nvBody(){

  if(n&&n.t)h+='<div class="card">'+NV_N.map((x,i)=>'<div class="flex items-center py-2 px-2 rounded-lg '+(n.idx===i?'bg-indigo-600 text-white font-bold':(n.cur===i?'bg-indigo-50 dark:bg-slate-700 font-semibold':''))+'"><span class="flex-1">'+x[1]+(n.cur===i?' <span class="text-[10px] opacity-70">şu an</span>':'')+'</span><span>'+esc(n.t[x[0]]||'--:--')+'</span></div>').join('')+'</div>';
  h+='<div class="card"><div class="text-xs font-semibold text-slate-500 mb-1">Şehir</div><div class="flex gap-2"><input id="nvCity" class="inp flex-1" value="'+esc(city)+'" placeholder="Şehir (örn. Karaman)"><button data-act="nvcity" class="btn bg-slate-600">Kaydet</button><button data-act="nvref" class="btn bg-slate-600" aria-label="Yenile">↻</button></div>'
   +(NV.err&&n&&n.t?'<div class="text-xs text-amber-700 mt-1">'+esc(NV.err)+'</div>':'')+'<div class="text-xs text-slate-400 mt-2">Vakitler Aladhan servisinden Diyanet yöntemiyle hesaplanarak alınır. Resmî vakit için Diyanet’i esas alın. İlk kullanımda internet gerekir; bir ay boyunca cihazda saklanır.</div></div>';
  h+='<button data-act="dxboard" class="btn bg-slate-800 w-full mb-2">🖥️ Vakit panosu (tam ekran)</button>';
  return h;
}

const dnFmt=()=>{const k=lsg('dn_fmt');return DN_FM[k]?k:'r';};
function dnCanvas(o){
  const fk=dnFmt(),W=DN_FM[fk].w,H=DN_FM[fk].h,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),th=DN_TH[o.theme]||DN_TH.green,gold='#e8c675';
  const rl=fk==='r';/* Reels: üst ve alttaki uygulama arayüzü kartı kapatmasın diye içerik güvenli alana alınır */
  const AF='Amiri,"Noto Naskh Arabic","Traditional Arabic",serif',SF='Georgia,serif';
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,th[0]);g.addColorStop(1,th[1]);x.fillStyle=g;x.fillRect(0,0,W,H);
  const fm=rl?60:50;x.strokeStyle=gold;x.lineWidth=5;x.strokeRect(fm,fm+(rl?100:0),W-2*fm,H-2*fm-(rl?200:0));x.lineWidth=2;x.strokeRect(fm+20,fm+20+(rl?100:0),W-2*fm-40,H-2*fm-40-(rl?200:0));
  const sy=rl?290:135,hy=rl?385:235;
  x.fillStyle=gold;dnStarPath(x,W/2,sy,38);x.fill();x.fillStyle=th[0];dnStarPath(x,W/2,sy,20);x.fill();
  x.textAlign='center';x.fillStyle=gold;x.font='600 '+(o.parts?36:40)+'px sans-serif';x.fillText(o.head||'',W/2,hy);
  const build=useOk=>{
    const bl=[];
    if(o.parts){o.parts.forEach((p,i)=>{if(i)bl.push({k:'orn'});bl.push({k:'head2',t:p.head});if(p.arab)bl.push({k:'arab',t:p.arab});if(p.ok&&useOk)bl.push({k:'okun',t:p.ok});if(p.body)bl.push({k:'body',t:p.body});if(p.foot)bl.push({k:'foot',t:p.foot});});return bl;}
    if(o.big)bl.push({k:'big',t:o.big});if(o.arab)bl.push({k:'arab',t:o.arab});
    if(o.title)bl.push({k:o.titleBig?'titleBig':'title',t:o.title});if(o.body)bl.push({k:'body',t:o.body});
    if(o.part2){if(o.foot)bl.push({k:'foot',t:o.foot});bl.push({k:'orn'});bl.push({k:'head2',t:o.part2.head});if(o.part2.body)bl.push({k:'body',t:o.part2.body});if(o.part2.foot)bl.push({k:'foot',t:o.part2.foot});}
    return bl;};
  const sp=(k,f)=>({big:{font:'bold '+Math.round(170*f)+'px '+AF,lh:210*f,rtl:1,fill:'#fff'},arab:{font:'bold '+Math.round(58*f)+'px '+AF,lh:98*f,rtl:1,fill:'#fff'},titleBig:{font:'bold '+Math.round(76*f)+'px '+SF,lh:92*f,fill:'#fff'},title:{font:'italic '+Math.round(46*f)+'px '+SF,lh:68*f,fill:'#fff'},body:{font:'italic '+Math.round(44*f)+'px '+SF,lh:64*f,fill:'rgba(255,255,255,.93)'},okun:{font:'italic '+Math.round(38*f)+'px '+SF,lh:56*f,fill:'rgba(255,255,255,.8)'},foot:{font:'600 '+Math.round(36*f)+'px sans-serif',lh:60*f,fill:gold},head2:{font:'600 '+Math.round(38*f)+'px sans-serif',lh:64*f,fill:gold},orn:{font:'600 '+Math.round(34*f)+'px sans-serif',lh:80*f,fill:gold}})[k];
  const sideM=rl?150:130,top=rl?(o.parts?440:470):300,bottom=rl?H-360:((o.part2||o.parts||!o.foot)?H-130:H-230);
  const fit=(bl,min)=>{let f=1,L=null;for(;f>=min;f-=0.05){
    L=bl.map(b=>{const s=sp(b.k,f);x.font=s.font||'20px sans-serif';x.direction=s.rtl?'rtl':'ltr';return {b,s,lines:b.k==='orn'?['✦  ✦  ✦']:dnWrap(x,b.t,W-2*sideM)};});
    x.direction='ltr';if(L.reduce((a,q)=>a+q.lines.length*q.s.lh,0)<=bottom-top)break;}
    return {L,f};};
  let r=fit(build(true),o.parts?0.62:0.35);
  if(o.parts&&r.f<0.62)r=fit(build(false),0.35);/* sığmazsa okunuş satırı çıkarılır, yazı küçülmez */
  const L=r.L,tot=L.reduce((a,q)=>a+q.lines.length*q.s.lh,0);let y=top+Math.max(0,Math.min(120,(bottom-top-tot)/2));
  L.forEach(q=>{x.font=q.s.font||'20px sans-serif';x.fillStyle=q.s.fill;x.direction=q.s.rtl?'rtl':'ltr';q.lines.forEach(l=>{y+=q.s.lh;x.fillText(l,W/2,y-q.s.lh*0.28);});});
  x.direction='ltr';
  if(!o.part2&&!o.parts&&o.foot){x.fillStyle=gold;x.font='600 38px sans-serif';x.fillText(o.foot,W/2,rl?H-390:H-150);}
  return c;
}
async function dnShare(o,text){
  try{
    const c=dnCanvas(o),blob=await new Promise(r=>c.toBlob(r,'image/png')),f=new File([blob],'dini-kart.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:o.head||'',text:text||''});return;}
    if(navigator.share){await navigator.share({title:o.head||'',text:text||''});return;}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dini-kart.png';document.body.appendChild(a);a.click();a.remove();toast('Kart görsel olarak indirildi');
  }catch(e){if(e&&e.name==='AbortError')return;try{await navigator.clipboard.writeText(text||'');toast('Metin kopyalandı');}catch(x){toast('Paylaşılamadı',true);}}
}

/* ===== Dini günler, Hicri takvim, Aşr-ı şerifler, günün duası, daire kısayollar ===== */
let DX_HF=null;
function dxHj(d){
  try{
    if(!DX_HF)DX_HF=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric',year:'numeric'});
    const adj=+dnCfg().hadj||0,x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+adj,12),p=DX_HF.formatToParts(x),g=t=>parseInt((p.find(q=>q.type===t)||{}).value,10);
    const r={d:g('day'),m:g('month'),y:g('year')};return r.d&&r.m?r:null;
  }catch(e){return null;}
}
const dxHt=h=>h?h.d+' '+DN_HM[h.m-1]+' '+h.y:'';
const dxIso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dxD0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);
const dxDays=(a,b)=>Math.round((dxD0(b)-dxD0(a))/864e5);
/* ---- Dini günler: Hicri takvimden her yıl otomatik hesaplanır ---- */
function dxGunler(Y){
  const out=[],seen={};
  const add=(d,n)=>{if(d.getFullYear()!==Y)return;const k=n+dxIso(d);if(seen[k])return;seen[k]=1;out.push({d:dxD0(d),n,h:dxHj(d)});};
  for(let i=-3;i<369;i++){
    const d=new Date(Y,0,1+i,12),h=dxHj(d);if(!h)continue;const pv=new Date(Y,0,i,12);
    if(h.m===1&&h.d===1)add(d,'Hicri Yılbaşı');
    if(h.m===1&&h.d===10)add(d,'Aşure Günü');
    if(h.m===3&&h.d===11)add(d,'Mevlid Kandili');
    if(h.m===7&&h.d===1)add(d,'Üç Ayların Başlangıcı');
    if(d.getDay()===5&&h.m===7&&h.d<=7)add(pv,'Regaip Kandili');
    if(h.m===7&&h.d===26)add(d,'Miraç Kandili');
    if(h.m===8&&h.d===14)add(d,'Berat Kandili');
    if(h.m===9&&h.d===1)add(d,'Ramazan’ın İlk Günü');
    if(h.m===9&&h.d===26)add(d,'Kadir Gecesi');
    if(h.m===10&&h.d===1)add(pv,'Ramazan Bayramı Arefesi');
    if(h.m===10&&h.d<=3)add(d,'Ramazan Bayramı '+h.d+'. Gün');
    if(h.m===12&&h.d===9)add(d,'Kurban Bayramı Arefesi');
    if(h.m===12&&h.d>=10&&h.d<=13)add(d,'Kurban Bayramı '+(h.d-9)+'. Gün');
  }
  /* Diyanet'in ilan ettiği tarihlerle hesabın ayrıldığı yıllar (kaynak: Diyanet takvimi). */
  const OV={2026:{'Ramazan’ın İlk Günü':['2026-02-19',{d:1,m:9,y:1447}],'Kadir Gecesi':['2026-03-16',{d:26,m:9,y:1447}]}}[Y];
  if(OV)out.forEach(e=>{const o=OV[e.n];if(o){e.d=new Date(o[0]+'T12:00:00');e.h=o[1];}});
  return out.sort((a,b)=>a.d-b.d);
}
function dxGnBody(){
  const Y=S.dxY||new Date().getFullYear(),l=dxGunler(Y),now=dxD0(new Date());
  let last=-1,h='<div class="dx-yr"><button data-act="dxyr" data-d="-1" class="dn-btn dx-b2" aria-label="Önceki yıl">◀</button><b>Dini Günler '+Y+'</b><button data-act="dxyr" data-d="1" class="dn-btn dx-b2" aria-label="Sonraki yıl">▶</button></div>';
  if(!l.length)return h+'<div class="text-sm text-slate-500">Bu tarayıcı Hicri takvimi desteklemiyor.</div>';
  l.forEach(e=>{
    const m=e.d.getMonth(),n=dxDays(now,e.d);
    if(m!==last){if(last>=0)h+='</div>';h+='<div class="dx-mh">'+DN_AYS[m]+'</div><div class="dx-gl">';last=m;}
    h+='<div class="dx-g'+(n<0?' dx-past':'')+(n===0?' dx-today':'')+'"><div class="dx-gd"><b>'+String(e.d.getDate()).padStart(2,'0')+'</b><span>'+DN_AYS[m]+'</span><small>'+esc(exDay(dxIso(e.d)))+'</small></div><div class="dx-gt"><b>'+esc(e.n)+'</b><span>'+esc(dxHt(e.h))+'</span>'+(n>=0&&n<=60?'<em>'+(n===0?'Bugün':n+' gün kaldı')+'</em>':'')+'</div></div>';
  });
  return h+'</div><div class="text-xs text-slate-500 mt-3">Tarihler Hicri takvimden hesaplanır ve her yıl kendiliğinden yenilenir. Diyanet takvimiyle bir gün fark çıkarsa Hicri Takvim sekmesindeki düzeltmeyi kullanın. Kandil geceleri, tarihin akşamında başlar.</div>';
}

function bdSync(){

  },

/* ===== Günlük ders planı: ders programından o günün dersleri, yıllık plandan konu/kazanım gelir; düzenlenir ve A4 yazdırılır.
   Kayıt: S.gplan = [{tarih,sinif,sube,ders,bas,bit,n,man,konu,kaz,yontem,arac,giris,gelisme,sonuc,deger,odev,not}] ===== */
const GPL={date:'',bl:[]};
const GP_F=[['konu','Konu',2],['kaz','Kazanım(lar)',3],['yontem','Yöntem ve teknikler',2],['arac','Araç-gereç',2],['giris','Giriş (dikkat çekme, hazırlık)',3],['gelisme','Gelişme (dersin işlenişi)',4],['sonuc','Sonuç (özet, değerlendirme)',3],['deger','Ölçme ve değerlendirme',2],['odev','Ödev',2],['not','Açıklama / not',2]];
const GP_GUN=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const gpSb=v=>(v&&v!=='ALL')?String(v).toLowerCase():'';
function gpBlocks(d){
  const gun=new Date(d+'T12:00:00').getDay();
  const l=(S.prog||[]).filter(x=>+x.gun===gun&&bgT(x.bas)>=0&&bgT(x.bit)>bgT(x.bas)).sort((a,b)=>bgT(a.bas)-bgT(b.bas));
  const out=pdBlocks(l).map(x=>({sinif:String(x.sinif||''),sube:gpSb(x.sube),ders:T(x.ders),bas:x.bas,bit:x.bit,n:x.e.length}));
  (S.gplan||[]).filter(r=>r.tarih===d&&r.man).forEach(r=>{if(!out.some(b=>b.sinif===r.sinif&&b.sube===gpSb(r.sube)&&b.ders===r.ders))out.push({sinif:r.sinif,sube:gpSb(r.sube),ders:r.ders,bas:r.bas||'',bit:r.bit||'',n:r.n||1,man:1});});
  return out;
}
function gpRec(d,b,mk){
  let r=(S.gplan||[]).find(x=>x.tarih===d&&x.sinif===b.sinif&&gpSb(x.sube)===b.sube&&x.ders===b.ders);
  if(!r&&mk){r={tarih:d,sinif:b.sinif,sube:b.sube,ders:b.ders,bas:b.bas||'',bit:b.bit||'',n:b.n||1,man:b.man?1:0};S.gplan.push(r);}
  return r||null;
}
function gpPlan(d,b){
  const dn=String(b.ders||'').toLowerCase();
  return S.yplan.find(y=>y.t!=='e'&&y.tarih&&y.tarih<=d&&d<ypAdd(y.tarih,7)&&(y.sinif==='ALL'||String(y.sinif).trim()===String(b.sinif).trim())&&(!y.ders||!dn||dn.includes(String(y.ders).toLowerCase())||String(y.ders).toLowerCase().includes(dn)))||null;
}
function gpPrev(d,b,f){
  return (S.gplan||[]).filter(r=>r.ders===b.ders&&r.tarih<d&&T(r[f])).sort((a,c)=>a.tarih<c.tarih?1:-1)[0]||null;
}

/* ===== Giriş / gelişme / sonuç / ödev için hazır öneriler (konu, kazanım, yöntem ve ders türüne göre) ===== */
const GP_SC=(t,n)=>{t=T(t);if(!t)return '';const m=/^(.{20,}?[.!?])(\s|$)/.exec(t);const s=m?m[1]:t;return s.length>n?s.slice(0,n).replace(/\s+\S*$/,'')+'…':s;};
function gpGen(f,d,b){

      'Okunacak bölüm tahtaya yazılır/gösterilir, öğretmen cümle cümle okur, öğrenciler tekrar eder. Anlamlar ve ezber ipuçları üzerinde konuşulur. Eşli çalışmayla öğrenciler birbirini dinler ('+ym+').',
      'Bölüm önce dinletilir, ardından parça parça öğretilir. Öğrenciler çiftler hâlinde birbirine okur, öğretmen sınıfı dolaşıp telaffuz ve tecvid hatalarını düzeltir. Kullanılan yöntem: '+ym+'.'][v(3)];

      'Konu '+q+' kısaca özetlenir, birkaç öğrenciden ezber dinlenir ('+dg+'). Bir sonraki derse hazırlık ve ödev söylenir.'][v(3)];

    'Konu '+ym+' yöntemleriyle işlenir. Ders kitabındaki ilgili bölüm sınıfça okunur, temel kavramlar tahtaya yazılır. Öğrenciler küçük gruplarda etkinliği yapar, sonuçlarını sınıfla paylaşır. Öğretmen örneklerle tartışmayı yönlendirir.',

    'Ana fikirler tahtada özetlenir, birkaç öğrenci öğrendiklerini kendi cümleleriyle söyler. Değerlendirme: '+dg+'. Ödev verilir ve ders sonlandırılır.',

function gpVal(d,b,f){
  const r=gpRec(d,b);if(r&&r[f]!=null)return r[f];
  if(f==='konu'||f==='kaz'){const p=gpPlan(d,b);return p?(p[f]||''):'';}
  if(['giris','gelisme','sonuc','odev'].includes(f))return gpGen(f,d,b);

const gpTit=b=>(b.sinif?b.sinif+(b.sube?'/'+b.sube.toUpperCase():'')+'. sınıf':'')+(b.ders?' · '+b.ders:'');

const ldJs=(url,ok)=>ok()?Promise.resolve():new Promise((res,no)=>{const e=document.createElement('script');e.src=url;e.onload=res;e.onerror=()=>no(new Error('PDF kütüphanesi yüklenemedi (internet?)'));document.head.appendChild(e);});
const pdfLibs=()=>Promise.all([ldJs('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',()=>window.html2canvas),ldJs('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>window.jspdf)]);
let PDFB=null;
const pdfm=document.createElement('div');pdfm.className='fixed inset-0 z-[180] hidden items-center justify-center bg-black/60 p-4';
pdfm.innerHTML='<div class="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-2xl max-w-sm w-full p-4"><b class="text-lg">📄 PDF hazır</b><div id="pdfN" class="text-xs text-slate-500 my-2 break-all"></div><div class="flex flex-wrap gap-2"><button data-act="pdfshare" class="btn bg-emerald-600 flex-1">📤 Paylaş (WhatsApp, e-posta…)</button><button data-act="pdfdl" class="btn bg-indigo-600 flex-1">⬇ İndir</button></div><button data-act="pdfx" class="btn bg-slate-500 w-full mt-2">Kapat</button></div>';
document.body.appendChild(pdfm);
Object.assign(ACT,{
  pdfx(){pdfm.classList.add('hidden');pdfm.classList.remove('flex');},
  async pdfshare(){if(!PDFB)return;const f=new File([PDFB.blob],PDFB.fn,{type:'application/pdf'});
    try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:PDFB.title||PDFB.fn});else{ACT.pdfdl();toast('Paylaşma bu cihazda desteklenmiyor, PDF indirildi');}}catch(e){if(!e||e.name!=='AbortError')alert('Paylaşılamadı: '+(e.message||e));}},
  pdfdl(){if(!PDFB)return;const a=document.createElement('a');a.href=URL.createObjectURL(PDFB.blob);a.download=PDFB.fn;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500);}
});
async function pdfFromDoc(doc,fn,title){
  let fr=null;
  try{
    toast('PDF hazırlanıyor…');await pdfLibs();
    fr=document.createElement('iframe');fr.style.cssText='position:fixed;left:-10000px;top:0;width:794px;height:1123px;border:0;background:#fff';document.body.appendChild(fr);
    const d=fr.contentDocument;d.open();d.write(doc.replace('<style>','<style>.b{display:none!important}body{width:186mm;margin:0!important;padding:0!important}'));d.close();
    await new Promise(r=>setTimeout(r,600));
    const body=d.body,top=body.getBoundingClientRect().top,W=body.getBoundingClientRect().width,H=body.scrollHeight,pageH=W*273/186;
    const bps=[...d.querySelectorAll('tr,.sg')].map(el=>el.getBoundingClientRect().bottom-top).filter(v=>v>0).sort((a,b)=>a-b);
    const cv=await html2canvas(body,{scale:2,backgroundColor:'#fff',windowWidth:794,useCORS:true}),sc=cv.width/W;
    const cuts=[];let y=0;while(y<H-2){let end=Math.min(H,y+pageH);if(end<H){const c=bps.filter(v=>v>y+pageH*0.3&&v<=y+pageH);if(c.length)end=c[c.length-1];}cuts.push([y,end]);y=end;}
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    cuts.forEach((c,i)=>{const hh=Math.max(1,Math.round((c[1]-c[0])*sc)),sub=document.createElement('canvas');sub.width=cv.width;sub.height=hh;const cx=sub.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,sub.width,hh);cx.drawImage(cv,0,Math.round(c[0]*sc),cv.width,hh,0,0,cv.width,hh);if(i)pdf.addPage();pdf.addImage(sub.toDataURL('image/jpeg',.95),'JPEG',12,12,186,(c[1]-c[0])/W*186);});
    PDFB={blob:pdf.output('blob'),fn:fn,title:title};fr.remove();fr=null;
    $('pdfN').textContent=fn+' · '+cuts.length+' sayfa';pdfm.classList.remove('hidden');pdfm.classList.add('flex');
  }catch(e){if(fr)fr.remove();alert('PDF oluşturulamadı: '+(e.message||e));}
}

/* ===== Sınıf nöbetçileri: her gün 2 öğrenci, sınıf listesi sırasıyla. Kayıt: S.nobet = [{tarih,sinif,sube,ids}] + {t:'r'} rehber/başlangıç + {t:'t'} tatil ===== */
const NB={n:2,ym:''};
const nbMon=d=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return x.toISOString().slice(0,10);};

const nbRecs=()=>(S.nobet||[]).filter(r=>r.t!=='r'&&r.t!=='t'&&r.sinif===G.sinif&&(r.sube||'')===nbSb());
const nbRehR=()=>(S.nobet||[]).find(r=>r.t==='r'&&r.sinif===G.sinif&&(r.sube||'')===nbSb())||null;
const nbReh=()=>{const r=nbRehR();return r?T(r.ad):'';};

function nbWeeks(ym){let mon=nbMon(ym+'-01');if(ypAdd(mon,3).slice(0,7)<ym)mon=ypAdd(mon,7);const out=[];while(ypAdd(mon,3).slice(0,7)===ym){out.push(mon);mon=ypAdd(mon,7);}return out;}

const nbHols=()=>(S.nobet||[]).filter(r=>r.t==='t'&&r.bas&&r.bit);
function nbHol(d){if(NB_RES[d.slice(5)])return NB_RES[d.slice(5)];const r=nbHols().find(x=>x.bas<=d&&d<=x.bit);return r?(T(r.ad)||'Tatil'):'';}
const nbName=id=>{const s=S.students.find(x=>x.id===id);return s?s:null;};

/* Başlangıç tarihinden önce eskiden yazılmış nöbetçiler varsa sorar ve siler */
function nbPre(from){
  const bas=nbBas();if(!bas)return;
  const old=nbRecs().filter(r=>r.tarih>=from&&r.tarih<bas&&(r.ids||[]).length);
  if(!old.length)return;
  if(!confirm('Başlangıç tarihinden ('+fdt(bas)+') önceki '+old.length+' gün için daha önce nöbetçi yazılmış.\n\nTamam: bu günlerdeki nöbetçileri sil\nİptal: dokunma (sıra bu günlerden devam eder)'))return;
  const set=new Set(old.map(r=>r.tarih));S.nobet=S.nobet.filter(r=>!(r.t!=='r'&&r.t!=='t'&&r.sinif===G.sinif&&(r.sube||'')===nbSb()&&set.has(r.tarih)));
}
function nbDist(mon,over){
  const L=sorted(nbOf());if(!L.length)return 0;
  const nx=ids=>{const i=L.findIndex(s=>s.id===ids[ids.length-1]);return i>=0?(i+1)%L.length:null;};
  let ptr=0;const prev=nbRecs().filter(r=>r.tarih<mon&&(r.ids||[]).length).sort((a,b)=>a.tarih<b.tarih?1:-1)[0];
  if(prev){const q=nx(prev.ids);if(q!==null)ptr=q;}
  let k=0;const bas=nbBas();
  for(let i=0;i<5;i++){
    const d=ypAdd(mon,i),r=nbRec(d);
    if(nbHol(d))continue;
    if(r&&(r.ids||[]).length&&(!over||(bas&&d<bas))){const q=nx(r.ids);if(q!==null)ptr=q;continue;}
    if(bas&&d<bas)continue;
    const ids=[];for(let j=0;j<NB.n&&j<L.length;j++){ids.push(L[ptr].id);ptr=(ptr+1)%L.length;}
    nbSet(d,ids);k+=ids.length;
  }
  return k;
}

/* ===== Sınav notları ve analizi. Kayıt: S.sinav = [{sinif,sube,ders,ad,tur,tarih,max,q:[{p,kaz}],n:{öğrenciId:{t,q:[],g}}}] ===== */
const SN={id:'',form:false};
const snSb=()=>G.sube==='ALL'?'':String(G.sube).toLowerCase();
const snList=()=>(S.sinav||[]).filter(e=>e.sinif===G.sinif&&(e.sube||'')===snSb()).sort((a,b)=>a.tarih<b.tarih?1:-1);
const snStu=()=>sorted(S.students.filter(s=>!s.absent&&(G.sinif==='ALL'||T(s.sinif)===G.sinif)&&(G.sube==='ALL'||T(s.sube).toLowerCase()===G.sube)));
const snCur=()=>(S.sinav||[]).find(e=>e.id===SN.id)||null;
const snNum=v=>{const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:null;};
function snTot(e,s){const r=(e.n||{})[s.id];if(!r||r.g)return null;
  if(e.q&&e.q.length){const a=(r.q||[]).map(snNum).filter(x=>x!==null);return a.length?a.reduce((x,y)=>x+y,0):null;}
  return snNum(r.t);}
const snBand=(p,mx)=>{const y=mx?p*100/mx:p;return y>=85?5:y>=70?4:y>=55?3:y>=45?2:1;};
const SN_BL={5:'Pekiyi (85-100)',4:'İyi (70-84)',3:'Orta (55-69)',2:'Geçer (45-54)',1:'Geçmez (0-44)'};
const snR=x=>Math.round(x*10)/10;
function snStats(e){
  const L=snStu(),rows=L.map(s=>({s:s,t:snTot(e,s),g:!!((e.n||{})[s.id]||{}).g})),got=rows.filter(r=>r.t!==null),mx=+e.max||100;
  const tot=got.map(r=>r.t),avg=tot.length?tot.reduce((a,b)=>a+b,0)/tot.length:0;
  const bands={5:0,4:0,3:0,2:0,1:0};got.forEach(r=>{bands[snBand(r.t,mx)]++;});
  const qs=(e.q||[]).map((q,i)=>{const v=got.map(r=>snNum((((e.n||{})[r.s.id]||{}).q||[])[i])).filter(x=>x!==null);const m=v.length?v.reduce((a,b)=>a+b,0)/v.length:0;return {i:i,p:+q.p||0,kaz:q.kaz||'',m:m,y:(+q.p?m*100/(+q.p):0),n:v.length};});
  return {rows:rows,got:got,avg:avg,mx:mx,hi:tot.length?Math.max(...tot):0,lo:tot.length?Math.min(...tot):0,pass:got.filter(r=>snBand(r.t,mx)>=2).length,bands:bands,qs:qs,absent:rows.length-got.length};
}
function snAn(e){
  const st=snStats(e);if(!st.got.length)return '<div class="text-sm text-slate-500">Henüz puan girilmedi.</div>';
  const mx=Math.max(1,...Object.values(st.bands));
  const bars=[5,4,3,2,1].map(k=>'<div class="flex items-center gap-2 text-xs my-1"><span class="w-32 shrink-0">'+SN_BL[k]+'</span><div class="flex-1 bg-slate-200 dark:bg-slate-700 rounded h-4"><div class="h-4 rounded '+(k>=2?'bg-emerald-500':'bg-red-500')+'" style="width:'+(st.bands[k]*100/mx)+'%"></div></div><b class="w-6 text-right">'+st.bands[k]+'</b></div>').join('');
  const qt=st.qs.length?'<div class="text-xs font-bold mt-3 mb-1">Soru / kazanım başarısı</div>'+st.qs.map(q=>'<div class="flex items-center gap-2 text-xs my-1"><span class="w-14 shrink-0">Soru '+(q.i+1)+'</span><div class="flex-1 bg-slate-200 dark:bg-slate-700 rounded h-3"><div class="h-3 rounded '+(q.y<50?'bg-red-500':q.y<70?'bg-amber-500':'bg-emerald-500')+'" style="width:'+Math.min(100,q.y)+'%"></div></div><b class="w-10 text-right">%'+Math.round(q.y)+'</b></div>'+(q.kaz?'<div class="text-[11px] text-slate-500 -mt-0.5 ml-14">'+esc(q.kaz)+'</div>':'')).join(''):'';
  const weak=st.qs.filter(q=>q.y<50);
  return '<div class="grid grid-cols-2 gap-2 text-sm"><div>Katılan: <b>'+st.got.length+'</b>'+(st.absent?' <span class="text-xs text-slate-500">(girmeyen/boş '+st.absent+')</span>':'')+'</div><div>Ortalama: <b>'+snR(st.avg)+'</b></div><div>En yüksek: <b>'+snR(st.hi)+'</b></div><div>En düşük: <b>'+snR(st.lo)+'</b></div><div>Geçen: <b>'+st.pass+'</b> (%'+Math.round(st.pass*100/st.got.length)+')</div></div><div class="mt-3">'+bars+'</div>'+qt
   +(weak.length?'<div class="mt-2 text-xs text-red-700 dark:text-red-300"><b>Tekrar edilmesi gerekenler (başarı %50 altı):</b> '+weak.map(q=>'Soru '+(q.i+1)+(q.kaz?' – '+esc(q.kaz):'')).join('; ')+'</div>':'');
}
function snDoc(e){
  const st=snStats(e),pr=prof(),srt=st.got.slice().sort((a,b)=>b.t-a.t);
  return '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sınav Analizi</title><style>@page{size:A4;margin:12mm}body{font-family:Arial,sans-serif;color:#000;font-size:12px}h1{text-align:center;font-size:18px;margin:0}.s{text-align:center;margin:3px 0 10px}table{width:100%;border-collapse:collapse;margin:6px 0}td,th{border:1px solid #000;padding:4px 6px;text-align:left}th{background:#eee}.c{text-align:center}.b{padding:10px;text-align:center}@media print{.b{display:none}}</style><div class="b"><button onclick="print()" style="font-size:16px;padding:8px 16px">🖨️ Yazdır</button></div>'
   +'<h1>SINAV ANALİZİ</h1><div class="s">'+(pr.okul?esc(pr.okul)+' · ':'')+esc(e.sinif)+(e.sube?'/'+esc(e.sube.toUpperCase()):'')+'. sınıf · '+esc(e.ders||'')+' · '+esc(e.ad||'')+' · '+esc(fdt(e.tarih))+'</div>'
   +'<table><tr><th>Katılan</th><th>Ortalama</th><th>En yüksek</th><th>En düşük</th><th>Geçen</th></tr><tr class="c"><td>'+st.got.length+'</td><td>'+snR(st.avg)+'</td><td>'+snR(st.hi)+'</td><td>'+snR(st.lo)+'</td><td>'+st.pass+' (%'+(st.got.length?Math.round(st.pass*100/st.got.length):0)+')</td></tr></table>'
   +'<table><tr><th>Başarı düzeyi</th><th class="c">Öğrenci sayısı</th></tr>'+[5,4,3,2,1].map(k=>'<tr><td>'+SN_BL[k]+'</td><td class="c">'+st.bands[k]+'</td></tr>').join('')+'</table>'
   +(st.qs.length?'<table><tr><th>Soru</th><th>Kazanım</th><th class="c">Tam puan</th><th class="c">Ortalama</th><th class="c">Başarı</th></tr>'+st.qs.map(q=>'<tr><td>'+(q.i+1)+'</td><td>'+esc(q.kaz)+'</td><td class="c">'+q.p+'</td><td class="c">'+snR(q.m)+'</td><td class="c">%'+Math.round(q.y)+'</td></tr>').join('')+'</table>':'')
   +'<table><tr><th class="c">Sıra</th><th class="c">No</th><th>Ad Soyad</th><th class="c">Puan</th><th class="c">Düzey</th></tr>'+srt.map((r,i)=>'<tr><td class="c">'+(i+1)+'</td><td class="c">'+esc(r.s.no)+'</td><td>'+esc(r.s.name)+'</td><td class="c">'+snR(r.t)+'</td><td class="c">'+snBand(r.t,st.mx)+'</td></tr>').join('')+'</table>'
   +(st.absent?'<div>Girmeyen/puanı boş: '+st.rows.filter(r=>r.t===null).map(r=>esc(r.s.name)).join(', ')+'</div>':'')
   +'<div style="margin-top:24px;text-align:right">Ders Öğretmeni: <b>'+esc(pr.name||'')+'</b></div>';
}
reg('sinav','🧮','Sınav Notları',()=>{
  if(G.sinif==='ALL')return gbar()+'<div class="card text-sm text-amber-700">Önce yukarıdan bir sınıf seçin.</div>';

$('view').addEventListener('change',e=>{
  const d=e.target.dataset||{},x=snCur();if(!x||S.page!=='sinav')return;
  const rec=sid=>{x.n=x.n||{};return x.n[sid]=x.n[sid]||{};};
  let ch=false;
  if(d.snt){const v=String(e.target.value).trim();rec(d.sid).t=v===''?null:snNum(v);ch=true;}
  else if(d.snq!==undefined&&d.sid){const r=rec(d.sid);r.q=r.q||[];r.q[+d.snq]=String(e.target.value).trim()===''?null:snNum(e.target.value);ch=true;const s=S.students.find(z=>z.id===d.sid),el=$('snS_'+d.sid);if(el&&s)el.innerHTML='Toplam: <b>'+(snTot(x,s)==null?'—':snR(snTot(x,s)))+'</b>';}
  else if(d.sng){rec(d.sid).g=e.target.checked;save();render(true);return;}
  else if(d.snqp!==undefined){x.q[+d.snqp].p=snNum(e.target.value)||0;x.max=x.q.reduce((a,q)=>a+(+q.p||0),0);ch=true;}
  else if(d.snqk!==undefined){x.q[+d.snqk].kaz=T(e.target.value);ch=true;}
  if(ch){save();const a=$('snAn');if(a)a.innerHTML=snAn(x);}
});

    const e={donem:G.donem,sinif:G.sinif,sube:snSb(),ders:T($('snD').value),ad:ad,tarih:$('snT').value||G.date,max:mx,q:n?Array.from({length:n},()=>({p:Math.round(mx/n*100)/100,kaz:''})):[],n:{}};
    S.sinav.push(e);save();SN.id=e.id||'';SN.form=false;if(!e.id){const l=snList();SN.id=(l.find(z=>z===e)||{}).id||'';}render(true);},

    XLSX.writeFile(wb,'Sinav_'+(e.ad||'').replace(/[^\wığüşöçİĞÜŞÖÇ]+/g,'_')+'.xlsx');}

/* ===== Dönem sonu: eksik kontrolü + e-Okul'a aktarılabilir not tablosu ===== */
const snDon=e=>e.donem||(()=>{const m=+String(e.tarih||'').slice(5,7);return m>=2&&m<=8?'2':'1';})();
function dsTab(){
  const ex=(S.sinav||[]).filter(e=>e.sinif===G.sinif&&(G.sube==='ALL'||!e.sube||e.sube===G.sube)&&snDon(e)===G.donem).sort((a,b)=>a.tarih<b.tarih?-1:1),L=grp();
  const att=featOn('yoklama');
  const head=['No','Ad Soyad'].concat(ex.map(e=>e.ad||'Sınav'),ex.length?['Sınav ort.']:[],att?['Devamsız gün']:[]);
  const rows=L.map(s=>{const sc=ex.map(e=>snTot(e,s)),v=sc.filter(x=>x!==null),z=dstat(s);
    return [s.no,s.name].concat(sc.map(x=>x===null?'':snR(x)),ex.length?[v.length?snR(v.reduce((a,b)=>a+b,0)/v.length):'']:[],att?[dgun(z.y+z.k/2)]:[]);});
  const gaps=[];
  if(att)gaps.push(['Bu dönem hiç yoklama kaydı olmayan',L.filter(s=>{const z=dstat(s);return z.v+z.y+z.i+z.k===0;})]);
  ex.forEach(e=>gaps.push([(e.ad||'Sınav')+' puanı girilmeyen',L.filter(s=>snTot(e,s)===null&&!((e.n||{})[s.id]||{}).g)]));
  return {ex:ex,L:L,head:head,rows:rows,gaps:gaps};
}
gpage('dsonu','🏁','Dönem Sonu',null,()=>G.sinif==='ALL'?'':'<div class="mb-3 flex flex-wrap items-center gap-2"><button data-act="dscopy" class="btn bg-indigo-600">📋 e-Okul için kopyala</button><button data-act="dsxls" class="btn bg-green-700">📗 Excel</button><button data-act="dsprn" class="btn bg-emerald-600">🖨️ Yazdır</button></div>',()=>{

/* ===== Ders programına göre sınıfı otomatik seç: Ders takip ve Ezber takip sayfası açılırken ===== */
/* Şu an süren ders; yoksa 10 dk içinde başlayacak ders; yoksa 10 dk içinde bitmiş ders. */
function bgCur(){
  const m=bgMin(),l=bgToday().filter(x=>bgT(x.bas)>=0&&bgT(x.bit)>bgT(x.bas));
  return l.find(x=>bgT(x.bas)<=m&&m<bgT(x.bit))
    ||l.find(x=>bgT(x.bas)>m&&bgT(x.bas)-m<=10)
    ||l.slice().reverse().find(x=>m>=bgT(x.bit)&&m-bgT(x.bit)<=10)||null;
}

/* ========== OTOMATİK BULUT YEDEĞİ: her gün odanın kopyası bulutta ayrı yola, son 7 yedek tutulur ========== */
/* Yollar: yedek/{oda}/{YYYY-AA-GG}/json (veri) ve yedekm/{oda}/{tarih} (küçük bilgi). "once" = geri yüklemeden önceki durum. */
const YB={list:null,busy:false};
const ybRef=()=>db.ref('yedek/'+S.room),ybMeta=()=>db.ref('yedekm/'+S.room);
async function ybList(){
  if(!S.room)return;
  try{await auth();const v=(await ybMeta().once('value')).val()||{};
    YB.list=Object.keys(v).map(k=>({k:k,n:v[k].n||0,kb:v[k].kb||0})).sort((a,b)=>a.k==='once'?-1:b.k==='once'?1:a.k<b.k?1:-1);
  }catch(e){YB.list=[];}
  if(document.querySelector('[data-act="ybnow"]'))render(true);
}
async function ybSave(key){
  const json=dump();if(json.length>8000000)throw new Error('big');
  await auth();
  await ybRef().child(key).set({json:json});
  await ybMeta().child(key).set({ts:Date.now(),n:S.students.length,kb:Math.round(json.length/1024)});
}
async function ybPrune(){
  const v=(await ybMeta().once('value')).val()||{},ks=Object.keys(v).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort().reverse();
  for(const k of ks.slice(7)){await ybRef().child(k).remove();await ybMeta().child(k).remove();}
}
async function ybTick(force){
  if(!S.room||kioskOn()||YB.busy)return;
  if(!force&&(lastRoom!==S.room||!S.students.length))return;
  const td=bdNow();if(!force&&lsg('yb_last_'+S.room)===td)return;
  YB.busy=true;
  try{await auth();
    const have=(await ybMeta().child(td).once('value')).val();
    if(!have||force)await ybSave(td);
    lss('yb_last_'+S.room,td);await ybPrune();YB.busy=false;await ybList();
    if(force)toast('Bulut yedeği alındı');
  }catch(e){YB.busy=false;if(force)toast(e.message==='big'?'Veri yedek için çok büyük.':'Bulut yedeği alınamadı. Firebase kurallarına yedek yolu eklenmiş mi?',1);}

   +'<ol class="text-sm list-decimal pl-5 space-y-1"><li><b>Önce yedeğinizi indirin</b> (yukarıdaki yedek ve Excel düğmeleri). İndirdiğiniz dosyalar öğrenci verisi içerir, saklama süreniz bitince onları da silin.</li><li>Neleri sileceğinizi seçin.</li><li>Onaylayın.</li></ol>'
   +'<div class="my-2 space-y-1 text-sm"><label class="flex gap-2"><input type="checkbox" checked disabled> <span>Tüm öğrenciler ve onlara ait her kayıt (yoklama, puan, notlar, ödev/ezber/rehberlik işaretleri, fotoğraflar, oturma yerleri)</span></label>'
   +'<label class="flex gap-2"><input type="checkbox" id="ysC" checked> <span>Bulut yedeklerini sil (içlerinde öğrenci verisi var)</span></label>'
   +'<label class="flex gap-2"><input type="checkbox" id="ysS" checked> <span>Veli karne bağlantılarını iptal et ('+tk.length+' bilinen bağlantı)</span></label>'
   +'<label class="flex gap-2"><input type="checkbox" id="ysA"> <span>Ödev, ezber ve rehberlik atamalarını da sil (öğrenci verisi değil, yeni yıl için kalabilir)</span></label></div>'
   +'<label class="flex gap-2 text-sm"><input type="checkbox" id="ysOk"> <span>Yedeğimi aldım, silmenin geri alınamayacağını biliyorum.</span></label>'
   +'<input id="ysT" class="inp w-full mt-2" placeholder="Onay için SİL yazın" autocomplete="off">'
   +'<button data-act="ysdo" class="btn bg-red-600 w-full mt-2">Yıl sonu temizliğini yap</button>'
   +'<p class="text-xs text-slate-500 mt-2">Bu güncellemeden önce oluşturulmuş ve başka cihazlarda üretilmiş veli bağlantıları listede görünmeyebilir. Bunlar oluşturulduktan en geç 30 gün sonra kendiliğinden süresi dolar.</p></div>';
}
function ysBar(){
  /* Oda boşsa (başka cihazdan silindiyse) bu cihazdaki eski bağlantı listesi de temizlenir */
  if(!S.students.length&&lastRoom===S.room&&shr().length)lss('shares_v1','[]');
  const d=new Date(),y=d.getFullYear(),m=d.getMonth()+1,g=d.getDate();
  if(!S.students.length||lsg('ys_dis')===String(y))return '';
  if(!((m===6&&g>=15)||m===7||m===8))return '';
  return '<div class="card !bg-red-50 !border-red-300 text-red-900"><div class="font-semibold">🧹 Eğitim yılı bitti mi?</div><div class="text-sm mt-1">Öğrenci verilerini yıl sonunda silmeniz gerekiyor. Ayarlar → Yedekleme ve Excel bölümünde önce yedek alın, sonra “Yıl sonu temizliği”ni yapın.</div><div class="flex gap-2 mt-2"><button data-go="ayar" class="btn bg-red-600 !py-1.5">Ayarlar</button><button data-act="ysdis" class="px-3 py-1.5 rounded-lg border text-sm">Bu yıl hatırlatma</button></div></div>';
}
Object.assign(ACT,{
  ysdis(){lss('ys_dis',String(new Date().getFullYear()));render(true);},
  async ysdo(){
    if(!$('ysOk').checked||T($('ysT').value).toLocaleUpperCase('tr')!=='SİL')return alert('Onay kutusunu işaretleyin ve kutuya SİL yazın.');
    const n=S.students.length;if(!n)return alert('Silinecek öğrenci yok.');
    const wc=$('ysC').checked,ws=$('ysS').checked,wa=$('ysA').checked,tk=ysTok();
    if(!confirm(n+' öğrenci ve onlara ait tüm kayıtlar kalıcı olarak silinecek. Devam edilsin mi?'))return;
    const rep=[n+' öğrenci ve tüm kayıtları silindi'];
    del(()=>{S.students=[];if(wa){S.homeworks=[];S.ezberItems=[];}},'Yıl sonu temizliği yapıldı');
    if(wa)rep.push('Ödev, ezber ve rehberlik atamaları silindi');
    try{await auth();}catch(e){}
    if(ws){let k=0;for(const t of tk){try{await db.ref('share/'+t).remove();k++;}catch(e){}}lss('shares_v1','[]');S.ayar=S.ayar.filter(x=>x.kim!=='_share');save();rep.push(k+'/'+tk.length+' veli bağlantısı iptal edildi');}
    if(wc&&S.room){try{await ybRef().remove();await ybMeta().remove();YB.list=[];rep.push('Bulut yedekleri silindi');}catch(e){rep.push('Bulut yedekleri SİLİNEMEDİ (Firebase kurallarını kontrol edin)');}}
    render(true);
    alert('Yıl sonu temizliği tamamlandı:\n- '+rep.join('\n- ')+'\n\nİndirdiğiniz yedek dosyalarını da saklama süreniz bitince silmeyi unutmayın.');
  }
});
{const hy=P.home.html;P.home.html=()=>ysBar()+hy();}

/* ========== ÖĞRETMEN GİRİŞİ (e-posta / Google) ========== */
/* Veli bağlantısı (?k=) ve tahta cihazı giriş istemez; öğretmen ekranı ister. Not: Bu ekran arayüz kapısıdır, veri güvenliği Firebase kurallarıyla sağlanır. */
const IZINLI=[]; /* Boş: giriş yapan herkes geçer. Dolu ise yalnızca bu e-postalar (küçük harf) ve doğrulanmış hesaplar geçer. Örn: ['ad@gmail.com'] */
const KAYIT_ACIK=true; /* false: "Hesap oluştur" düğmesi gizlenir (hesapları Firebase konsolundan açarsınız) */
var TCH={started:false,start:null};
const tOK=u=>!!u&&!u.isAnonymous&&(!IZINLI.length||(IZINLI.includes(String(u.email||'').toLowerCase())&&u.emailVerified));
const tErr=e=>({'auth/invalid-email':'E-posta adresi geçersiz.','auth/missing-password':'Şifreyi yazın.','auth/invalid-credential':'E-posta ya da şifre yanlış.','auth/wrong-password':'E-posta ya da şifre yanlış.','auth/user-not-found':'E-posta ya da şifre yanlış.','auth/email-already-in-use':'Bu e-posta ile hesap zaten var. Giriş yapın.','auth/weak-password':'Şifre en az 6 karakter olmalı.','auth/too-many-requests':'Çok fazla deneme. Biraz bekleyip tekrar deneyin.','auth/popup-blocked':'Açılır pencere engellendi. Tarayıcıda bu site için izin verin.','auth/popup-closed-by-user':'Giriş penceresi kapatıldı.','auth/cancelled-popup-request':'','auth/operation-not-allowed':'Bu giriş yöntemi Firebase\'de kapalı (Authentication → Sign-in method).','auth/unauthorized-domain':'Bu adres Firebase → Authentication → Settings → Authorized domains listesinde yok.','auth/network-request-failed':'İnternet bağlantısı yok.'}[e&&e.code]??('Hata: '+((e&&(e.message||e.code))||'bilinmiyor')));
const gl=document.createElement('div');gl.className='fixed inset-0 z-[700] bg-indigo-900 text-white p-6 overflow-y-auto';gl.style.display='none';
gl.innerHTML='<div class="m-auto flex flex-col items-center gap-3 w-full text-center"><div class="text-5xl">🕌</div><b class="text-xl">Sınıf Takip</b><div class="text-sm text-indigo-200">Öğretmen girişi</div>'
 +'<input id="gE" type="email" autocomplete="username" class="inp text-slate-900 w-72 max-w-full" placeholder="E-posta">'
 +'<input id="gP" type="password" autocomplete="current-password" class="inp text-slate-900 w-72 max-w-full" placeholder="Şifre">'
 +'<div id="gM" class="min-h-[20px] text-amber-300 text-sm max-w-xs"></div>'
 +'<button id="gIn" class="bg-amber-400 text-slate-900 font-bold rounded-xl px-8 py-2 w-72 max-w-full">Giriş yap</button>'
 +'<button id="gGo" class="bg-white text-slate-800 font-semibold rounded-xl px-8 py-2 w-72 max-w-full">Google ile giriş</button>'
 +'<div class="flex gap-5 text-sm underline text-indigo-200"><button id="gNew">Hesap oluştur</button><button id="gRs">Şifremi unuttum</button></div></div>';
document.body.appendChild(gl);
const gMsg=t=>{$('gM').textContent=t||'';};
const gOpen=()=>{gl.style.display='flex';gMsg('');};
/* Oda kodu hesaba bağlanır: users/<uid>/room. Yeni cihazda girişten sonra kod otomatik gelir. */
function tWarn(){if(TCH.warned)return;TCH.warned=true;toast('Oda hesaba bağlanamadı: Firebase kurallarını güncelleyin (owners, users, kioskKod, kioskUid).',true);}
/* Oda sahipliği: owners/<oda> = uid. Kurallar odayı yalnızca sahibine (ve kodla yetkilenen tahtaya) açar. */
const claim=async(room,u)=>{try{await db.ref('owners/'+room).set(u.uid);return true;}catch(e){return false;}};
async function tRoomLoad(){
  const u=firebase.auth().currentUser;if(!tOK(u))return;
  const tok=TCH.tok=(TCH.tok||0)+1,dead=()=>TCH.dead>=tok;
  try{
    await auth();const r=db.ref('users/'+u.uid+'/room'),v=(await r.once('value')).val();if(dead())return;
    let room=(typeof v==='string'&&v)?v:'';
    if(room&&!await claim(room,u))room='';
    if(dead())return;
    if(!room&&S.room&&confirm('Bu cihazda daha önce kullanılmış bir sınıf odası kayıtlı.\n\nBu oda ve içindeki öğrenci verileri SİZE mi ait?\n\nTamam: oda bu hesaba bağlanır.\nİptal: size ait yeni boş bir alan oluşturulur.')){
      if(await claim(S.room,u))room=S.room;else alert('Bu oda başka bir hesaba bağlı. Size ait yeni bir alan oluşturulacak.');
    }
    if(!room){room=genCode();if(!await claim(room,u))throw new Error('Oda oluşturulamadı');toast('Size ait yeni sınıf alanı oluşturuldu');}
    if(room!==v)await r.set(room);
    TCH.cloudRoom=room;
    if(room!==S.room){S.room=room;lss('sync_room_code',room);TCH.changed=true;}
  }catch(e){console.warn('Hesap-oda eşlemesi:',e);tWarn();}
}
function tRoomSave(c){
  const u=firebase.auth().currentUser;if(!c||!tOK(u)||c===TCH.cloudRoom)return;
  auth().then(()=>db.ref('users/'+u.uid+'/room').set(c)).then(()=>{TCH.cloudRoom=c;}).catch(e=>{console.warn('Hesap-oda eşlemesi:',e);tWarn();});
}
const _listen=listen;listen=function(c){_listen(c);tRoomSave(c);};
async function gDone(){
  _auth=null;gl.style.display='none';$('gP').value='';
  TCH.changed=false;
  /* Çevrimdışıysak (ya da 5 sn içinde yanıt gelmezse) cihazdaki oda koduyla açılır; uygulama internetsiz de başlar. */
  if(!(S.room&&!navigator.onLine))await Promise.race([tRoomLoad(),new Promise(ok=>setTimeout(()=>{if(S.room){TCH.dead=TCH.tok||0;}ok();},5000))]);
  if(!TCH.started){TCH.started=true;if(TCH.start)TCH.start();}
  else if(TCH.changed&&S.room){lastRoom='';listen(S.room);}
}
async function gAccept(u,isNew){
  const em=String(u.email||'').toLowerCase();
  if(IZINLI.length&&!IZINLI.includes(em)){await firebase.auth().signOut();return gMsg('Bu hesabın bu uygulamaya erişim izni yok.');}
  if(IZINLI.length&&!u.emailVerified){if(!isNew){try{await u.sendEmailVerification();}catch(e){}}await firebase.auth().signOut();return gMsg('E-postanıza doğrulama bağlantısı gönderildi. Doğruladıktan sonra tekrar giriş yapın.');}
  gDone();
}
const gRun=async f=>{gMsg('');try{await f();}catch(e){gMsg(tErr(e));}};
$('gIn').onclick=()=>gRun(async()=>{const e=T($('gE').value),p=$('gP').value;if(!e||!p)return gMsg('E-posta ve şifreyi yazın.');const c=await firebase.auth().signInWithEmailAndPassword(e,p);await gAccept(c.user,false);});
$('gP').addEventListener('keydown',ev=>{if(ev.key==='Enter')$('gIn').click();});
$('gGo').onclick=()=>gRun(async()=>{const c=await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());await gAccept(c.user,false);});
$('gNew').onclick=()=>gRun(async()=>{const e=T($('gE').value),p=$('gP').value;if(!e||!p)return gMsg('E-posta yazın ve en az 6 karakterli bir şifre belirleyin.');if(p.length<6)return gMsg('Şifre en az 6 karakter olmalı.');const c=await firebase.auth().createUserWithEmailAndPassword(e,p);try{await c.user.sendEmailVerification();}catch(x){}await gAccept(c.user,true);});
$('gRs').onclick=()=>gRun(async()=>{const e=T($('gE').value);if(!e)return gMsg('Önce e-posta adresinizi yazın.');await firebase.auth().sendPasswordResetEmail(e);gMsg('Şifre sıfırlama bağlantısı e-postanıza gönderildi.');});
if(!KAYIT_ACIK)$('gNew').style.display='none';
function gateStart(fn){
  TCH.start=fn;
  if(kioskOn()){TCH.started=true;fn();return;} /* tahta cihazı giriş istemez */
  const off=firebase.auth().onAuthStateChanged(u=>{off();if(tOK(u))gDone();else gOpen();});
}
function gateEnforce(){if(kioskOn()||tOK(firebase.auth().currentUser))return;gOpen();}
function accCard(){const u=firebase.auth().currentUser;if(!u||u.isAnonymous)return '';return '<div class="card"><b>👤 Hesap</b><p class="text-xs text-slate-500 my-1">'+esc(u.email||u.displayName||'Öğretmen')+' olarak giriş yapıldı.</p><button data-act="tchout" class="btn bg-red-600">Çıkış yap</button></div>';}
Object.assign(ACT,{async tchout(){if(!confirm('Hesaptan çıkış yapılsın mı?'+(pcount()?'\n\nUYARI: Gönderilmemiş '+pcount()+' değişiklik var. Çıkarsanız bunlar silinir; önce internete bağlanın.':'')+'\n\nBu cihazdaki çevrimdışı veri kopyası da silinir.'))return;try{localStorage.removeItem('sync_room_code');}catch(e){}try{await new Promise(ok=>{const q=indexedDB.deleteDatabase('sinif_offline');q.onsuccess=q.onerror=q.onblocked=()=>ok();setTimeout(ok,1500);});}catch(e){}try{await firebase.auth().signOut();}catch(e){}location.reload();}});

const PK=new URLSearchParams(location.search).get('k');
{const c0=P.cikti.html;P.cikti.html=()=>c0()+printBtns();}
if(PK)parentView(PK);else gateStart(()=>{go(kioskOn()?'tahta':'home');if(kioskOn()){if(lsg('kiosk_v1')==='1'&&S.room)listen(S.room);}else if(S.room)listen(S.room);else room();});
</script>

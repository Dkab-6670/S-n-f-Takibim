<script>
/* ========== 1. AYARLAR ve YARDIMCILAR ========== */
const firebaseConfig = {
  apiKey: "AIzaSyBCYKK_JSTrLzLI2MfeZV3-p0OpgPpgN6I",
  authDomain: "sinif-takibim.firebaseapp.com",
  databaseURL: "https://sinif-takibim-default-rtdb.firebaseio.com",
  projectId: "sinif-takibim",
  appId: "1:880218179845:web:fcf8028376df22b24d0f6c"

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=s=>String(s??'').trim(), num=v=>parseInt(v)||0;
const lsg=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, lss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const _d=new Date(), today=new Date(_d-_d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const isO=v=>v!==null&&typeof v==='object';

/* ========== 2. DURUM ve VERİ BİÇİMİ ========== */
const KEYS=['students','lessons','ezberItems','homeworks','msgs','plans','yplan','prog','kyer','ayar'], PRE={students:'ST_',lessons:'L_',ezberItems:'E_',homeworks:'HW_',msgs:'M_',plans:'PL_',yplan:'YP_',prog:'PG_',kyer:'KY_',ayar:'AY_'};
const S={students:[],lessons:[],ezberItems:[],homeworks:[],msgs:[],plans:[],yplan:[],prog:[],kyer:[],ayar:[],room:lsg('sync_room_code')||'',page:'home',F:{sinif:'ALL',sube:'ALL',q:''},G:{sinif:'ALL',sube:'ALL',donem:'1',date:today}};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function prepare(l,p){let m=l.reduce((a,x)=>Math.max(a,typeof x._o==='number'?x._o:-1),-1);l.forEach(x=>{if(!x.id)x.id=uid(p);if(typeof x._o!=='number')x._o=++m;});}
function toList(v,p){
  let a=Array.isArray(v)?v.filter(x=>x!=null):isO(v)?Object.entries(v).map(([k,x])=>{if(isO(x)&&!x.id)x.id=k;return x;}):[];
  a=a.map(x=>typeof x==='string'?{name:x,sinif:'ALL'}:x);prepare(a,p);a.sort((x,y)=>x._o-y._o);if(p==='E_'){const ts=x=>{const n=parseInt(String(x.id||'').slice(2,-4),36);return isFinite(n)?n:0;};a.sort((x,y)=>ts(x)-ts(y)||x._o-y._o);}return a;
}
const toMap=l=>Object.fromEntries(l.map(x=>[x.id,x]));
const snap=()=>JSON.parse(JSON.stringify(Object.fromEntries(KEYS.map(k=>[k,toMap(S[k])]))));
const dump=()=>JSON.stringify(Object.fromEntries(KEYS.map(k=>[k,S[k]])));
const apply=o=>KEYS.forEach(k=>{S[k]=Array.isArray(o[k])?o[k]:[];});
function diff(u,p,o,n){
  if(n==null){if(o!=null)u[p]=null;return;}
  if(isO(n)&&isO(o)){new Set([...Object.keys(o),...Object.keys(n)]).forEach(k=>diff(u,p+'/'+k,o[k],n[k]));return;}
  if(JSON.stringify(o)!==JSON.stringify(n))u[p]=n;
}
const dayRec=(s,p,d)=>{s.periods=s.periods||{};const x=s.periods[p]=s.periods[p]||{hafiz:false,kuranDurum:'kuran',days:{}};x.days=x.days||{};
  const r=x.days[d]=x.days[d]||{};return r;};
const classes=()=>[...new Set(S.students.map(s=>T(s.sinif)))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'tr',{numeric:true}));
const subes=c=>[...new Set(S.students.filter(s=>c==='ALL'||T(s.sinif)===c).map(s=>T(s.sube).toLowerCase()))].filter(Boolean).sort();
const sorted=l=>l.slice().sort((a,b)=>num(a.sinif)-num(b.sinif)||String(a.sube).localeCompare(String(b.sube))||num(a.no)-num(b.no)||String(a.name).localeCompare(String(b.name),'tr'));

/* ========== 3. FIREBASE: giriş, dinleme, kayıt ========== */
firebase.initializeApp(firebaseConfig);
/* App Check (Dolandırıcılık Savunması / reCAPTCHA Enterprise). Site anahtarı gizli değildir.
   Anahtarı konsoldan KOPYALAYIP yapıştırın: I/l ve 0/O karışabilir. */
const AC_KEY='6Ldb4fstAAAAALCKPD9LkXvl5GuMqpv2KnET_f2B';
const AC_ON=false; /* true yapmadan önce firebase-app-check-compat.js satırını (üstte) geri açın. Konsolda Enforce açılacaksa gerekli. */
try{
  if(AC_ON&&firebase.appCheck){
    if(location.hostname==='localhost'||location.hostname==='127.0.0.1')self.FIREBASE_APPCHECK_DEBUG_TOKEN=true; /* yalnızca yerel deneme */
    firebase.appCheck().activate(new firebase.appCheck.ReCaptchaEnterpriseProvider(AC_KEY),true);
  }
}catch(e){console.warn('App Check başlatılamadı:',e);}
const db=firebase.database();
let _auth=null,ref=null,last={},lastRoom='',online=true,queued=0,t2;
const auth=()=>_auth||(_auth=new Promise((ok,no)=>{const a=firebase.auth(),u=a.onAuthStateChanged(x=>{u();x?ok():a.signInAnonymously().then(ok,e=>{_auth=null;alert('Giriş hatası: '+e.message+'\nFirebase > Authentication > Anonymous açık mı?');no(e);});});}));
const genCode=()=>{const al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='SNF-';crypto.getRandomValues(new Uint32Array(16)).forEach(n=>{s+=al[n%al.length]});return s;};
const mask=c=>c.length>6?c.slice(0,4)+'•'.repeat(c.length-4):c;
function status(c,t){$('dot').className='w-3 h-3 md:w-2.5 md:h-2.5 rounded-full bg-'+c+'-500';$('stx').textContent=t;}
let tt;function toast(m,err){const t=$('toast');t.textContent=m;t.className=t.className.replace(/ bg-\S+/g,'')+(err?' bg-red-600':' bg-emerald-600')+' opacity-100';clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('opacity-100'),err?5000:1800);}
function listen(code){
  S.room=code;lss('sync_room_code',code);$('rc').textContent=mask(code);status('amber','Yükleniyor...');
  if(ref){ref.off();ref=null;}
  auth().then(()=>{
    ref=db.ref('rooms/'+code);
    ref.on('value',sn=>{
      const d=sn.val();
      if(d){KEYS.forEach(k=>{S[k]=toList(d[k],PRE[k]);});last=snap();lastRoom=code;if(KEYS.some(k=>Array.isArray(d[k])))sn.ref.update(last);}
      status('emerald','Canlı');render();
    },err=>{status('red','Bağlantı hatası');if(kioskOn()){if(lsg('kiosk_v1')==='1'&&lsg('kiosk_h'))bdEnd();return;}alert('Firebase hatası: '+err.message);});
  }).catch(()=>status('red','Giriş hatası'));
}
function save(){
  if(!S.room)return;
  KEYS.forEach(k=>prepare(S[k],PRE[k]));
  const now=snap(),u={},root='rooms/'+S.room;
  diff(u,root,lastRoom===S.room?last:{},now);u[root+'/lastUpdated']=firebase.database.ServerValue.TIMESTAMP;
  last=now;lastRoom=S.room;
  if(!online){queued++;offBar();}
  toast('Kaydediliyor…');
  auth().then(()=>db.ref().update(u)).then(()=>toast('Kaydedildi ✓')).catch(e=>toast('Kaydedilemedi: '+e.message,true));
}
function offBar(){const b=$('off');b.className=b.className.replace(/ bg-\S+/g,'')+' bg-red-600 block';b.classList.remove('hidden');b.textContent='📴 Çevrimdışı'+(queued?' · '+queued+' değişiklik bekliyor':'');}
firebase.database().ref('.info/connected').on('value',s=>{
  const was=online;online=!!s.val();clearTimeout(t2);
  if(!online){t2=setTimeout(()=>{if(!online)offBar();},3000);return;}
  const b=$('off');
  if(!was&&queued){b.className=b.className.replace(/ bg-\S+/g,'')+' bg-emerald-600 block';b.textContent='✅ '+queued+' değişiklik gönderildi';queued=0;setTimeout(()=>{if(online)b.classList.add('hidden');},2500);}
  else b.classList.add('hidden');
});
addEventListener('beforeunload',e=>{if(!online&&queued){e.preventDefault();e.returnValue='';}});

/* Geri al */
let U=null,ut;
function del(fn,msg){U=dump();fn();save();$('undoMsg').textContent=msg;$('undo').classList.remove('hidden');$('undo').classList.add('flex');clearTimeout(ut);ut=setTimeout(()=>{$('undo').classList.add('hidden');U=null;},10000);render(true);}
$('undoBtn').onclick=()=>{if(!U)return;apply(JSON.parse(U));U=null;$('undo').classList.add('hidden');save();render(true);};

/* ========== 4. SAYFA KAYIT SİSTEMİ (sıra önemli değil) ========== */
const P={},NAV=[];
function reg(id,icon,title,html,after,nav){P[id]={icon,title,html,after};if(nav)NAV.push([id,icon,nav]);drawNav();}
function drawNav(){
  const b=NAV.filter(n=>pageOn(n[0])).map(n=>'<button data-nav="'+n[0]+'" data-go="'+n[0]+'"><span class="text-xl">'+n[1]+'</span>'+esc(n[2])+'</button>').join('');
  $('bn').innerHTML=b;
  $('tn').innerHTML=NAV.filter(n=>pageOn(n[0])).map(n=>'<button data-nav="'+n[0]+'" data-go="'+n[0]+'">'+n[1]+' '+esc(n[2])+'</button>').join('');
}
let pending=false;
const typing=()=>{const a=document.activeElement;return a&&$('view').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);};
function render(force){
  if(!force&&typing()){pending=true;return;}
  if(!force&&S.page==='akv'&&akSoft())return;
  if(!pageOn(S.page))S.page='home';if(window.__lp!==S.page){['o_prof','o_tan','o_sec','o_bak','bOpen','kOpen'].forEach(k=>{S[k]=false;});window.__lp=S.page;}const p=P[S.page]||P.home;
  $('ptitle').innerHTML=(S.page!=='home'?'<button data-go="home" class="btn bg-indigo-600 !px-3 !py-1 whitespace-nowrap">🏠 Ana Sayfa</button>':'')+'<span>'+p.icon+' '+esc(p.title)+'</span>'+(S.page!=='home'?'<span class="ml-auto text-xs font-semibold bg-indigo-100 text-indigo-800 dark:bg-indigo-900 dark:text-indigo-200 rounded-full px-3 py-1 whitespace-nowrap">📌 '+(S.G.sinif==='ALL'?'Tüm sınıflar':esc(S.G.sinif)+(S.G.sube==='ALL'?'. sınıf':'/'+esc(S.G.sube.toUpperCase())))+'</span>':'');document.title=p.title+' | Sınıf Takip';
  $('view').innerHTML=p.html();if(p.after)p.after();
  document.documentElement.style.setProperty('--th',($('ptitle').offsetHeight+8)+'px');
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===S.page));
}
function go(id){S.page=P[id]?id:'home';render(true);scrollTo({top:0});}
$('view').addEventListener('focusout',()=>{if(pending){pending=false;setTimeout(render,0);}});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return;}
  const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act])ACT[a.dataset.act](a);
});
const ACT={};

/* ========== 5. SAYFA: ANA SAYFA ========== */
/* Düzen: Bugün kartı (bildirimler) > sınıf seçimi > büyük günlük kısayollar > sakin diğer sayfalar > özet satırı */
ACT.hcls=a=>{G.sinif=a.dataset.s;G.sube=a.dataset.b;G.date=today;G.q='';gsave();render(true);};
const classChips=A=>{
  const cs=[...new Set(A.map(s=>T(s.sinif)+'|'+(T(s.sube).toLowerCase()||'ALL')))].filter(k=>k.split('|')[0]).sort((a,b)=>a.localeCompare(b,'tr',{numeric:true}));
  if(!cs.length)return '';
  const chip=(sn,sb,t,on)=>'<button data-act="hcls" data-s="'+esc(sn)+'" data-b="'+esc(sb)+'" class="shrink-0 px-3 py-1.5 rounded-full border text-sm font-semibold '+(on?'bg-indigo-600 text-white border-indigo-600':'bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-600')+'">'+t+'</button>';
  return '<div class="font-bold text-sm mb-1">🏫 Sınıf</div><div class="flex gap-2 overflow-x-auto pb-2 mb-1">'+chip('ALL','ALL','Tümü',G.sinif==='ALL'&&G.sube==='ALL')
    +cs.map(k=>{const c=k.split('|');return chip(c[0],c[1],esc(c[0])+(c[1]!=='ALL'?'/'+esc(c[1].toUpperCase()):''),G.sinif===c[0]&&G.sube===c[1]);}).join('')+'</div>';
};

function hqN(t){return String(t||'').toLocaleLowerCase('tr').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();}
function hqCard(){return '<div class="card"><input id="hq" type="search" class="inp w-full" placeholder="🔎 Özellik, sayfa veya öğrenci ara…" autocomplete="off" enterkeyhint="search"><div id="hqr" class="mt-2"></div></div>';}
function hqRun(v){
  const box=$('hqr');if(!box)return;const q=hqN(v);if(!q){box.innerHTML='';return;}
  const W=q.split(' ');const hit=txt=>{const n=hqN(txt);return W.every(w=>n.includes(w));};
  const KW={dini:'dini zikir zikirmatik esma esmaul husna namaz vakti vakitleri ezan tesbih',ogr:'ogrenci ekle liste excel toplu fotograf izin sinif sube numara sil',yedek:'yedek indir yukle json excel rapor geri yukle',stat:'istatistik grafik en cok ezber puan siralama gizle sira kutu',uyari:'uyari bildirim devamsiz odev yapmayan',ayar:'ayarlar cikis hesap pin kilit tema karanlik profil tanim oda kodu guvenlik ekran',akv:'akvaryum balik',tahta:'tahta akilli kiosk kod bekleme ogrenci ekrani',yplan:'yillik plan haftalik ders plani etkinlik meb cerceve excel yukle',bugun:'bugun yoklama ders programi',cikti:'cikti yazdir pdf liste cizelge karne veli izin belgesi',yok:'yoklama devam var yok izinli',ders:'ders puan program',ezber:'ezber cuz sure',odevhiz:'odev hizli kontrol',dav:'davranis puan not',reh:'rehberlik calisma',oturma:'oturma plani sira',soz:'soz hakki kura',haf:'hafizlik cuz cizelge',donem:'donem cizelge haftalik aylik',karne:'karne yazdir pdf'};
  const res=[];
  Object.keys(P).forEach(k=>{if(k==='home'||!pageOn(k))return;const p=P[k];if(hit(p.title+' '+(KW[k]||'')))res.push(['<button data-go="'+k+'" class="w-full text-left flex items-center gap-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm"><span class="text-xl">'+p.icon+'</span><b class="flex-1">'+esc(p.title)+'</b><span class="text-[11px] text-slate-400">Sayfa</span></button>',hqN(p.title).startsWith(W[0])?0:1]);});
  [['🗓️','Haftalık ders programım','hprog','haftalik ders programi program saat gun bugunku dersler'],['📷','Toplu fotoğraf ekle','pbopen','toplu fotograf ekle ogrenci resim foto izin'],['👨‍👩‍👧','Veli bilgilerini Excel ile yükle','vlxl','veli bilgi iletisim telefon anne baba excel yukle e okul'],['🚪','Çıkış yap','tchout','cikis yap hesap oturum kapat'],['🆕','Neler yeni (Yenilikler)','news','yenilik yenilikler neler yeni surum yeni ozellik']].forEach(x=>{if(hit(x[1]+' '+x[3]))res.push(['<button data-act="'+x[2]+'" class="w-full text-left flex items-center gap-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm"><span class="text-xl">'+x[0]+'</span><b class="flex-1">'+esc(x[1])+'</b><span class="text-[11px] text-slate-400">İşlem</span></button>',1]);});
  res.sort((a,b)=>a[1]-b[1]);
  const st=S.students.filter(s=>hit(s.name+' '+s.no+' '+s.sinif+' '+s.sinif+String(s.sube))).slice(0,8).map(s=>'<button data-act="card" data-id="'+esc(s.id)+'" class="w-full text-left flex items-center gap-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm">'+(s.photo?av(s,28):'<span class="text-xl">👤</span>')+'<b class="flex-1">'+esc(s.name)+'</b><span class="text-[11px] text-slate-400">'+esc(s.sinif)+'/'+esc(String(s.sube).toUpperCase())+' · '+esc(s.no)+'</span></button>');
  const all=res.map(x=>x[0]).slice(0,10).concat(st);
  box.innerHTML=all.length?'<div class="space-y-1.5">'+all.join('')+'</div>':'<div class="text-xs text-slate-400 italic">Sonuç bulunamadı. Başka bir sözcük deneyin.</div>';
}

   +quick+diniBtn()+prHomeCard()+ypHomeCard()+(pageOn('yplan')?exCard():'')+more+'<div class="text-xs text-slate-400 text-center mt-5">'+sm+'</div>';

Object.assign(ACT,{
  add(){
    const n=T($('na').value),s=T($('ns').value);
    if(!n||!s)return alert('Sınıf ve ad soyad gerekli.');
    S.students.push({id:uid('ST_'),sno:'',no:T($('nn').value)||'-',sinif:s,sube:okSube($('nb').value),name:n,periods:{}});
    save();render(true);
  },
  bulk(){
    let c=0,d=0;
    $('nbulk').value.split('\n').forEach(line=>{
      const p=line.split('\t').map(T);if(p.length<5||!p[4])return;
      const x={id:uid('ST_'),sno:p[0],no:p[1]||'-',sinif:p[2],sube:okSube(p[3]),name:p[4],periods:{}};
      if(S.students.some(y=>T(y.sinif)===x.sinif&&T(y.sube).toLowerCase()===x.sube&&String(y.no)===x.no&&x.no!=='-')){d++;return;}
      S.students.push(x);c++;
    });
    if(c)save();alert(c+' öğrenci eklendi'+(d?', '+d+' tekrar atlandı':'')+'.');render(true);
  },
  edit(a){
    const s=find(a);if(!s)return;
    const x=prompt('Sınıf:',s.sinif);if(x===null)return;const y=prompt('Şube:',s.sube);if(y===null)return;
    const z=prompt('Okul numarası:',s.no);if(z===null)return;const w=prompt('Adı soyadı:',s.name);if(w===null)return;
    s.sinif=T(x)||s.sinif;s.sube=okSube(y)||s.sube;s.no=T(z)||s.no;s.name=T(w)||s.name;save();render(true);
  },
  abs(a){const s=find(a);if(s){s.absent=!s.absent;save();render(true);}},
  del(a){const s=find(a);if(!s||!confirm(s.name+' silinsin mi?'))return;del(()=>{S.students=S.students.filter(x=>x!==s);},'1 öğrenci silindi');}
});

function alSeen(){try{const o=JSON.parse(lsg('al_seen')||'[]');return Array.isArray(o)?o:[];}catch(e){return [];}}
function alMark(A){try{const old=alSeen(),live=A.keys;lss('al_seen',JSON.stringify(old.filter(k=>live.includes(k)).concat(live.filter(k=>!old.includes(k)))));}catch(e){}}
function alerts(){
  const A={hw:[],ez:[],ab:[],due:[],rem:[]},wk=dmin(-6),act=S.students.filter(s=>!s.absent),ge={};
  act.forEach(s=>{if(allD(s).some(([d,r])=>d>=wk&&Object.values(r.ezberStatus||{}).some(v=>v!=='Baslamadi')))ge[kk2(s)]=1;});
  act.forEach(s=>{
    const hs=S.homeworks.filter(h=>!h.rb&&h.start<=today&&ap(h,s)).sort((a,b)=>a.end<b.end?1:-1);let n=0;
    for(const h of hs){const v=(s.hwStatus||{})[h.id];if(v==='Yapmadi'||v==='Eksik')n+=hwW(v);else break;}
    if(n>=3)A.hw.push([s,'art arda yapmadı/eksik ('+Math.ceil(n)+' ödev)']);
    let a=0;for(const [d,r] of allD(s).filter(([d,r])=>r.status&&r.status!=='None').reverse()){if(r.status==='Yok')a++;else break;}
    if(a>=3)A.ab.push([s,a+' gündür devamsız']);
    if(ezOf(s).length&&ge[kk2(s)]&&!allD(s).some(([d,r])=>d>=wk&&Object.values(r.ezberStatus||{}).includes('Tamamlandi')))A.ez.push([s,'bu hafta ezber vermedi']);
  });
  S.homeworks.filter(h=>!h.rb&&h.end>=dmin(-7)&&h.end<=dmin(2)&&h.end!==dmin(1)).forEach(h=>{const n=act.filter(s=>ap(h,s)&&!(s.hwStatus||{})[h.id]).length;
    if(n)A.due.push([h,n,h.end<today?'süresi geçti':h.end===today?'bugün bitiyor':h.end===dmin(1)?'yarın bitiyor':'2 gün sonra bitiyor']);});
  S.homeworks.filter(h=>!h.rb&&h.end===dmin(1)).forEach(h=>{A.rem.push([h,act.filter(s=>ap(h,s)&&!(s.hwStatus||{})[h.id]).length]);});
  A.n=A.hw.length+A.ez.length+A.ab.length+A.due.length+A.rem.length;
  A.keys=[].concat(A.hw.map(x=>'hw'+x[0].id+':'+x[1]),A.ab.map(x=>'ab'+x[0].id+':'+x[1]),A.ez.map(x=>'ez'+x[0].id+':'+wk),A.due.map(x=>'du'+x[0].id+':'+x[2]),A.rem.map(x=>'rm'+x[0].id+':'+today));
  const sn=alSeen();A.nNew=A.keys.filter(k=>!sn.includes(k)).length;return A;
}

    const pc=dates.map(d=>{let v=0,t=0,a=0;g.forEach(s=>{const r=((((s.periods||{})[dn]||{}).days||{})[d])||{};if(r.status==='Var'){v++;t++;}else if(r.status==='Yok'||r.status==='Izinli')t++;if(r.abdest)a++;});return {d:d,dev:t?Math.round(v*100/t):0,ab:Math.round(a*100/g.length)};});

    const net=g.map(s=>dd(s).reduce((t,[d,r])=>t+(r.points||0)+(r.bp||0),0));

    const names=[...new Set(g.flatMap(ezOf))];

     +'<div class="font-bold text-sm mt-3">Abdestli Oranı (%)</div>'+col('ab','#3b82f6')

     +'<div class="font-bold text-sm mt-3 mb-1">Ezber İlerlemesi (tamamlayan %)</div>'+(names.length?names.map(n=>{const a=g.filter(s=>ezOf(s).includes(n)),k=a.filter(s=>bestE(s,n)===2).length,p=a.length?Math.round(k*100/a.length):0;return bar(esc(n),p,'#10b981','%'+p+' ('+k+'/'+a.length+')');}).join(''):'<span class="text-xs text-slate-400 italic">Ezber atanmamış.</span>');

Object.assign(ACT,{
  gedit(a){
    const k=a.dataset.k,m=members(k,a.dataset.key);if(!m.length)return;
    const all=m.some(x=>x.sinif==='ALL'),cls=[...new Set(classes().concat(m.map(x=>x.sinif).filter(x=>x!=='ALL')))].sort((p,q)=>p.localeCompare(q,'tr',{numeric:true}));
    EM={k:k,key:a.dataset.key,all:all,cls:cls,set:Object.fromEntries(cls.map(x=>[x,all||m.some(y=>y.sinif===x)]))};
    $('emN').value=m[0].name;
    const sb0=m[0].sube||'ALL',subOpt='<label class="text-xs">Şube</label><select id="emSb" class="inp w-full mb-2"><option value="ALL">Tüm şubeler</option>'+subes('ALL').map(x=>'<option value="'+esc(x)+'"'+(sb0===x?' selected':'')+'>'+esc(x.toUpperCase())+' şubesi</option>').join('')+'</select>';
    $('emD').innerHTML=(k==='ezber'||k==='odev'?subOpt:'')+(k==='odev'?'<label class="text-xs">Teslim zamanı (mesajda görünür)</label><input id="emT" class="inp w-full mb-2" placeholder="Örn: Bir sonraki derste" value="'+esc(m[0].teslim||'')+'"><div class="flex gap-2 mb-2"><div class="flex-1"><label class="text-xs">Veriliş</label><input type="date" id="emS" class="inp w-full" value="'+esc(m[0].start)+'"></div><div class="flex-1"><label class="text-xs">Teslim</label><input type="date" id="emE" class="inp w-full" value="'+esc(m[0].end)+'"></div></div>':'');
    emRender();em.classList.remove('hidden');em.classList.add('flex');
  },
  emx(){em.classList.add('hidden');em.classList.remove('flex');},
  emsave(){
    const k=EM.k,old=members(k,EM.key),base=old[0],name=T($('emN').value);
    if(!base)return ACT.emx();
    if(!name||BAD.test(name))return alert('Ad boş olamaz ve . # $ / [ ] içeremez.');
    const target=EM.all?['ALL']:EM.cls.filter(x=>EM.set[x]);
    if(!target.length)return alert('En az bir sınıf seçin ya da "Tüm sınıflar"ı işaretleyin.');
    let st,en;if(k==='odev'){st=$('emS').value;en=$('emE').value;if(!st||!en||en<st)return alert('Başlangıç ve bitiş tarihini doğru seçin.');}
    const oldAll=old.some(x=>x.sinif==='ALL'),oldCls=old.map(x=>x.sinif),oldName=base.name,allId=(old.find(x=>x.sinif==='ALL')||{}).id;
    const sb=$('emSb')?$('emSb').value:'ALL',tz=$('emT')?T($('emT').value):'';
    const mk=cls=>k==='ders'?{name:name,sinif:cls}:k==='ezber'?{name:name,sinif:cls,sube:sb}:k==='odev'?{name:name,sinif:cls,sube:sb,start:st,end:en,teslim:tz}:{name:name,sinif:cls,sube:base.sube||'ALL',donem:base.donem||'1',rb:true};
    const copy=(fromId,toId,cls)=>{if(k==='ders'||k==='ezber'||!fromId)return;S.students.forEach(s=>{if((cls==='ALL'||T(s.sinif)===cls)&&s.hwStatus&&s.hwStatus[fromId]!==undefined)s.hwStatus[toId]=s.hwStatus[fromId];});};
    const used=new Set(),made=[];
    if(target[0]==='ALL'&&!oldAll){
      used.add(base);Object.assign(base,mk('ALL'));
      old.slice(1).forEach(o=>copy(o.id,base.id,o.sinif));
    }else target.forEach(cls=>{
      let it=old.find(x=>!used.has(x)&&x.sinif===cls)||old.find(x=>!used.has(x)&&x.sinif==='ALL');
      if(it){used.add(it);Object.assign(it,mk(cls));}
      else{it=mk(cls);if(k==='odev'||k==='reh'){it.id=uid('HW_');copy(allId,it.id,cls);}made.push(it);}
    });
    if(name!==oldName&&(k==='ders'||k==='ezber'))S.students.filter(s=>oldAll||oldCls.includes(T(s.sinif))).forEach(s=>Object.values(s.periods||{}).forEach(p=>Object.values(p.days||{}).forEach(d=>{
      const o=k==='ezber'?d.ezberStatus:d.scores;if(o&&o[oldName]!==undefined){o[name]=o[oldName];delete o[oldName];}})));
    dropItems(k,old.filter(x=>!used.has(x)));made.forEach(x=>addItem(k,x));
    ACT.emx();save();render(true);toast('Atama güncellendi');
  },
  gdel(a){const k=a.dataset.k,m=members(k,a.dataset.key);if(!m.length||!confirm('"'+m[0].name+'" tüm sınıflardan silinsin mi?'))return;del(()=>dropItems(k,m),'1 atama silindi');}
});

  const el=ezOf(s);z.ez=el.filter(n=>bestE(s,n)===2).length+'/'+el.length;
  const cn=l=>{let a=0,b=0,e=0;l.forEach(h=>{const x=(s.hwStatus||{})[h.id];if(x==='Yapti')a++;else if(x==='Yapmadi')b++;else if(x==='Eksik')e++;});return a+'/'+b+(e?' ('+e+' eksik)':'');};

const wkDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return Array.from({length:n},(_,i)=>addD(x.toISOString().slice(0,10),i));};
const mDays=d=>{const n=new Date(+d.slice(0,4),+d.slice(5,7),0).getDate();return Array.from({length:n},(_,i)=>d.slice(0,8)+String(i+1).padStart(2,'0'));};
function chData(kind,fill){
  const g=grp(),LB={Var:'V',Yok:'Y',Izinli:'İ'};
  const mk=(s,d)=>fill?(LB[recOn(s,d).status]||''):'';
  const pt=(s,d)=>{const p=fill?(recOn(s,d).points||0):0;return p?(p>0?'+':'')+p:'';};
  const dl=d=>GUN[new Date(d+'T12:00:00').getDay()];
  if(kind==='w'){
    const D=wkDays(G.date,5),head=[['No',''],['Ad Soyad','']],we=[false,false];
    D.forEach(d=>{const t=dl(d)+' '+d.slice(8)+'.'+d.slice(5,7);head.push([t,'Yoklama'],[t,'Puan']);we.push(false,false);});
    head.push(['Ezber',''],['Ödev',''],['Not','']);we.push(false,false,false);
    return {title:'Haftalık Çizelge · '+dLab()+' · '+fdt(D[0])+' – '+fdt(D[4]),head:head,we:we,rows:g.map(s=>[s.no,s.name].concat(D.flatMap(d=>[mk(s,d),pt(s,d)]),['','','']))};
  }
  const D=mDays(G.date),head=[['No',''],['Ad Soyad','']].concat(D.map(d=>[String(+d.slice(8)),dl(d)]),[['Var',''],['Yok',''],['İzn','']]);
  const we=[false,false].concat(D.map(d=>[0,6].includes(new Date(d+'T12:00:00').getDay())),[false,false,false]);
  return {title:'Aylık Çizelge · '+dLab()+' · '+AYN[+G.date.slice(5,7)-1]+' '+G.date.slice(0,4),head:head,we:we,rows:g.map(s=>{const ms=D.map(d=>mk(s,d)),c=x=>fill?ms.filter(m=>m===x).length:'';return [s.no,s.name].concat(ms,[c('V'),c('Y'),c('İ')]);})};
}

const loadImg=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i);};i.onerror=()=>no(new Error('Görsel açılamadı'));i.src=u;});
async function squareJpg(f,z,q){const i=await loadImg(f),c=document.createElement('canvas');c.width=c.height=z;const m=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,z,z);return c.toDataURL('image/jpeg',q);}

/* Fotoğraftan veli telefonu okuma (Tesseract.js, ilk kullanımda internetten yüklenir) */
const tessLoad=()=>window.Tesseract?Promise.resolve():new Promise((ok,no)=>{const e=document.createElement('script');e.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';e.onload=ok;e.onerror=()=>no(new Error('Metin okuma kütüphanesi yüklenemedi (internet?)'));document.head.appendChild(e);});
const fmtTel=n=>n.slice(0,4)+' '+n.slice(4,7)+' '+n.slice(7,9)+' '+n.slice(9);
function findPhones(text){
  let t=String(text);for(let k=0;k<2;k++)t=t.replace(/(\d)[Oo]/g,'$10').replace(/[Oo](\d)/g,'0$1').replace(/(\d)[lI|]/g,'$11').replace(/[lI|](\d)/g,'1$1');
  const out=[],seen={},re=/(?:\+?90[\s.\-]*)?0?[\s.\-]*\(?5\d{2}\)?[\s.\-]*\d{3}[\s.\-]*\d{2}[\s.\-]*\d{2}/g;
  t.split('\n').forEach(line=>{(line.match(re)||[]).forEach(m=>{let d=m.replace(/\D/g,'');if(d.startsWith('90')&&d.length>=12)d=d.slice(2);if(d.length===10)d='0'+d;if(d.length!==11||seen[d])return;seen[d]=1;out.push({n:d,line:line.replace(m,'').replace(/[\s|_]+/g,' ').trim().slice(0,40)});});});
  return out;
}

const YPX_AY=['ocak','subat','mart','nisan','mayis','haziran','temmuz','agustos','eylul','ekim','kasim','aralik'];
function ypxDate(txt,y1){
  if(!y1)return null;const t=hqN(txt).split(' ').filter(Boolean);

}

function akInit(){const cv=$('akCv');if(!cv)return;cv.onpointerdown=akTap;AK.last=performance.now();akDraw(cv,AK.last,.016);if(AK.raf)cancelAnimationFrame(AK.raf);AK.raf=requestAnimationFrame(akFrame);}
function akFrame(ts){const cv=$('akCv');if(!cv||S.page!=='akv'||!document.body.contains(cv)){AK.raf=0;AK.timer=null;akMicOff();return;}const dt=Math.min(.05,Math.max(0,(ts-AK.last)/1000));AK.last=ts;akDraw(cv,ts,dt);AK.raf=requestAnimationFrame(akFrame);}
const akRnd=(a,b)=>a+Math.random()*(b-a);
function akSpark(x,y,n){for(let i=0;i<(n||10);i++){const a=Math.random()*6.28,v=akRnd(40,120);AK.fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-30,life:.7,r:akRnd(2,4),col:'#fde68a',g:120});}}
function akRain(n){for(let i=0;i<(n||50);i++)AK.fx.push({x:Math.random()*(AK.w||400),y:-10-Math.random()*140,vx:akRnd(-10,10),vy:akRnd(80,170),life:7,r:akRnd(3,6),col:'#fbbf24',g:0});}
function akBeep(){try{const ac=new (window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();setTimeout(()=>{o.stop();ac.close();},450);}catch(e){}}
function akDraw(cv,ts,dt){
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth||600,h=cv.clientHeight||360;
  if(AK.w!==w||AK.h!==h||AK.dpr!==dpr){AK.w=w;AK.h=h;AK.dpr=dpr;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  AK.u=Math.max(.7,Math.min(1.5,Math.min(w,h)/480));
  const c=cv.getContext('2d'),n=AK.night,list=akList();c.setTransform(dpr,0,0,dpr,0,0);
  if(AK.scare>0)AK.scare=Math.max(0,AK.scare-dt);
  /* mikrofon */
  if(AK.mic){const m=AK.mic;m.an.getByteTimeDomainData(m.buf);let sum=0;for(let i=0;i<m.buf.length;i++){const v=(m.buf[i]-128)/128;sum+=v*v;}
    AK.lv=AK.lv*.85+Math.min(100,Math.sqrt(sum/m.buf.length)*320)*.15;
    if(AK.lv>AK.th){AK.loudT+=dt;if(AK.loudT>.4){if(AK.scare<=0)list.forEach(s=>{const f=AK.F[s.id];if(f)f.tt=0;});AK.scare=Math.max(AK.scare,3);}}else AK.loudT=0;
    if(ts-AK.mt>100){AK.mt=ts;const mt=$('akMeter');if(mt){mt.style.width=Math.round(AK.lv)+'%';mt.style.background=AK.lv>AK.th?'#f87171':'#34d399';}}}
  /* odak sayacı */
  if(AK.timer&&AK.timer.end-Date.now()<=0){AK.timer=null;akTb();akRain(70);akBeep();akDo(()=>akList().forEach(s=>akAdd(s,1)),'Odak süresi bitti: sınıfa +1 yem');}
  /* arka plan */
  const bg=c.createLinearGradient(0,0,0,h);bg.addColorStop(0,n?'#0b1b36':'#67d4f1');bg.addColorStop(.55,n?'#0a2a4d':'#1d8fd0');bg.addColorStop(1,n?'#06162b':'#0b4f8a');c.fillStyle=bg;c.fillRect(0,0,w,h);
  if(!n)for(let i=0;i<4;i++){const x=w*(.12+i*.25)+Math.sin(ts*.0003+i)*20;c.fillStyle='rgba(255,255,255,'+(.05+.03*Math.sin(ts*.0007+i)).toFixed(3)+')';c.beginPath();c.moveTo(x,0);c.lineTo(x+w*.1,0);c.lineTo(x-w*.12,h);c.lineTo(x-w*.22,h);c.closePath();c.fill();}
  const sy=h*.9,sg=c.createLinearGradient(0,sy,0,h);sg.addColorStop(0,n?'#8a7a55':'#f2d9a0');sg.addColorStop(1,n?'#5a4e35':'#d9b878');
  c.lineCap='round';
  for(let i=0;i<8;i++){const x=w*(i+.5)/8,hh=h*(.1+((i*37)%5)*.02);c.strokeStyle=n?'#14532d':'#16a34a';c.lineWidth=5*AK.u;c.beginPath();c.moveTo(x,sy+10);c.bezierCurveTo(x+Math.sin(ts*.001+i)*12,sy-hh*.4,x-Math.sin(ts*.0012+i)*12,sy-hh*.7,x+Math.sin(ts*.0009+i)*14,sy-hh);c.stroke();}
  c.fillStyle=sg;c.beginPath();c.moveTo(0,h);c.lineTo(0,sy+6);c.quadraticCurveTo(w*.25,sy-8,w*.5,sy+4);c.quadraticCurveTo(w*.75,sy+14,w,sy);c.lineTo(w,h);c.closePath();c.fill();
  while(AK.bub.length<22)AK.bub.push({x:Math.random()*w,y:Math.random()*h,r:akRnd(1.5,5),s:akRnd(12,38)});
  c.strokeStyle='rgba(255,255,255,.45)';c.lineWidth=1;AK.bub.forEach(b=>{b.y-=b.s*dt;b.x+=Math.sin(ts*.002+b.r)*.15;if(b.y<-6){b.y=h+6;b.x=Math.random()*w;}c.beginPath();c.arc(b.x,b.y,b.r,0,7);c.stroke();});
  /* şanslı balık */
  let cur=null;if(AK.lucky){const L=AK.lucky,e=ts-L.t0;if(e>L.spin+9000)AK.lucky=null;else cur=e<L.spin?L.ids[Math.floor(e/110)%L.ids.length]:L.win;}
  /* balıklar: hareket */
  list.forEach(s=>{
    let f=AK.F[s.id];if(!f)f=AK.F[s.id]={x:akRnd(40,w-40),y:akRnd(h*.15,h*.75),vx:0,vy:0,dir:1,tx:0,ty:0,tt:0,ph:Math.random()*6,pulse:0,k:akRnd(.8,1.2)};
    const L=akLen(s);f.tt-=dt;
    if(f.tt<=0){if(AK.scare>0){f.tx=f.x<w/2?L*.5:w-L*.5;f.ty=akRnd(h*.1,h*.8);f.tt=.8;}else{f.tx=akRnd(L*.6,Math.max(L*.6+1,w-L*.6));f.ty=akRnd(h*.12,h*.78);f.tt=akRnd(2.5,6.5);}}
    const dx=f.tx-f.x,dy=f.ty-f.y,d=Math.hypot(dx,dy)||1;if(d<12)f.tt=0;
    const sp=(AK.scare>0?240:42)*f.k*Math.sqrt(AK.u),k=Math.min(1,dt*2.2);
    f.vx+=(dx/d*sp-f.vx)*k;f.vy+=(dy/d*sp-f.vy)*k;
    f.x=Math.max(10,Math.min(w-10,f.x+f.vx*dt));f.y=Math.max(10,Math.min(sy-4,f.y+f.vy*dt+Math.sin(ts*.003+f.ph)*.15));
    if(f.vx>8)f.dir=1;else if(f.vx<-8)f.dir=-1;
    f.pulse=Math.max(0,f.pulse-dt*2.5);
  });
  /* balıklar: çizim (küçükten büyüğe) */
  const ord=list.slice().sort((a,b)=>akP(a)-akP(b));
  ord.forEach(s=>akFish(c,AK.F[s.id],s,ts,s.id===cur));
  /* ışık huzmesi */
  if(cur&&AK.F[cur]){const f=AK.F[cur],s=list.find(x=>x.id===cur);if(s){const L=akLen(s),g=c.createLinearGradient(0,0,0,f.y);g.addColorStop(0,'rgba(253,224,71,.0)');g.addColorStop(1,'rgba(253,224,71,.45)');c.fillStyle=g;c.beginPath();c.moveTo(f.x-8,0);c.lineTo(f.x+8,0);c.lineTo(f.x+L*.8,f.y+L*.3);c.lineTo(f.x-L*.8,f.y+L*.3);c.closePath();c.fill();}}
  /* etiketler */
  c.textAlign='center';c.textBaseline='alphabetic';
  ord.forEach(s=>{const f=AK.F[s.id],L=akLen(s),bh=[.34,.26,.5][akSp(s).sh]*L,fs=Math.round(11*AK.u+2),y=f.y+bh+fs+4;
    c.font='700 '+fs+'px Segoe UI,Arial,sans-serif';c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.55)';c.fillStyle=s.id===cur?'#fde047':'#fff';
    const nm=String(s.name).slice(0,16);c.strokeText(nm,f.x,y);c.fillText(nm,f.x,y);
    c.font='700 '+Math.round(fs*.85)+'px Segoe UI,Arial,sans-serif';c.fillStyle='#fcd34d';const pt='★ '+akP(s);c.strokeText(pt,f.x,y+fs);c.fillText(pt,f.x,y+fs);});
  /* parçacıklar */
  AK.fx=AK.fx.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.life-=dt;return p.life>0&&p.y<h;});
  AK.fx.forEach(p=>{c.globalAlpha=Math.min(1,p.life*1.5);c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();});c.globalAlpha=1;
  /* üst bilgiler */

   +'<div class="card"><b>🖥️ Bu cihaz akıllı tahta ise</b><p class="text-sm text-slate-500 my-2">Bir kez ayarlayın: cihaz kod bekleme ekranına geçer, çıkış için PIN ister. Sonraki derslerde yalnızca kod oluşturmanız yeterli.</p><div class="flex flex-wrap gap-2"><button data-act="bdstandby" class="btn bg-indigo-600 !text-base !py-3">🔒 Kodlu bekleme ekranına al</button><button data-act="bdstart" class="btn bg-slate-600 !text-base !py-3">Süresiz öğrenci ekranı ('+g.length+')</button></div></div>'
   +'<div class="card"><b>📊 Bugün tahtadan</b><div class="text-sm mt-1">Verilen +: <b>'+p+'</b> · Öğrencinin işaretlediği ödev: <b>'+h+'</b></div>'+(ch.length?'<div class="text-xs text-slate-500 mt-1">'+ch.join(' · ')+'</div>':'')+'<p class="text-xs text-slate-500 mt-2">Bu + puanlar Ders takibindeki puanlara eklenir. Öğrencinin işaretlediği ödevleri Ödev sayfasından kontrol edebilirsiniz.</p></div>';

reg('tahta','🧑‍🎓','Tahta Modu',()=>{
  G.date=bdNow();G.q='';

Object.assign(ACT,{
  async bdcode(){
    if(!S.room)return alert('Önce oda kodunu girin.');if(!grp().length)return alert('Bu seçimde öğrenci yok.');
    const c=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000),h=await sha(c);
    try{await auth();await bdSessRef().set({h:h,sn:G.sinif,sb:G.sube,cap:bdCap(),ol:firebase.database.ServerValue.TIMESTAMP,dk:bdDk()});await db.ref('kioskKod/'+S.room).set({[c]:bdSrv()+(bdDk()+30)*6e4});}catch(e){return alert('Kod oluşturulamadı: '+e.message);}
    lss('tahta_kod',c+'|'+h);
  },
  bdplus(){const r=bdSessRef();if(!r)return;r.child('dk').transaction(x=>(x||40)+10);const rm=S.room;db.ref('kioskKod/'+rm).once('value').then(x=>{const v=x.val()||{};Object.keys(v).forEach(k=>db.ref('kioskKod/'+rm+'/'+k).set(v[k]+6e5));}).catch(()=>{});},
  bdlock(){const r=bdSessRef();if(!r||!confirm('Tahta şimdi kilitlensin mi? Yeniden açmak için yeni kod gerekir.'))return;r.parent.child('tahtaKilit').set(firebase.database.ServerValue.TIMESTAMP);r.remove();db.ref('kioskKod/'+S.room).remove().catch(()=>{});toast('Kilit komutu gönderildi');},
  async bdstandby(){if(!await bdPin())return;if(!confirm('Bu cihazdaki hesaptan çıkış yapılıp tahta kod bekleme ekranına alınacak. Devam edilsin mi?'))return;lss('kiosk_v1','2');lss('kiosk_h','');lss('kiosk_end','0');document.body.classList.add('kiosk');if(ref){ref.off();ref=null;}try{await firebase.auth().signOut();await firebase.auth().signInAnonymously();}catch(e){}_auth=null;bdWR='';last={};lastRoom='';KEYS.forEach(k=>{S[k]=[];});BD.v='grid';render(true);try{await document.documentElement.requestFullscreen();}catch(e){}},
  async bdenter(){
    const m=t=>{const e=$('sbMsg');if(e)e.textContent=t;},c=(($('sbIn')||{}).value||'').trim(),r=bdSessRef();
    if(Date.now()<sbU)return m('Çok fazla deneme, biraz bekleyin.');if(!r)return m('Oda bağlı değil.');
    if(!/^\d{6}$/.test(c))return m('Kod 6 haneli olmalı.');
    let v=null;try{await auth();await db.ref('kioskUid/'+S.room+'/'+firebase.auth().currentUser.uid).set({k:c});v=(await r.once('value')).val();}catch(e){sbF++;if(sbF>=5){sbU=Date.now()+30000;sbF=0;}return m('Kod yanlış, süresi dolmuş ya da bağlantı yok.');}
    if(!v||v.h!==await sha(c)){sbF++;if(sbF>=5){sbU=Date.now()+30000;sbF=0;}return m('Kod yanlış.');}
    const now=bdSrv(),dk=v.dk||40;
    if(v.bas?v.bas+dk*6e4<=now:(v.ol||now)+30*6e4<now)return m('Kodun süresi dolmuş.');
    if(!v.bas)r.child('bas').set(firebase.database.ServerValue.TIMESTAMP);
    const end=(v.bas||now)+dk*6e4;sbF=0;
    bdWR='';bdWatch();lastRoom='';listen(S.room);
    G.sinif=v.sn||'ALL';G.sube=v.sb||'ALL';lss('tahta_cap',String(v.cap||2));lss('kiosk_h',v.h);lss('kiosk_end',String(Date.now()+end-now));lss('kiosk_st',String(now));lss('kiosk_v1','1');
    BD.v='grid';BD.t=Date.now();render(true);try{await document.documentElement.requestFullscreen();}catch(e){}
  },
  async bdstart(){
    if(!grp().length)return alert('Bu seçimde öğrenci yok.');
    if(!lsg('pin_v1')){const a=prompt('Tahtadan çıkış için 4-6 haneli bir PIN belirleyin:');if(a===null)return;if(!/^\d{4,6}$/.test(a))return alert('PIN 4-6 rakam olmalı.');lss('pin_v1',await sha(a));}
    lss('kiosk_v1','1');lss('kiosk_h','');lss('kiosk_end','0');lss('kiosk_st',String(bdSrv()));document.body.classList.add('kiosk');BD.v='grid';BD.t=Date.now();render(true);
    try{await document.documentElement.requestFullscreen();}catch(e){}
  },
  bdpick(a){const s=bdSt(a.dataset.id);if(!s)return;if(sozPas(s))return toast('Bugün yoklamada yok görünüyor',1);BD.v='stu';BD.id=s.id;BD.t=Date.now();render(true);},
  bdback(){BD.v='grid';render(true);},
  bdfeed(a){const s=bdSt(a.dataset.id);if(!s||BD.v!=='stu'||BD.id!==s.id)return;BD.t=Date.now();bdPlus(s,'yem');render(true);},
  bdhw(a){const s=bdSt(a.dataset.id),h=a.dataset.h;if(!s||!h||BD.v!=='stu'||BD.id!==s.id)return;BD.t=Date.now();s.hwStatus=s.hwStatus||{};s.hwSelf=s.hwSelf||{};
    if(s.hwSelf[h]&&s.hwStatus[h]==='Yapti'){delete s.hwStatus[h];delete s.hwSelf[h];}
    else if(!s.hwStatus[h]){s.hwStatus[h]='Yapti';s.hwSelf[h]=bdNow();}
    save();render(true);},
  bdsoz(){const g=grp().filter(s=>!sozPas(s));if(!g.length)return toast('Uygun öğrenci yok',1);
    let r=Math.max(1,...g.map(s=>s.sozT||0)),e=g.filter(s=>(s.sozT||0)!==r);if(!e.length){r++;e=g;}
    const s=e[Math.floor(Math.random()*e.length)];s.sozT=r;s.soz=(s.soz||0)+1;BD.v='soz';BD.sid=s.id;BD.given=false;BD.t=Date.now();save();render(true);},
  bdok(){const s=bdSt(BD.sid);if(!s||BD.given)return;BD.given=true;bdPlus(s,'soz');render(true);},
  bdfs(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(e){}},
  bdexit(){if(!lsg('pin_v1'))return bxExit();bx.classList.remove('hidden');bx.classList.add('flex');$('bxIn').value='';$('bxMsg').textContent='';setTimeout(()=>$('bxIn').focus(),50);}
});

Object.assign(ACT,{
  ypfv(){YP.fav=!YP.fav;render(true);},
  ypfav(a){const x=ypBy(a);if(!x)return;x.fav=!x.fav;save();render(true);},
  ypok(a){const x=ypBy(a);if(!x)return;x.ok=!x.ok;save();render(true);},
  ypdel(a){const id=a.dataset.id;del(()=>{S.yplan=S.yplan.filter(y=>y.id!==id);},'Plan satırı silindi');},
  ypevx(a){const id=a.dataset.id;del(()=>{S.yplan=S.yplan.filter(y=>y.id!==id);},'Etkinlik silindi');},
  ypev(){const d=$('ypED').value,n=T($('ypEN').value);if(!d||!n)return alert('Tarih ve etkinlik adı girin.');S.yplan.push({t:'e',tarih:d,konu:n});save();render(true);},
  ypadd(){
    const sn=$('ypS').value,ders=T($('ypD').value),b=$('ypB').value,rows=$('ypT').value.split('\n').map(l=>l.split(/\t|;|\|/).map(T)).filter(c=>c.some(Boolean));

/* ========== BUGÜN PANOSU: ders programı, derse kalan süre, bu haftanın konusu ========== */

const bgMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};
const bgT=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t||'');return m?+m[1]*60+ +m[2]:-1;};
const bgFmt=n=>String(Math.floor(n/60)%24).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
const bgToday=()=>S.prog.filter(x=>+x.gun===new Date().getDay()).sort((a,b)=>bgT(a.bas)-bgT(b.bas));

function bgNow(){
  const l=bgToday(),m=bgMin(),cur=l.find(x=>bgT(x.bas)<=m&&m<bgT(x.bit)),nx=l.find(x=>bgT(x.bas)>m);
  if(cur){const a=bgT(cur.bas),b=bgT(cur.bit);return '<div class="font-bold text-lg">▶ Şu an: '+bgLab(cur)+'</div><div class="text-sm">Dersin bitmesine <b>'+(b-m)+' dk</b> kaldı ('+cur.bit+')</div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded mt-2"><div class="h-2 bg-indigo-600 rounded" style="width:'+Math.round((m-a)/(b-a)*100)+'%"></div></div>';}
  if(nx)return '<div class="font-bold text-lg">⏭ Sıradaki: '+bgLab(nx)+'</div><div class="text-sm">'+nx.bas+' · <b>'+(bgT(nx.bas)-m)+' dk</b> sonra</div>';
  return l.length?'<div class="font-bold">✅ Bugünkü dersler bitti</div>':'<div class="text-sm text-slate-500">Bugün için ders programı girilmemiş.</div>';
}
const bgPlan=x=>S.yplan.filter(y=>y.t!=='e'&&ypNow(y)&&(y.sinif==='ALL'||y.sinif===x.sinif)&&(!y.ders||!x.ders||String(x.ders).toLowerCase().includes(String(y.ders).toLowerCase())||String(y.ders).toLowerCase().includes(String(x.ders).toLowerCase())));

   +(ev.length?'<div class="card"><b>🗓️ Yaklaşan etkinlikler</b>'+ev.slice(0,5).map(x=>'<div class="text-sm mt-1"><b>'+fdt(x.tarih)+'</b> · '+esc(x.konu)+'</div>').join('')+'</div>':'')

{const hk=P.home.html;P.home.html=()=>kyBar()+hk();}

/* ========== DERS PROGRAMI FOTOĞRAFI / BELGESİ (bu cihazda saklanır) ========== */
const pdKey=()=>'prog_doc_'+activeId();
const pdGet=()=>{try{return JSON.parse(lsg(pdKey())||'null');}catch(e){return null;}};
const pdBlob=d=>{const a=d.data.split(','),bin=atob(a[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:d.type});};
/* Belge odaya ayrı bir yola (belge/oda/profil) yazılır; oda verisini ağırlaştırmaz. Diğer cihaz yalnızca küçük "meta" bilgisini okur, belge değişmişse bir kez indirir. */
const pdCK=()=>'belge/'+S.room+'/'+encodeURIComponent(T(prof().name)||'_').replace(/\./g,'%2E');
let pdChecked=false;
async function pdUp(d){
  if(!S.room)throw new Error('room');
  if(d.data.length>1300000)throw new Error('big');
  await auth();const ts=Date.now();
  await db.ref(pdCK()).set({meta:{name:d.name,type:d.type,ts:ts},data:d.data});
  d.ts=ts;d.cloud=true;localStorage.setItem(pdKey(),JSON.stringify(d));
}
async function pdSync(force){
  if(!S.room||(pdChecked&&!force))return;pdChecked=true;
  try{
    await auth();const ref=db.ref(pdCK()),m=(await ref.child('meta').once('value')).val(),d=pdGet();
    if(!m){if(d&&d.cloud){localStorage.removeItem(pdKey());render(true);}return;}
    if(d&&d.ts===m.ts)return;
    const x=(await ref.child('data').once('value')).val();if(!x)return;
    localStorage.setItem(pdKey(),JSON.stringify({name:m.name,type:m.type,data:x,ts:m.ts,cloud:true}));render(true);
  }catch(e){}
}

   +(d?'<div class="text-xs mb-1 '+(d.cloud?'text-emerald-600':'text-amber-600')+'">'+(d.cloud?'☁️ Odayla eşitli':'📱 Yalnızca bu cihazda')+'</div><details class="my-2"><summary class="cursor-pointer text-sm font-semibold">📄 '+esc(d.name)+' · göster</summary>'+(img?'<img src="'+esc(d.data)+'" alt="Ders programı" class="max-w-full rounded border mt-2" data-act="pdopen">':'<p class="text-xs text-slate-500 mt-2">Belge önizlenemez, Aç düğmesini kullanın.</p>')+'</details>':'')
   +'<div class="flex flex-wrap gap-2"><button data-act="pdadd" class="btn bg-slate-600">'+(d?'🔄 Değiştir':'➕ Fotoğraf / belge ekle')+'</button>'+(d?'<button data-act="pdopen" class="btn bg-indigo-600">Aç</button><button data-act="pddel" class="px-3 py-2 rounded-lg border text-sm text-red-600">🗑️ Kaldır</button>':'')+(d&&!d.cloud&&S.room?'<button data-act="pdup" class="btn bg-emerald-600">☁️ Odaya yükle</button>':'')+(S.room?'<button data-act="pdsync" class="px-3 py-2 rounded-lg border text-sm">🔄 Eşitle</button>':'')+'</div></div>';
}
const pdIn=document.createElement('input');pdIn.type='file';pdIn.accept='image/*,application/pdf,.doc,.docx,.xls,.xlsx';pdIn.hidden=true;document.body.appendChild(pdIn);
pdIn.addEventListener('change',async()=>{

  }catch(err){alert('Eklenemedi: '+(err.message||err));}
});

const YB={list:null,busy:false};
const ybRef=()=>db.ref('yedek/'+S.room),ybMeta=()=>db.ref('yedekm/'+S.room);
async function ybList(){

async function ybSave(key){

async function ybPrune(){
  const v=(await ybMeta().once('value')).val()||{},ks=Object.keys(v).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort().reverse();

  try{
    await auth();const r=db.ref('users/'+u.uid+'/room'),v=(await r.once('value')).val();
    let room=(typeof v==='string'&&v)?v:'';
    if(room&&!await claim(room,u))room='';
    if(!room&&S.room&&confirm('Bu cihazda daha önce kullanılmış bir sınıf odası kayıtlı.\n\nBu oda ve içindeki öğrenci verileri SİZE mi ait?\n\nTamam: oda bu hesaba bağlanır.\nİptal: size ait yeni boş bir alan oluşturulur.')){
      if(await claim(S.room,u))room=S.room;else alert('Bu oda başka bir hesaba bağlı. Size ait yeni bir alan oluşturulacak.');
    }
    if(!room){room=genCode();if(!await claim(room,u))throw new Error('Oda oluşturulamadı');toast('Size ait yeni sınıf alanı oluşturuldu');}
    if(room!==v)await r.set(room);
    TCH.cloudRoom=room;
    if(room!==S.room){S.room=room;lss('sync_room_code',room);TCH.changed=true;}
  }catch(e){console.warn('Hesap-oda eşlemesi:',e);tWarn();}
}
function tRoomSave(c){
  const u=firebase.auth().currentUser;if(!c||!tOK(u)||c===TCH.cloudRoom)return;
  auth().then(()=>db.ref('users/'+u.uid+'/room').set(c)).then(()=>{TCH.cloudRoom=c;}).catch(e=>{console.warn('Hesap-oda eşlemesi:',e);tWarn();});
}
const _listen=listen;listen=function(c){_listen(c);tRoomSave(c);};
async function gDone(){
  _auth=null;gl.style.display='none';$('gP').value='';
  TCH.changed=false;await tRoomLoad();
  if(!TCH.started){TCH.started=true;if(TCH.start)TCH.start();}
  else if(TCH.changed&&S.room){lastRoom='';listen(S.room);}
}
async function gAccept(u,isNew){
  const em=String(u.email||'').toLowerCase();
  if(IZINLI.length&&!IZINLI.includes(em)){await firebase.auth().signOut();return gMsg('Bu hesabın bu uygulamaya erişim izni yok.');}
  if(IZINLI.length&&!u.emailVerified){if(!isNew){try{await u.sendEmailVerification();}catch(e){}}await firebase.auth().signOut();return gMsg('E-postanıza doğrulama bağlantısı gönderildi. Doğruladıktan sonra tekrar giriş yapın.');}
  gDone();
}
const gRun=async f=>{gMsg('');try{await f();}catch(e){gMsg(tErr(e));}};
$('gIn').onclick=()=>gRun(async()=>{const e=T($('gE').value),p=$('gP').value;if(!e||!p)return gMsg('E-posta ve şifreyi yazın.');const c=await firebase.auth().signInWithEmailAndPassword(e,p);await gAccept(c.user,false);});
$('gP').addEventListener('keydown',ev=>{if(ev.key==='Enter')$('gIn').click();});
$('gGo').onclick=()=>gRun(async()=>{const c=await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());await gAccept(c.user,false);});
$('gNew').onclick=()=>gRun(async()=>{const e=T($('gE').value),p=$('gP').value;if(!e||!p)return gMsg('E-posta yazın ve en az 6 karakterli bir şifre belirleyin.');if(p.length<6)return gMsg('Şifre en az 6 karakter olmalı.');const c=await firebase.auth().createUserWithEmailAndPassword(e,p);try{await c.user.sendEmailVerification();}catch(x){}await gAccept(c.user,true);});
$('gRs').onclick=()=>gRun(async()=>{const e=T($('gE').value);if(!e)return gMsg('Önce e-posta adresinizi yazın.');await firebase.auth().sendPasswordResetEmail(e);gMsg('Şifre sıfırlama bağlantısı e-postanıza gönderildi.');});
if(!KAYIT_ACIK)$('gNew').style.display='none';
function gateStart(fn){
  TCH.start=fn;
  if(kioskOn()){TCH.started=true;fn();return;} /* tahta cihazı giriş istemez */
  const off=firebase.auth().onAuthStateChanged(u=>{off();if(tOK(u))gDone();else gOpen();});
}
function gateEnforce(){if(kioskOn()||tOK(firebase.auth().currentUser))return;gOpen();}
function accCard(){const u=firebase.auth().currentUser;if(!u||u.isAnonymous)return '';return '<div class="card"><b>👤 Hesap</b><p class="text-xs text-slate-500 my-1">'+esc(u.email||u.displayName||'Öğretmen')+' olarak giriş yapıldı.</p><button data-act="tchout" class="btn bg-red-600">Çıkış yap</button></div>';}
Object.assign(ACT,{async tchout(){if(!confirm('Hesaptan çıkış yapılsın mı?'))return;try{localStorage.removeItem('sync_room_code');}catch(e){}try{await firebase.auth().signOut();}catch(e){}location.reload();}});

const PK=new URLSearchParams(location.search).get('k');
if(PK)parentView(PK);else gateStart(()=>{go(kioskOn()?'tahta':'home');if(kioskOn()){if(lsg('kiosk_v1')==='1'&&S.room)listen(S.room);}else if(S.room)listen(S.room);else room();});
</script>

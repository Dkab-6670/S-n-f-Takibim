<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sınıf Takip</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4338ca">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<style type="text/tailwindcss">
 .card{@apply bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 mb-3}
 .inp{@apply border border-slate-300 dark:border-slate-600 rounded-lg px-2 py-2 text-base bg-white dark:bg-slate-900 outline-none}
 .btn{@apply text-white text-sm font-semibold px-4 py-2 rounded-lg}
 #bn [data-nav]{@apply flex-1 flex flex-col items-center justify-center text-[11px] text-slate-500 min-h-[56px] border-0 bg-transparent}
 #bn [data-nav].on{@apply text-indigo-700 font-bold bg-indigo-50 dark:bg-slate-700 dark:text-indigo-300}
 #tn [data-nav]{@apply px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700}
 #tn [data-nav]:hover{@apply bg-indigo-50 dark:bg-slate-700}
 #tn [data-nav].on{@apply bg-indigo-600 text-white border-indigo-600}
</style>
<style>#akWrap:fullscreen{display:flex;flex-direction:column;background:#0b1d33}#akWrap:fullscreen canvas{flex:1;height:auto!important;min-height:0}#akWrap:-webkit-full-screen{display:flex;flex-direction:column;background:#0b1d33}#akWrap:-webkit-full-screen canvas{flex:1;height:auto!important;min-height:0}</style>
<style>body.kiosk>header,body.kiosk #tn,body.kiosk #bn,body.kiosk #ptitle,body.kiosk #up,body.kiosk #undo{display:none!important}body.kiosk{padding-bottom:0!important}body.kiosk main{max-width:none}</style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen pb-20 md:pb-6">
<header class="bg-indigo-700 text-white shadow">
 <div class="max-w-6xl mx-auto px-3 py-2 flex flex-wrap items-center justify-between gap-2" style="padding-top:max(.5rem,env(safe-area-inset-top))">
  <b>🕌 Sınıf Takip</b>
  <div class="flex items-center gap-2 text-xs bg-indigo-800 rounded-lg px-2 py-1 relative">
   <span id="dot" class="w-2.5 h-2.5 rounded-full bg-red-500"></span><span id="stx">Çevrimdışı</span>
   <button id="rc" class="font-mono font-bold text-yellow-300" title="Dokunun: 5 sn göster">-----</button>
   <button id="mnB" class="md:hidden px-1.5 text-lg font-bold leading-none" title="Menü" aria-label="Menü">⋮</button><div id="mn" class="hidden md:flex flex-col md:flex-row items-stretch md:items-center gap-1 md:gap-2 absolute md:static right-0 top-full mt-2 md:mt-0 z-50 min-w-[12rem] md:min-w-0 p-2 md:p-0 rounded-xl md:rounded-none shadow-lg md:shadow-none bg-indigo-800"><button id="pf" class="md:max-w-[8rem] truncate font-semibold text-left py-1.5 md:py-0" title="Profilim">👤 Profil</button><button id="rcB" title="Oda kodunu değiştir" class="text-left py-1.5 md:py-0"><span>🔑</span><span class="md:hidden"> Oda kodunu değiştir</span></button><button data-go="ayar" title="Ayarlar" class="hidden md:inline">⚙️</button><button id="th" class="text-left py-1.5 md:py-0">🌙</button></div>
  </div>
 </div>
</header>
<nav id="tn" class="hidden md:flex flex-wrap max-w-6xl mx-auto mt-3 px-3 gap-2"></nav>
<main class="max-w-6xl mx-auto px-3 py-3">
 <div id="ptitle" class="sticky z-30 card font-bold text-lg flex flex-wrap items-center gap-x-3 gap-y-1" style="top:env(safe-area-inset-top,0px)"></div>
 <div id="view"></div>
</main>
<nav id="bn" class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white dark:bg-slate-800 border-t border-slate-300 dark:border-slate-700 flex" style="padding-bottom:env(safe-area-inset-bottom)"></nav>
<div id="toast" class="fixed right-3 bottom-24 md:bottom-4 z-50 text-white text-sm font-semibold px-4 py-2 rounded-full shadow-lg opacity-0 transition-opacity pointer-events-none"></div>
<div id="undo" class="fixed left-3 bottom-24 md:bottom-4 z-50 hidden items-center gap-3 bg-slate-800 text-white text-sm px-4 py-2 rounded-xl shadow-lg"><span id="undoMsg"></span><button id="undoBtn" class="bg-amber-400 text-slate-900 font-bold rounded-lg px-3 py-1">Geri Al</button></div>
<button id="up" class="fixed right-3 bottom-36 md:bottom-16 z-40 hidden w-11 h-11 rounded-full bg-indigo-700 text-white text-xl shadow-lg" title="Yukarı çık">↑</button>
<div id="off" class="fixed top-0 left-1/2 -translate-x-1/2 z-50 hidden text-white text-sm font-bold px-4 py-1 rounded-b-xl shadow-lg"></div>

<script>
/* ========== 1. AYARLAR ve YARDIMCILAR ========== */
const firebaseConfig = {
  apiKey: "AIzaSyBCYKK_JSTrLzLI2MfeZV3-p0OpgPpgN6I",
  authDomain: "sinif-takibim.firebaseapp.com",
  databaseURL: "https://sinif-takibim-default-rtdb.firebaseio.com",
  projectId: "sinif-takibim"
};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=s=>String(s??'').trim(), num=v=>parseInt(v)||0;
const lsg=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, lss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const _d=new Date(), today=new Date(_d-_d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const isO=v=>v!==null&&typeof v==='object';

/* ========== 2. DURUM ve VERİ BİÇİMİ ========== */
const KEYS=['students','lessons','ezberItems','homeworks','msgs','plans'], PRE={students:'ST_',lessons:'L_',ezberItems:'E_',homeworks:'HW_',msgs:'M_',plans:'PL_'};
const S={students:[],lessons:[],ezberItems:[],homeworks:[],msgs:[],plans:[],room:lsg('sync_room_code')||'',page:'home',F:{sinif:'ALL',sube:'ALL',q:''},G:{sinif:'ALL',sube:'ALL',donem:'1',date:today}};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function prepare(l,p){let m=l.reduce((a,x)=>Math.max(a,typeof x._o==='number'?x._o:-1),-1);l.forEach(x=>{if(!x.id)x.id=uid(p);if(typeof x._o!=='number')x._o=++m;});}
function toList(v,p){
  let a=Array.isArray(v)?v.filter(x=>x!=null):isO(v)?Object.entries(v).map(([k,x])=>{if(isO(x)&&!x.id)x.id=k;return x;}):[];
  a=a.map(x=>typeof x==='string'?{name:x,sinif:'ALL'}:x);prepare(a,p);return a.sort((x,y)=>x._o-y._o);
}
const toMap=l=>Object.fromEntries(l.map(x=>[x.id,x]));
const snap=()=>JSON.parse(JSON.stringify(Object.fromEntries(KEYS.map(k=>[k,toMap(S[k])]))));
const dump=()=>JSON.stringify(Object.fromEntries(KEYS.map(k=>[k,S[k]])));
const apply=o=>KEYS.forEach(k=>{S[k]=Array.isArray(o[k])?o[k]:[];});
function diff(u,p,o,n){
  if(n==null){if(o!=null)u[p]=null;return;}
  if(isO(n)&&isO(o)){new Set([...Object.keys(o),...Object.keys(n)]).forEach(k=>diff(u,p+'/'+k,o[k],n[k]));return;}
  if(JSON.stringify(o)!==JSON.stringify(n))u[p]=n;
}
const dayRec=(s,p,d)=>{s.periods=s.periods||{};const x=s.periods[p]=s.periods[p]||{hafiz:false,kuranDurum:'kuran',days:{}};x.days=x.days||{};
  const r=x.days[d]=x.days[d]||{};return r;};
const classes=()=>[...new Set(S.students.map(s=>T(s.sinif)))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'tr',{numeric:true}));
const subes=c=>[...new Set(S.students.filter(s=>c==='ALL'||T(s.sinif)===c).map(s=>T(s.sube).toLowerCase()))].filter(Boolean).sort();
const sorted=l=>l.slice().sort((a,b)=>num(a.sinif)-num(b.sinif)||String(a.sube).localeCompare(String(b.sube))||num(a.no)-num(b.no)||String(a.name).localeCompare(String(b.name),'tr'));

/* ========== 3. FIREBASE: giriş, dinleme, kayıt ========== */
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
let _auth=null,ref=null,last={},lastRoom='',online=true,queued=0,t2;
const auth=()=>_auth||(_auth=new Promise((ok,no)=>{const a=firebase.auth(),u=a.onAuthStateChanged(x=>{u();x?ok():a.signInAnonymously().then(ok,e=>{_auth=null;alert('Giriş hatası: '+e.message+'\nFirebase > Authentication > Anonymous açık mı?');no(e);});});}));
const genCode=()=>{const al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='SNF-';crypto.getRandomValues(new Uint32Array(16)).forEach(n=>{s+=al[n%al.length]});return s;};
const mask=c=>c.length>6?c.slice(0,4)+'•'.repeat(c.length-4):c;
function status(c,t){$('dot').className='w-2.5 h-2.5 rounded-full bg-'+c+'-500';$('stx').textContent=t;}
let tt;function toast(m,err){const t=$('toast');t.textContent=m;t.className=t.className.replace(/ bg-\S+/g,'')+(err?' bg-red-600':' bg-emerald-600')+' opacity-100';clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('opacity-100'),err?5000:1800);}
function listen(code){
  S.room=code;lss('sync_room_code',code);$('rc').textContent=mask(code);status('amber','Yükleniyor...');
  if(ref){ref.off();ref=null;}
  auth().then(()=>{
    ref=db.ref('rooms/'+code);
    ref.on('value',sn=>{
      const d=sn.val();
      if(d){KEYS.forEach(k=>{S[k]=toList(d[k],PRE[k]);});last=snap();lastRoom=code;if(KEYS.some(k=>Array.isArray(d[k])))sn.ref.update(last);}
      status('emerald','Canlı');render();
    },err=>{status('red','Bağlantı hatası');alert('Firebase hatası: '+err.message);});
  }).catch(()=>status('red','Giriş hatası'));
}
function save(){
  if(!S.room)return;
  KEYS.forEach(k=>prepare(S[k],PRE[k]));
  const now=snap(),u={},root='rooms/'+S.room;
  diff(u,root,lastRoom===S.room?last:{},now);u[root+'/lastUpdated']=firebase.database.ServerValue.TIMESTAMP;
  last=now;lastRoom=S.room;
  if(!online){queued++;offBar();}
  toast('Kaydediliyor…');
  auth().then(()=>db.ref().update(u)).then(()=>toast('Kaydedildi ✓')).catch(e=>toast('Kaydedilemedi: '+e.message,true));
}
function offBar(){const b=$('off');b.className=b.className.replace(/ bg-\S+/g,'')+' bg-red-600 block';b.classList.remove('hidden');b.textContent='📴 Çevrimdışı'+(queued?' · '+queued+' değişiklik bekliyor':'');}
firebase.database().ref('.info/connected').on('value',s=>{
  const was=online;online=!!s.val();clearTimeout(t2);
  if(!online){t2=setTimeout(()=>{if(!online)offBar();},3000);return;}
  const b=$('off');
  if(!was&&queued){b.className=b.className.replace(/ bg-\S+/g,'')+' bg-emerald-600 block';b.textContent='✅ '+queued+' değişiklik gönderildi';queued=0;setTimeout(()=>{if(online)b.classList.add('hidden');},2500);}
  else b.classList.add('hidden');
});
addEventListener('beforeunload',e=>{if(!online&&queued){e.preventDefault();e.returnValue='';}});

/* Geri al */
let U=null,ut;
function del(fn,msg){U=dump();fn();save();$('undoMsg').textContent=msg;$('undo').classList.remove('hidden');$('undo').classList.add('flex');clearTimeout(ut);ut=setTimeout(()=>{$('undo').classList.add('hidden');U=null;},10000);render(true);}
$('undoBtn').onclick=()=>{if(!U)return;apply(JSON.parse(U));U=null;$('undo').classList.add('hidden');save();render(true);};

/* ========== 4. SAYFA KAYIT SİSTEMİ (sıra önemli değil) ========== */
const P={},NAV=[];
function reg(id,icon,title,html,after,nav){P[id]={icon,title,html,after};if(nav)NAV.push([id,icon,nav]);drawNav();}
function drawNav(){
  const b=NAV.filter(n=>pageOn(n[0])).map(n=>'<button data-nav="'+n[0]+'" data-go="'+n[0]+'"><span class="text-xl">'+n[1]+'</span>'+esc(n[2])+'</button>').join('');
  $('bn').innerHTML=b;
  $('tn').innerHTML=NAV.filter(n=>pageOn(n[0])).map(n=>'<button data-nav="'+n[0]+'" data-go="'+n[0]+'">'+n[1]+' '+esc(n[2])+'</button>').join('');
}
let pending=false;
const typing=()=>{const a=document.activeElement;return a&&$('view').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);};
function render(force){
  if(!force&&typing()){pending=true;return;}
  if(!force&&S.page==='akv'&&akSoft())return;
  if(!pageOn(S.page))S.page='home';const p=P[S.page]||P.home;
  $('ptitle').innerHTML=(S.page!=='home'?'<button data-go="home" class="btn bg-indigo-600 !px-3 !py-1 whitespace-nowrap">🏠 Ana Sayfa</button>':'')+'<span>'+p.icon+' '+esc(p.title)+'</span>'+(S.page!=='home'?'<span class="ml-auto text-xs font-semibold bg-indigo-100 text-indigo-800 dark:bg-indigo-900 dark:text-indigo-200 rounded-full px-3 py-1 whitespace-nowrap">📌 '+(S.G.sinif==='ALL'?'Tüm sınıflar':esc(S.G.sinif)+(S.G.sube==='ALL'?'. sınıf':'/'+esc(S.G.sube.toUpperCase())))+'</span>':'');document.title=p.title+' | Sınıf Takip';
  $('view').innerHTML=p.html();if(p.after)p.after();
  document.documentElement.style.setProperty('--th',($('ptitle').offsetHeight+8)+'px');
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===S.page));
}
function go(id){S.page=P[id]?id:'home';render(true);scrollTo({top:0});}
$('view').addEventListener('focusout',()=>{if(pending){pending=false;setTimeout(render,0);}});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return;}
  const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act])ACT[a.dataset.act](a);
});
const ACT={};

/* ========== 5. SAYFA: ANA SAYFA ========== */
/* Düzen: Bugün kartı (bildirimler) > sınıf seçimi > büyük günlük kısayollar > sakin diğer sayfalar > özet satırı */
const HQ=['yok','ders','ezber'];
const HGRP=[['📅 Günlük işler',['dav','reh']],['🏫 Sınıf',['ogr','akv','tahta','oturma','soz','haf']],['📊 Rapor ve çıktı',['stat','uyari','donem','karne']],['🧰 Diğer',['ayar']]];
ACT.hcls=a=>{G.sinif=a.dataset.s;G.sube=a.dataset.b;G.date=today;G.q='';gsave();render(true);};
const todayCard=()=>{
  const it=[alertItem(),remItem(),bkItem(),bdayItem()].filter(Boolean);
  if(!it.length)return '';
  const tone={a:'border-amber-400',y:'border-yellow-400',p:'border-pink-400'};
  return '<div class="card"><div class="font-bold text-sm">📌 Bugün</div>'+it.map(x=>{
    const c='flex items-center gap-2 w-full text-left text-sm py-2 pl-2 pr-2 border-l-4 '+tone[x[3]]+' mt-1.5 bg-slate-50 dark:bg-slate-900 rounded-r-lg';
    const inner='<span>'+x[1]+'</span><span class="flex-1">'+x[2]+'</span>';
    return x[0]?'<button data-go="'+x[0]+'" class="'+c+'">'+inner+'<span class="text-slate-400">›</span></button>':'<div class="'+c+'">'+inner+'</div>';
  }).join('')+'</div>';
};
const classChips=A=>{
  const cs=[...new Set(A.map(s=>T(s.sinif)+'|'+(T(s.sube).toLowerCase()||'ALL')))].filter(k=>k.split('|')[0]).sort((a,b)=>a.localeCompare(b,'tr',{numeric:true}));
  if(!cs.length)return '';
  const chip=(sn,sb,t,on)=>'<button data-act="hcls" data-s="'+esc(sn)+'" data-b="'+esc(sb)+'" class="shrink-0 px-3 py-1.5 rounded-full border text-sm font-semibold '+(on?'bg-indigo-600 text-white border-indigo-600':'bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-600')+'">'+t+'</button>';
  return '<div class="font-bold text-sm mb-1">🏫 Sınıf</div><div class="flex gap-2 overflow-x-auto pb-2 mb-1">'+chip('ALL','ALL','Tümü',G.sinif==='ALL'&&G.sube==='ALL')
    +cs.map(k=>{const c=k.split('|');return chip(c[0],c[1],esc(c[0])+(c[1]!=='ALL'?'/'+esc(c[1].toUpperCase()):''),G.sinif===c[0]&&G.sube===c[1]);}).join('')+'</div>';
};
reg('home','🏠','Ana Sayfa',()=>{
  const A=S.students.filter(s=>!s.absent);
  const q=HQ.filter(k=>P[k]&&pageOn(k));
  const quick=q.length?'<div class="grid gap-3 mb-4" style="grid-template-columns:repeat('+q.length+',minmax(0,1fr))">'+q.map(k=>'<button data-go="'+k+'" class="card mb-0 py-5 flex flex-col items-center justify-center gap-1 text-center !bg-indigo-50 dark:!bg-slate-700 !border-indigo-200 dark:!border-slate-600"><span class="text-4xl">'+P[k].icon+'</span><b class="text-sm">'+esc(P[k].title)+'</b></button>').join('')+'</div>':'';
  const more=HGRP.map(g=>{const ks=g[1].filter(k=>P[k]&&pageOn(k));return ks.length?'<div class="text-xs font-semibold text-slate-500 mt-3 mb-1">'+g[0]+'</div><div class="grid grid-cols-3 md:grid-cols-6 gap-2">'+ks.map(k=>'<button data-go="'+k+'" class="rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 py-2 px-1 text-center text-xs font-medium"><div class="text-xl">'+P[k].icon+'</div>'+esc(P[k].title)+'</button>').join('')+'</div>':'';}).join('');
  const sm=[A.length+' öğrenci',classes().length+' sınıf'].concat(featOn('ders')?[S.lessons.length+' ders']:[],featOn('ezber')?[S.ezberItems.length+' ezber konusu']:[]).join(' · ');
  return todayCard()
   +(A.length?classChips(A):'<button data-go="ogr" class="card w-full text-left font-semibold">👥 Henüz öğrenci yok. Dokunup öğrenci ekleyin.</button>')
   +quick+more+'<div class="text-xs text-slate-400 text-center mt-5">'+sm+'</div>';
},null,'Ana Sayfa');

/* ========== 6. SAYFA: ÖĞRENCİLER ========== */
const okSube=v=>T(v).toLowerCase()||'a';
const filt=()=>sorted(S.students.filter(s=>{const f=S.F,q=f.q.toLowerCase();
  return (f.sinif==='ALL'||T(s.sinif)===f.sinif)&&(f.sube==='ALL'||T(s.sube).toLowerCase()===f.sube)&&(!q||String(s.name).toLowerCase().includes(q)||String(s.no).toLowerCase().includes(q));}));
function drawList(){
  const l=filt();$('ogrCnt').textContent=(S.F.sinif==='ALL'?'Tüm sınıflar':S.F.sinif+(S.F.sube==='ALL'?'. sınıf':'/'+S.F.sube.toUpperCase()))+': '+l.length+' öğrenci'+(l.length!==S.students.length?' (toplam '+S.students.length+')':'');
  $('ogrList').innerHTML=l.length?l.map((s,i)=>'<div class="card mb-2 flex flex-wrap items-center justify-between gap-2'+(s.absent?' opacity-60':'')+'"><div><b>'+(i+1)+'. '+av(s,24)+esc(s.name)+'</b><div class="text-xs text-slate-500">No: '+esc(s.no)+' · '+esc(s.sinif)+'/'+esc(String(s.sube).toUpperCase())+(s.absent?' · 🚫 sürekli devamsız':'')+'</div></div><div class="flex gap-2"><button data-act="edit" data-id="'+esc(s.id)+'" class="px-2 py-1 rounded border">✏️</button><button data-act="abs" data-id="'+esc(s.id)+'" class="px-2 py-1 rounded border text-xs">'+(s.absent?'Aktif yap':'Devamsız yap')+'</button><button data-act="del" data-id="'+esc(s.id)+'" class="px-2 py-1 rounded border text-red-600">🗑️</button></div></div>').join(''):'<div class="card text-center text-sm text-slate-400">Öğrenci yok.</div>';
}
reg('ogr','👥','Öğrenciler',()=>{
  const F=S.F,opt=(a,v)=>a.map(x=>'<option value="'+esc(x[0])+'"'+(x[0]===v?' selected':'')+'>'+esc(x[1])+'</option>').join('');
  return '<div class="card"><b class="text-sm">Öğrenci ekle</b><div class="grid grid-cols-2 md:grid-cols-5 gap-2 mt-2"><input id="ns" class="inp" placeholder="Sınıf (7)"><input id="nb" class="inp" placeholder="Şube (d)"><input id="nn" class="inp" placeholder="Okul no"><input id="na" class="inp col-span-2" placeholder="Adı soyadı"></div><button data-act="add" class="btn bg-indigo-600 mt-2">➕ Ekle</button>'
   +'<details class="mt-3" data-keep="bOpen"'+(S.bOpen?' open':'')+'><summary class="text-xs cursor-pointer text-slate-500">Toplu ekle (S.No ⇥ Okul No ⇥ Sınıf ⇥ Şube ⇥ Ad Soyad)</summary><textarea id="nbulk" rows="5" class="inp w-full mt-2 text-xs font-mono"></textarea><button data-act="bulk" class="btn bg-slate-600 mt-2">Listeyi ekle</button></details></div>'

const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'-';
const KCSS='.k{font-family:Segoe UI,Arial,sans-serif;color:#111;background:#fff;max-width:720px;margin:0 auto;padding:18px;border:1px solid #cbd5e1;border-radius:10px;page-break-after:always}.k h2{margin:0 0 4px;font-size:19px;color:#3730a3}.k h3{margin:12px 0 3px;font-size:13px;color:#3730a3;border-bottom:1px solid #c7d2fe}.k table{width:100%;border-collapse:collapse;font-size:12.5px}.k td{padding:3px 5px;border-bottom:1px solid #e2e8f0}.k td:last-child{text-align:right;font-weight:600}.k .l{height:50px;border:1px dashed #94a3b8;border-radius:6px}.k .g{text-align:right;margin-top:14px;font-size:12px}@media print{.k{border:0;border-radius:0}}';
function karne(s){
  const dn=G.donem,pr=(s.periods||{})[dn]||{},days=Object.entries(pr.days||{}).sort((a,b)=>a[0]<b[0]?-1:1);
  let v=0,y=0,iz=0,ab=0,p=0,m=0,bp=0,bm=0,bk=0,sl=0;const sc={},ez={},RK={Baslamadi:0,DevamEdiyor:1,Tamamlandi:2},nt=[];
  days.forEach(([d,r])=>{
    if(r.status==='Var')v++;else if(r.status==='Yok')y++;else if(r.status==='Izinli')iz++;
    if(r.abdest)ab++;const a=r.points||0;if(a>0)p+=a;else m+=a;const b=r.bp||0;if(b>0)bp+=b;else bm+=b;
    if(r.book==='Yok')bk++;if(r.slept)sl++;
    Object.entries(r.scores||{}).forEach(([k,x])=>{if(+x)(sc[k]=sc[k]||[]).push(+x);});
    Object.entries(r.ezberStatus||{}).forEach(([k,x])=>{if(RK[x]>(ez[k]===undefined?-1:ez[k]))ez[k]=RK[x];});
    if(r.bn)nt.push([d,r.bn,b]);
  });
  if(!featOn('davranis'))nt.length=0;const cz=pr.kuranDurum==='cuz',row=(a,b)=>'<tr><td>'+a+'</td><td>'+b+'</td></tr>';
  const ds=lsOf(s).map(l=>cz&&KUR.test(l.name)?row(esc(l.name),'Cüzde, puanlanmaz'):row(esc(l.name),sc[l.name]?avg(sc[l.name])+' / 5 ('+sc[l.name].length+' puan)':'puan yok')).join('');

/* Yeni profiller sade başlar: az kullanılan özellikler kapalı, profilden açılır. Mevcut profiller değişmez. */
const DEF_OFF=['oturma','soz','hafiz'];
function defaultOn(){const o=allOn();DEF_OFF.forEach(k=>{o[k]=false;});return o;}
function loadPS(){
  try{const o=JSON.parse(lsg('profiles_v2')||'null');if(o&&Array.isArray(o.list))return o;}catch(e){}
  let old=null;try{old=JSON.parse(lsg('profile_v1')||'null');}catch(e){}
  const nm=T((old&&old.name)||lsg('teacher_name')||'');
  return nm?{list:[{id:'p1',name:nm,brans:T((old&&old.brans)||''),okul:T((old&&old.okul)||''),emoji:'👤',features:allOn()}],active:'p1'}:{list:[],active:''};
}
function activeP(){return (PS&&(PS.list.find(p=>p.id===PS.active)||PS.list[0]))||{id:'',name:'',brans:'',okul:'',emoji:'👤',features:null};}
function activeId(){return activeP().id||'p0';}
function featOn(f){const p=activeP();return !p.features||p.features[f]!==false;}
function pageOn(id){const f=PF&&PF[id];if(id==='haf'&&!featOn('ezber'))return false;return !f||featOn(f);}
function prof(){return activeP();}
const tname=()=>T(prof().name||'');
const savePS=()=>lss('profiles_v2',JSON.stringify(PS));
const sessGet=k=>{try{return sessionStorage.getItem(k);}catch(e){return null;}},sessSet=(k,v)=>{try{sessionStorage.setItem(k,v);}catch(e){}};
PS=loadPS();

/* Profil penceresi: seçici ve düzenleme */
const pfm=document.createElement('div');pfm.className='fixed inset-0 z-[200] hidden bg-slate-900/85 overflow-y-auto p-4';
pfm.innerHTML='<div id="pfb" class="max-w-xl mx-auto"></div>';document.body.appendChild(pfm);
const EMO=['👤','👨‍🏫','👩‍🏫','📖','🕌','🌙','⭐','🌿','🎓','✏️','🧮','🔬'];
const BRN=['Din Kültürü ve Ahlak Bilgisi',"Kur'an-ı Kerim",'Tecvid','Siyer','Fıkıh','İtikad','Hadis','Din Kültürü','Matematik','Türkçe','Fen Bilimleri','Sosyal Bilgiler','İngilizce','Rehberlik'];
const PRE2={oner:defaultOn,all:allOn,temel:()=>({yoklama:true,ders:true,davranis:true,karne:true,rapor:true,ezber:false,hafiz:false,reh:false,oturma:false,soz:false}),sade:()=>({yoklama:true,ders:true,karne:true,ezber:false,hafiz:false,davranis:false,reh:false,oturma:false,soz:false,rapor:false})};
const defFor=b=>{const o=defaultOn();if(T(b)&&!/kur|ezber|tecvid|hafız|hafiz|din|siyer|fıkıh|akaid|itikad|hadis/i.test(b))o.ezber=false;return o;};
let PE=null,PV='pick';
function pfShow(v,id){
  PV=v;
  if(v==='edit'){const p=id?PS.list.find(x=>x.id===id):null;
    PE=p?{id:p.id,emoji:p.emoji||'👤',name:p.name,brans:p.brans||'',okul:p.okul||'',features:Object.assign(allOn(),p.features||{}),touched:true}:{id:'',emoji:'👤',name:'',brans:'',okul:'',features:defaultOn(),touched:false};}
  pfm.classList.remove('hidden');pfDraw();
}
function pfCap(){if(!PE||PV!=='edit')return;const n=$('pfN'),b=$('pfB'),o=$('pfO');if(n&&typeof n.value==='string')PE.name=n.value;if(b&&typeof b.value==='string')PE.brans=b.value;if(o&&typeof o.value==='string')PE.okul=o.value;}
const pfFeat=()=>FEAT.map(f=>'<label class="flex items-start gap-2 border border-slate-200 dark:border-slate-600 rounded-lg p-2 mb-1.5 cursor-pointer"><input type="checkbox" data-ft="'+f[0]+'"'+(PE.features[f[0]]!==false?' checked':'')+' class="mt-1 w-4 h-4"><span class="text-xl">'+f[1]+'</span><span><b class="text-sm">'+esc(f[2])+'</b><span class="block text-xs text-slate-500">'+esc(f[3])+'</span></span></label>').join('');
function pfDraw(){
  pfCap();
  const w='bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-2xl p-5';let h;
  if(PV==='pick'){
    h='<div class="'+w+'"><div class="text-center mb-4"><div class="text-4xl">🕌</div><b class="text-xl">Sınıf Takip</b><div class="text-sm text-slate-500">Kim kullanıyor?</div></div><div class="grid grid-cols-2 gap-3">'
     +PS.list.map(p=>'<div class="relative border-2 rounded-xl p-4 text-center cursor-pointer '+(p.id===PS.active?'border-indigo-500 bg-indigo-50 dark:bg-slate-700':'border-slate-200 dark:border-slate-600')+'" data-act="pfpick" data-id="'+esc(p.id)+'"><div class="text-4xl">'+esc(p.emoji||'👤')+'</div><div class="font-bold truncate">'+esc(p.name)+'</div><div class="text-xs text-slate-500 truncate">'+esc(p.brans||'')+'</div><button data-act="pfedit" data-id="'+esc(p.id)+'" class="absolute top-1 right-1 text-sm px-1.5" title="Düzenle">✏️</button></div>').join('')
     +'<div class="border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-xl p-4 text-center cursor-pointer flex flex-col justify-center" data-act="pfnew"><div class="text-3xl">➕</div><div class="font-semibold text-sm">Yeni profil</div></div></div>'
     +(PS.list.length?'<button data-act="pfx" class="mt-4 w-full py-2 border rounded-lg">Kapat</button>':'')+'</div>';
  }else{
    h='<div class="'+w+'"><b class="text-lg">'+(PE.id?'✏️ Profili Düzenle':'👋 Hoş geldiniz! Profilinizi oluşturalım')+'</b><div class="mt-3 flex flex-wrap gap-2">'
     +EMO.map(e=>'<button data-act="pfemo" data-v="'+e+'" class="text-2xl w-11 h-11 rounded-lg border '+(PE.emoji===e?'border-indigo-500 bg-indigo-50 dark:bg-slate-700':'border-slate-200 dark:border-slate-600')+'">'+e+'</button>').join('')+'</div>'
     +'<label class="text-xs block mt-3">Ad Soyad</label><input id="pfN" class="inp w-full mb-2" placeholder="Örn: Ayşe Yılmaz" value="'+esc(PE.name)+'">'
     +'<label class="text-xs block">Branş / ders (isteğe bağlı)</label><input id="pfB" list="pfBl" class="inp w-full mb-2" value="'+esc(PE.brans)+'"><datalist id="pfBl">'+BRN.map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist>'
     +'<label class="text-xs block">Okul (isteğe bağlı, karne başlığında görünür)</label><input id="pfO" class="inp w-full mb-3" value="'+esc(PE.okul)+'">'
     +'<div class="font-bold text-sm mb-1">Hangi özellikleri kullanmak istiyorsunuz?</div><div class="flex flex-wrap gap-2 mb-2">'
     +[['oner','Önerilen'],['all','Hepsi'],['temel','Temel ders takibi'],['sade','Sadece yoklama ve ders']].map(x=>'<button data-act="pfpre" data-v="'+x[0]+'" class="px-3 py-1.5 rounded-full border text-xs font-semibold">'+x[1]+'</button>').join('')+'</div><div id="pfF">'+pfFeat()+'</div>'
     +'<p class="text-[11px] text-slate-500 mt-1">Seçimi istediğiniz zaman profil düğmesinden değiştirebilirsiniz. Kapattığınız özellikler sadece sizin ekranınızdan gizlenir, öğrenci verisi silinmez ve diğer öğretmenler etkilenmez.</p>'
     +'<div class="flex gap-2 mt-3"><button data-act="pfsave" class="btn bg-indigo-600 flex-1">Kaydet</button>'+(PS.list.length?'<button data-act="pfback" class="px-4 py-2 rounded-lg border">Geri</button>':'')+'</div>'
     +(PE.id&&PS.list.length>1?'<button data-act="pfdel" class="mt-3 text-xs text-red-600 underline">Bu profili sil</button>':'')+'</div>';
  }
  $('pfb').innerHTML=h;
}
pfm.addEventListener('change',e=>{const f=e.target.dataset&&e.target.dataset.ft;if(f&&PE){PE.features[f]=e.target.checked;PE.touched=true;}});
pfm.addEventListener('input',e=>{if(e.target.id==='pfB'&&PE&&!PE.touched){PE.features=defFor(e.target.value);const fb=$('pfF');if(fb)fb.innerHTML=pfFeat();}});
function applyProfile(){
  let o={};try{o=JSON.parse(lsg('gs_'+activeId())||'null')||JSON.parse(lsg('gs_v1')||'null')||{};}catch(e){}
  G.sinif=o.sinif||'ALL';G.sube=o.sube||'ALL';G.donem=o.donem||'1';
  const p=activeP(),b=$('pf');if(b)b.textContent=(p.emoji||'👤')+' '+(tname()||'Profil');
  drawNav();if(!pageOn(S.page))S.page='home';render(true);
}
const pfClose=()=>pfm.classList.add('hidden');
Object.assign(ACT,{
  prof(){pfShow('edit',activeId()==='p0'?'':activeId());},
  pfpick(a){PS.active=a.dataset.id;savePS();sessSet('who_ok','1');pfClose();applyProfile();},
  pfedit(a){pfShow('edit',a.dataset.id);},
  pfnew(){pfShow('edit','');},
  pfback(){pfShow('pick');},
  pfx(){pfClose();},
  pfemo(a){pfCap();PE.emoji=a.dataset.v;pfDraw();},
  pfpre(a){pfCap();PE.features=PRE2[a.dataset.v]();PE.touched=true;const fb=$('pfF');if(fb)fb.innerHTML=pfFeat();},
  pfsave(){
    pfCap();const n=T(PE.name);if(!n)return alert('Lütfen adınızı yazın.');
    const p={id:PE.id||('p'+Date.now().toString(36)),name:n,brans:T(PE.brans),okul:T(PE.okul),emoji:PE.emoji||'👤',features:PE.features};
    const i=PS.list.findIndex(x=>x.id===p.id);if(i>=0)PS.list[i]=p;else PS.list.push(p);
    PS.active=p.id;savePS();sessSet('who_ok','1');pfClose();applyProfile();toast('Profil kaydedildi');
    if(!S.room)openRoom();
  },
  pfdel(){
    if(PS.list.length<2||!PE.id||!confirm('Bu profil silinsin mi? (Öğrenci verisi silinmez.)'))return;
    PS.list=PS.list.filter(x=>x.id!==PE.id);if(PS.active===PE.id)PS.active=PS.list[0].id;savePS();applyProfile();pfShow('pick');
  }
});
$('pf').onclick=()=>pfShow('pick');

/* Giriş: oda bağlantısı penceresi */
const rmm=document.createElement('div');rmm.className='fixed inset-0 z-[150] hidden bg-slate-900/80 overflow-y-auto p-4';
rmm.innerHTML='<div class="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-2xl max-w-md mx-auto mt-6 p-5"><div id="rmb"></div></div>';document.body.appendChild(rmm);
function openRoom(){
  $('rmb').innerHTML='<b class="text-lg">🔑 Sınıf Odasına Bağlan</b><p class="text-xs text-slate-500 my-2">Öğrenci verileri bir "oda"da saklanır. Başka öğretmenlerle aynı sınıfları kullanacaksanız onlarla aynı oda kodunu girin. Kodu bilmiyorsanız oda sahibinden isteyin.</p><input id="rmC" class="inp w-full mb-2 font-mono uppercase" placeholder="SNF-..."><button data-act="rmjoin" class="btn bg-indigo-600 w-full">Bağlan</button><div class="text-center text-xs text-slate-400 my-3">veya</div><button data-act="rmnew" class="w-full py-2 border rounded-lg font-semibold">✨ Yeni oda oluştur</button><p class="text-[11px] text-slate-500 mt-1">Yeni oda oluşturunca ekrandaki mevcut veriler yeni odaya kopyalanır.</p>'+(S.room?'<button data-act="rmx" class="mt-3 w-full py-2 text-sm">Kapat</button>':'');
  rmm.classList.remove('hidden');
}
Object.assign(ACT,{
  rmjoin(){const c=T($('rmC').value).toUpperCase();if(!c)return alert('Oda kodunu yazın.');lastRoom='';listen(c);rmm.classList.add('hidden');},
  rmnew(){const n=genCode();lastRoom='';S.room=n;listen(n);save();$('rmb').innerHTML='<b class="text-lg">✅ Yeni oda oluşturuldu</b><p class="text-sm my-2">Oda kodunuz:</p><div class="font-mono font-bold text-lg break-all bg-slate-100 dark:bg-slate-700 rounded-lg p-3">'+esc(n)+'</div><p class="text-xs text-slate-500 my-2">Bir yere yazın. Diğer cihazlarda ve diğer öğretmenlerde 🔑 düğmesiyle bu kodu girin.</p><button data-act="rmx" class="btn bg-indigo-600 w-full">Tamam</button>';},
  rmx(){rmm.classList.add('hidden');}
});

/* İstatistikler'de kapalı özelliklerin gizlenmesi */
const featCount=()=>FEAT.filter(f=>featOn(f[0])).length;
const stF=P.stat.html;
P.stat.html=()=>{
  let h=stF();
  const cut=t=>{h=h.replace(new RegExp('<div class="card mb-0"><div class="font-bold mb-2">[^<]*'+t+'[^<]*<span[\\s\\S]*?</div></div>','g'),'');};
  const sum=t=>{h=h.replace(new RegExp('<div class="card mb-0 text-center"><div class="text-2xl[^"]*">[^<]*</div><div class="text-xs text-slate-500">'+t+'</div></div>','g'),'');};
  if(!featOn('ezber')){['Ezber Tamamlayan','Abdestli Gün','Hafız Öğrenciler','Cüzde Olan'].forEach(cut);['Tamamlanan Ezber','Hafız'].forEach(sum);}
  if(!featOn('davranis'))cut('Davranış Puanı');
  if(!featOn('reh'))cut('Rehberlik');
  if(!featOn('ders')){['Kitabı Olmayanlar','Derste Uyuyanlar','Ödevi'].forEach(cut);}
  return h;
};

/* ========== AŞAMA D: AYARLAR, ANA SAYFA, MESAJLAR, ÇİZELGELER, GEÇMİŞ ========== */
const addD=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);};
const recOn=(s,d)=>{for(const p of Object.values(s.periods||{})){const r=(p.days||{})[d];if(r)return r;}return {};};
const AYN=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const GUN=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
S.cf=false;S.hl=30;S.hlFor='';

/* Karne imzası: branşa göre */
function bransTitle(){const b=T(prof().brans||'');if(!b)return 'Ders Öğretmeni';return /öğretmen/i.test(b)?b:b+' Öğretmeni';}
function sigHtml(){return '<div style="display:inline-block;text-align:center;min-width:220px"><div style="height:34px"></div><div style="border-top:1px solid #64748b;padding-top:3px"><b>'+esc(tname())+'</b><br>'+esc(bransTitle())+'</div></div>';}

/* Teslim zamanı ve duyuru metni */
const hwText=items=>{
  const h=items[0],cls=[...new Set(items.map(x=>x.sinif==='ALL'?'Tüm sınıflar':x.sinif+(x.sube&&x.sube!=='ALL'?'/'+String(x.sube).toUpperCase():'. sınıf')))].join(', ');
  const tz=h.teslim&&h.teslim!=='Belirli bir tarihte'?h.teslim:'';
  return '📚 ÖDEV DUYURUSU\n\nÖdev: '+h.name+'\nSınıf: '+cls+'\nTeslim: '+(tz||fdt(h.end)+' tarihinde')+(tz&&h.end?'\nSon tarih: '+fdt(h.end):'')+'\n\nÖğrencilerimizin ödevini zamanında hazırlamasını rica ederim.'+(tname()?'\n\n'+tname()+' · '+bransTitle():'');
};
const hm=document.createElement('div');hm.className='fixed inset-0 z-[160] hidden items-center justify-center bg-black/60 p-4';
hm.innerHTML=`<div class="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-2xl max-w-md w-full max-h-[90vh] overflow-y-auto p-5"><b class="text-lg">📤 Ödev mesajı</b><p class="text-xs text-slate-500 my-2">Metni düzenleyebilirsiniz. WhatsApp açılınca göndereceğiniz kişiyi ya da grubu siz seçersiniz.</p><textarea id="hmT" rows="10" class="inp w-full text-sm"></textarea><div class="flex flex-wrap gap-2 mt-3"><button data-act="hmwa" class="btn bg-green-600">💬 WhatsApp</button><button data-act="hmcp" class="btn bg-slate-600">📋 Kopyala</button><button data-act="hmdoc" class="btn bg-slate-600">📎 Belgeyle paylaş</button><button data-act="hmx" class="px-4 py-2 rounded-lg border">Kapat</button></div></div>`;
document.body.appendChild(hm);
const hwMsgOpen=items=>{if(!items||!items.length)return;$('hmT').value=hwText(items);hm.classList.remove('hidden');hm.classList.add('flex');};
Object.assign(ACT,{
  hwmsg(a){hwMsgOpen(members('odev',a.dataset.key));},
  hmwa(){open('https://wa.me/?text='+encodeURIComponent($('hmT').value),'_blank');},
  hmcp(){navigator.clipboard.writeText($('hmT').value).then(()=>toast('Metin kopyalandı'));},
  hmx(){hm.classList.add('hidden');hm.classList.remove('flex');}
});
$('view').addEventListener('change',e=>{
  const d=e.target.dataset;if(!d.ts)return;
  const t=TS[d.ts],v=e.target.value;
  if(d.tf==='sube'){t.sube=v;return;}
  if(d.tf==='teslim'){const x=v===''?null:TESL[+v];if(!x){t.teslim='';render(true);return;}t.teslim=x[0];if(x[1]){t.start=t.start||today;t.end=addD(t.start,x[1]);}render(true);}
});

/* Yoklamada Yok olanların velilerine mesaj */
const wm=document.createElement('div');wm.className='fixed inset-0 z-[140] hidden bg-black/60 overflow-y-auto p-3';
wm.innerHTML=`<div class="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-2xl max-w-xl mx-auto p-4"><div class="flex justify-between items-start gap-2"><b class="text-lg">💬 Yok olanların velilerine mesaj</b><button data-act="wmx" class="text-xl px-2">✕</button></div><div id="wmB"></div></div>`;
document.body.appendChild(wm);
let WM={sel:{},sent:{},tpl:0,text:''};
const nTel=v=>{let d=String(v||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='90'+d.slice(1);else if(d.length===10)d='90'+d;return d;};
const wmList=()=>grp().filter(s=>rd(s).status==='Yok');
const wmFill=(t,s)=>{let x=String(t).split('{ad}').join(s.name);if(G.date!==today)x=x.replace(/bugün/gi,fdt(G.date)+' tarihinde');return x;};
function wmDraw(){
  const l=wmList(),m=msgs(),sk=s=>s.id+'|'+G.date;
  if(!l.length){$('wmB').innerHTML='<p class="text-sm text-slate-500 my-4">'+fdt(G.date)+' tarihinde bu seçimde "Yok" işaretli öğrenci yok.</p>';return;}
  const rem=l.filter(s=>WM.sel[s.id]&&!WM.sent[sk(s)]).length;
  const rows=l.map(s=>{const ok=!!nTel(s.tel);return '<div class="border border-slate-200 dark:border-slate-700 rounded-lg p-2 mb-2'+(WM.sent[sk(s)]?' bg-emerald-50 dark:bg-emerald-950':'')+'"><div class="flex items-center gap-2"><input type="checkbox" data-wms="'+esc(s.id)+'" class="w-5 h-5"'+(WM.sel[s.id]?' checked':'')+'><div class="flex-1 min-w-0"><div class="font-semibold text-sm truncate">'+esc(s.name)+'</div><div class="text-[11px] text-slate-500">'+esc(s.sinif)+'/'+esc(String(s.sube).toUpperCase())+' · No '+esc(s.no)+'</div></div><button data-act="wmgo" data-id="'+esc(s.id)+'" class="btn bg-green-600">'+(WM.sent[sk(s)]?'✓ Tekrar':'💬 Gönder')+'</button><button data-act="wmdoc" data-id="'+esc(s.id)+'" class="btn bg-slate-600" title="Belgeyle paylaş">📎</button></div><input data-wmt="'+esc(s.id)+'" type="tel" class="inp w-full mt-2 text-sm'+(ok?'':' !border-red-400')+'" placeholder="Veli telefonu (05xx...)" value="'+esc(s.tel||'')+'"></div>';}).join('');
  $('wmB').innerHTML='<p class="text-xs text-slate-500 my-2">'+fdt(G.date)+' tarihinde Yok olan '+l.length+' öğrenci. Mesaj her veli için ayrı WhatsApp penceresinde açılır, Gönder düğmesine siz basarsınız.</p><select id="wmTpl" class="inp w-full mb-2">'+m.map((t,i)=>'<option value="'+i+'"'+(i===WM.tpl?' selected':'')+'>'+esc(t[0])+'</option>').join('')+'</select><textarea id="wmT" rows="3" class="inp w-full text-sm">'+esc(WM.text)+'</textarea><div class="text-[11px] text-slate-500 mb-2">{ad} yerine öğrencinin adı yazılır. Telefonu olmayan veliler kırmızı çerçevelidir, buraya yazabilirsiniz.</div><div class="flex flex-wrap gap-2 mb-3"><button data-act="wmall" class="px-3 py-2 rounded-lg border text-sm">Hepsini seç / kaldır</button><button data-act="wmnext" class="btn bg-green-600">▶ Sıradaki seçiliyi aç ('+rem+' kaldı)</button></div>'+rows;
}
const wmSend=s=>{
  const p=nTel(s.tel);if(!p){alert(s.name+' için veli telefonu yok.');return false;}
  open('https://wa.me/'+p+'?text='+encodeURIComponent(wmFill(WM.text,s)),'_blank');
  WM.sent[s.id+'|'+G.date]=true;wmDraw();return true;
};
Object.assign(ACT,{
  wmopen(){const l=wmList();WM.sel={};l.forEach(s=>{WM.sel[s.id]=true;});const m=msgs(),i=m.findIndex(x=>/gelmedi/i.test(x[0]));WM.tpl=i<0?0:i;WM.text=m[WM.tpl][1];wm.classList.remove('hidden');wmDraw();},
  wmx(){wm.classList.add('hidden');},
  wmgo(a){const s=find(a);if(s)wmSend(s);},
  wmall(){const l=wmList(),all=l.every(s=>WM.sel[s.id]);l.forEach(s=>{WM.sel[s.id]=!all;});wmDraw();},
  wmnext(){const s=wmList().find(x=>WM.sel[x.id]&&!WM.sent[x.id+'|'+G.date]&&nTel(x.tel));if(!s)return toast('Sırada telefonlu, gönderilmemiş seçili öğrenci yok');wmSend(s);}
});
wm.addEventListener('change',e=>{

/* Depolama gerekmez: fotoğraf küçültülüp öğrenci kaydında tutulur, OCR tarayıcıda çalışır, belge paylaşım menüsüyle gider. */
const av=(s,z)=>s.photo?'<img src="'+esc(s.photo)+'" alt="" class="rounded-full object-cover inline-block align-middle mr-1" style="width:'+z+'px;height:'+z+'px">':'';
const loadImg=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i);};i.onerror=()=>no(new Error('Görsel açılamadı'));i.src=u;});
async function squareJpg(f,z,q){const i=await loadImg(f),c=document.createElement('canvas');c.width=c.height=z;const m=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,z,z);return c.toDataURL('image/jpeg',q);}
async function scaledBlob(f,max){const i=await loadImg(f),k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);return new Promise(ok=>c.toBlob(ok,'image/jpeg',.9));}

/* Fotoğraftan veli telefonu okuma (Tesseract.js, ilk kullanımda internetten yüklenir) */
const tessLoad=()=>window.Tesseract?Promise.resolve():new Promise((ok,no)=>{const e=document.createElement('script');e.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';e.onload=ok;e.onerror=()=>no(new Error('Metin okuma kütüphanesi yüklenemedi (internet?)'));document.head.appendChild(e);});
const fmtTel=n=>n.slice(0,4)+' '+n.slice(4,7)+' '+n.slice(7,9)+' '+n.slice(9);
function findPhones(text){
  let t=String(text);for(let k=0;k<2;k++)t=t.replace(/(\d)[Oo]/g,'$10').replace(/[Oo](\d)/g,'0$1').replace(/(\d)[lI|]/g,'$11').replace(/[lI|](\d)/g,'1$1');
  const out=[],seen={},re=/(?:\+?90[\s.\-]*)?0?[\s.\-]*\(?5\d{2}\)?[\s.\-]*\d{3}[\s.\-]*\d{2}[\s.\-]*\d{2}/g;
  t.split('\n').forEach(line=>{(line.match(re)||[]).forEach(m=>{let d=m.replace(/\D/g,'');if(d.startsWith('90')&&d.length>=12)d=d.slice(2);if(d.length===10)d='0'+d;if(d.length!==11||seen[d])return;seen[d]=1;out.push({n:d,line:line.replace(m,'').replace(/[\s|_]+/g,' ').trim().slice(0,40)});});});
  return out;
}

  const id=e.target.id;if(!['phF','ocrF','docF'].includes(id)||!e.target.files||!e.target.files[0])return;

  const box=ok?'<div class="text-center mt-3"><div class="text-sm">'+(v.bas?'Tahta açık · '+left+' dk kaldı':'Tahtada kod bekleniyor · '+left+' dk içinde girilmeli')+'</div><div class="text-5xl font-mono font-bold tracking-widest my-2">'+(k[1]===v.h?esc(k[0]):'••••••')+'</div>'+(k[1]===v.h?'':'<div class="text-xs text-slate-500">Kod bu cihazda kayıtlı değil. Bitirip yenisini oluşturun.</div>')+'<div class="flex gap-2 justify-center mt-2"><button data-act="bdplus" class="btn bg-indigo-600">+10 dk</button><button data-act="bdend" class="btn bg-red-600">⏹ Bitir</button></div></div>'
    :'<button data-act="bdcode" class="btn bg-emerald-600 !text-lg !py-3 w-full mt-3">📱 40 dk’lık kod oluştur ('+g.length+' öğrenci)</button>';
  return '<div class="card"><b>📱 Geçici tahta kodu</b><p class="text-sm text-slate-500 my-2">Telefondan ya da bilgisayardan kod oluşturun, tahtaya girilsin. Öğrenci ekranı kod girildiği andan itibaren 40 dakika açık kalır, sonra kendiliğinden kilitlenir. Kod oluşturulduktan sonra 30 dakika içinde girilmelidir. Kodu tahtadaki öğretmene ya da sorumlu kişiye iletebilirsiniz.</p>'+sel+box+'</div>'
   +'<div class="card"><b>🖥️ Bu cihaz akıllı tahta ise</b><p class="text-sm text-slate-500 my-2">Bir kez ayarlayın: cihaz kod bekleme ekranına geçer, çıkış için PIN ister. Sonraki derslerde yalnızca kod oluşturmanız yeterli.</p><div class="flex flex-wrap gap-2"><button data-act="bdstandby" class="btn bg-indigo-600 !text-base !py-3">🔒 Kodlu bekleme ekranına al</button><button data-act="bdstart" class="btn bg-slate-600 !text-base !py-3">Süresiz öğrenci ekranı ('+g.length+')</button></div></div>'
   +'<div class="card"><b>📊 Bugün tahtadan</b><div class="text-sm mt-1">Verilen +: <b>'+p+'</b> · Öğrencinin işaretlediği ödev: <b>'+h+'</b></div>'+(ch.length?'<div class="text-xs text-slate-500 mt-1">'+ch.join(' · ')+'</div>':'')+'<p class="text-xs text-slate-500 mt-2">Bu + puanlar Ders takibindeki puanlara eklenir. Öğrencinin işaretlediği ödevleri Ödev sayfasından kontrol edebilirsiniz.</p></div>';
}
reg('tahta','🧑‍🎓','Tahta Modu',()=>{
  G.date=bdNow();G.q='';
  if(!kioskOn())return bdSetup();if(lsg('kiosk_v1')==='2')return bdStandby();
  const a=bdSt(BD.id),b=bdSt(BD.sid);
  return BD.v==='stu'&&a?bdStu(a):BD.v==='soz'&&b?bdSozV(b):bdGrid();
});
const bx=document.createElement('div');bx.className='fixed inset-0 z-[400] hidden items-center justify-center bg-black/60 p-4';
bx.innerHTML='<div class="bg-white dark:bg-slate-800 rounded-2xl p-5 w-full max-w-sm text-center"><b class="text-lg">🔓 Öğretmen çıkışı</b><input id="bxIn" type="password" inputmode="numeric" maxlength="6" class="inp text-3xl text-center w-full mt-3" placeholder="PIN"><div id="bxMsg" class="min-h-[20px] text-red-600 text-sm my-1"></div><div class="flex gap-2"><button id="bxNo" class="btn bg-slate-500 flex-1">Vazgeç</button><button id="bxOk" class="btn bg-indigo-600 flex-1">Çık</button></div></div>';
document.body.appendChild(bx);
let bxF=0,bxU=0,sbF=0,sbU=0;
const bxClose=()=>{bx.classList.add('hidden');bx.classList.remove('flex');};
function bxExit(){bxF=0;bxClose();lss('kiosk_v1','0');lss('kiosk_h','');lss('kiosk_end','0');document.body.classList.remove('kiosk');try{if(document.fullscreenElement)document.exitFullscreen();}catch(e){}BD.v='grid';render(true);}
async function bxGo(){
  if(Date.now()<bxU){$('bxMsg').textContent='Çok fazla deneme, biraz bekleyin.';return;}
  if(await sha($('bxIn').value)===lsg('pin_v1'))bxExit();
  else{bxF++;$('bxIn').value='';$('bxMsg').textContent='Yanlış PIN';if(bxF>=5){bxU=Date.now()+30000;bxF=0;}}
}
$('bxNo').onclick=bxClose;$('bxOk').onclick=bxGo;$('bxIn').addEventListener('keydown',e=>{if(e.key==='Enter')bxGo();});
$('view').addEventListener('change',e=>{if(e.target.dataset.bd==='cap'){lss('tahta_cap',e.target.value);toast('Kaydedildi');}});
Object.assign(ACT,{
  async bdcode(){
    if(!S.room)return alert('Önce oda kodunu girin.');if(!grp().length)return alert('Bu seçimde öğrenci yok.');
    const c=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000),h=await sha(c);
    try{await auth();await bdSessRef().set({h:h,sn:G.sinif,sb:G.sube,cap:bdCap(),ol:firebase.database.ServerValue.TIMESTAMP,dk:40});}catch(e){return alert('Kod oluşturulamadı: '+e.message);}
    lss('tahta_kod',c+'|'+h);
  },
  bdplus(){const r=bdSessRef();if(r)r.child('dk').transaction(x=>(x||40)+10);},
  bdend(){const r=bdSessRef();if(r&&confirm('Tahta oturumu bitirilsin mi?'))r.remove();},
  async bdstandby(){if(!await bdPin())return;lss('kiosk_v1','2');lss('kiosk_h','');lss('kiosk_end','0');document.body.classList.add('kiosk');BD.v='grid';render(true);try{await document.documentElement.requestFullscreen();}catch(e){}},
  async bdenter(){
    const m=t=>{const e=$('sbMsg');if(e)e.textContent=t;},c=(($('sbIn')||{}).value||'').trim(),r=bdSessRef();
    if(Date.now()<sbU)return m('Çok fazla deneme, biraz bekleyin.');if(!r)return m('Oda bağlı değil.');
    let v=null;try{await auth();v=(await r.once('value')).val();}catch(e){return m('Bağlantı hatası.');}
    if(!v||v.h!==await sha(c)){sbF++;if(sbF>=5){sbU=Date.now()+30000;sbF=0;}return m('Kod yanlış.');}
    const now=bdSrv(),dk=v.dk||40;
    if(v.bas?v.bas+dk*6e4<=now:(v.ol||now)+30*6e4<now)return m('Kodun süresi dolmuş.');
    if(!v.bas)r.child('bas').set(firebase.database.ServerValue.TIMESTAMP);
    const end=(v.bas||now)+dk*6e4;sbF=0;
    G.sinif=v.sn||'ALL';G.sube=v.sb||'ALL';lss('tahta_cap',String(v.cap||2));lss('kiosk_h',v.h);lss('kiosk_end',String(Date.now()+end-now));lss('kiosk_v1','1');
    BD.v='grid';BD.t=Date.now();render(true);try{await document.documentElement.requestFullscreen();}catch(e){}
  },
  async bdstart(){
    if(!grp().length)return alert('Bu seçimde öğrenci yok.');
    if(!lsg('pin_v1')){const a=prompt('Tahtadan çıkış için 4-6 haneli bir PIN belirleyin:');if(a===null)return;if(!/^\d{4,6}$/.test(a))return alert('PIN 4-6 rakam olmalı.');lss('pin_v1',await sha(a));}
    lss('kiosk_v1','1');lss('kiosk_h','');lss('kiosk_end','0');document.body.classList.add('kiosk');BD.v='grid';BD.t=Date.now();render(true);
    try{await document.documentElement.requestFullscreen();}catch(e){}
  },
  bdpick(a){const s=bdSt(a.dataset.id);if(!s)return;if(sozPas(s))return toast('Bugün yoklamada yok görünüyor',1);BD.v='stu';BD.id=s.id;BD.t=Date.now();render(true);},
  bdback(){BD.v='grid';render(true);},
  bdfeed(a){const s=bdSt(a.dataset.id);if(!s||BD.v!=='stu'||BD.id!==s.id)return;BD.t=Date.now();bdPlus(s,'yem');render(true);},
  bdhw(a){const s=bdSt(a.dataset.id),h=a.dataset.h;if(!s||!h||BD.v!=='stu'||BD.id!==s.id)return;BD.t=Date.now();s.hwStatus=s.hwStatus||{};s.hwSelf=s.hwSelf||{};
    if(s.hwSelf[h]&&s.hwStatus[h]==='Yapti'){delete s.hwStatus[h];delete s.hwSelf[h];}
    else if(!s.hwStatus[h]){s.hwStatus[h]='Yapti';s.hwSelf[h]=bdNow();}
    save();render(true);},
  bdsoz(){const g=grp().filter(s=>!sozPas(s));if(!g.length)return toast('Uygun öğrenci yok',1);
    let r=Math.max(1,...g.map(s=>s.sozT||0)),e=g.filter(s=>(s.sozT||0)!==r);if(!e.length){r++;e=g;}
    const s=e[Math.floor(Math.random()*e.length)];s.sozT=r;s.soz=(s.soz||0)+1;BD.v='soz';BD.sid=s.id;BD.given=false;BD.t=Date.now();save();render(true);},
  bdok(){const s=bdSt(BD.sid);if(!s||BD.given)return;BD.given=true;bdPlus(s,'soz');render(true);},
  bdfs(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(e){}},
  bdexit(){if(!lsg('pin_v1'))return bxExit();bx.classList.remove('hidden');bx.classList.add('flex');$('bxIn').value='';$('bxMsg').textContent='';setTimeout(()=>$('bxIn').focus(),50);}
});
setInterval(()=>{
  bdWatch();
  if(lsg('kiosk_v1')==='1'){const e=+lsg('kiosk_end')||0;if(e&&Date.now()>e)return bdEnd();const el=$('bdLeft');if(el)el.textContent=bdLeftTxt();}
  if(kioskOn()&&S.page==='tahta'&&BD.v!=='grid'&&Date.now()-BD.t>(BD.v==='stu'?45000:90000)){BD.v='grid';render(true);}
  if(!kioskOn()&&S.page==='tahta'&&BD.sess)render();
},5000);
$('view').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='sbIn')ACT.bdenter();});

const PK=new URLSearchParams(location.search).get('k');
if(PK)parentView(PK);else{go(kioskOn()?'tahta':'home');if(S.room)listen(S.room);else room();}
</script>
</body>
